<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LDFP Gestão — Login Administrativo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; }
    .login-card { background: #1e293b; padding: 40px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 100%; max-width: 400px; border: 1px solid #334155; }
    .login-logo { text-align: center; margin-bottom: 24px; }
    .login-logo-icon { display: inline-flex; align-items: center; justify-content: center; width: 52px; height: 52px; background: linear-gradient(135deg, #2563eb, #38bdf8); color: #fff; border-radius: 12px; font-weight: 800; font-size: 26px; margin-bottom: 12px; }
    .login-brand { font-size: 22px; font-weight: 800; color: #fff; }
    .login-brand-sub { font-size: 13px; color: #94a3b8; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .login-form-label { display: block; margin-bottom: 6px; font-size: 12px; color: #cbd5e1; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .login-input { width: 100%; padding: 12px 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #fff; font-size: 14px; box-sizing: border-box; transition: 0.2s; }
    .login-input:focus { outline: none; border-color: #38bdf8; box-shadow: 0 0 0 3px rgba(56,189,248,0.2); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; font-size: 14px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn-ouro { background: linear-gradient(135deg, #f59e0b, #d97706); color: #111; }
    .btn-ouro:hover { filter: brightness(1.1); }
    .login-error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 8px; font-size: 13px; font-weight: 600; margin-bottom: 20px; display: none; border: 1px solid #fca5a5; }
    .login-versiculo { text-align: center; font-size: 12px; color: #64748b; margin-top: 24px; font-style: italic; }
  </style>
</head>
<body class="login-page">

  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">L</div>
      <div class="login-brand">LDFP Master</div>
      <div class="login-brand-sub">Acesso Exclusivo Super-Admin</div>
    </div>

    <div id="loginError" class="login-error"></div>

    <div class="form-group">
      <label class="login-form-label">E-mail</label>
      <input id="email" type="email" class="login-input" placeholder="admin@ldfp.com.br" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="login-form-label">Senha</label>
      <input id="password" type="password" class="login-input" placeholder="••••••••" autocomplete="current-password">
    </div>

    <button id="btnLogin" class="btn btn-ouro" style="margin-top: 10px;">
      <i class="fa-solid fa-shield-halved"></i> Entrar no Painel Master
    </button>

    <p class="login-versiculo">
      Sistemas LDFP Gestão
    </p>
  </div>

  <script src="session.js"></script>
  <script>
    const btn = document.getElementById('btnLogin');
    const errorBox = document.getElementById('loginError');

    function showError(msg) {
      errorBox.textContent = msg;
      errorBox.style.display = 'block';
    }

    async function doLogin() {
      errorBox.style.display = 'none';
      const email    = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) {
        return showError('Informe e-mail e senha para continuar.');
      }

      btn.disabled = true;
      btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Autenticando...';

      try {
        const res  = await fetch('/api/admin/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Credenciais inválidas');

        if (window.saveAuthSession) window.saveAuthSession(data);
        window.location.href = 'super-admin.html';
      } catch (err) {
        showError(err.message || 'Erro ao conectar. Tente novamente.');
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-shield-halved"></i> Entrar no Painel Master';
      }
    }

    btn.addEventListener('click', doLogin);
    document.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
  </script>
</body>
</html>
