<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Agenda & Eventos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand:   #0f766e;
            --teal:    #0d9488;
            --cyan:    #0ea5e9;
            --green:   #10b981;
            --red:     #dc2626;
            --yellow:  #f59e0b;
            --purple:  #8b5cf6;
            --surface: #ffffff;
            --bg:      #f1f5f9;
            --border:  #e2e8f0;
            --text:    #0f172a;
            --muted:   #64748b;
            --radius:  14px;
            --shadow:  0 4px 16px rgba(15,23,42,.08);
            --shadow-lg: 0 12px 32px rgba(15,23,42,.14);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .page-wrap {
            padding: 24px 28px 48px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Cabeçalho */
        .page-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }

        .page-header-left h2 {
            font-size: 22px;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .page-header-left h2 i { color: var(--teal); }
        .page-header-left p { font-size: 13px; color: var(--muted); margin-top: 4px; }

        .header-actions { display: flex; gap: 8px; flex-wrap: wrap; }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 9px 15px;
            border-radius: 8px;
            border: none;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all .2s;
            white-space: nowrap;
        }
        .btn:disabled { opacity: .5; cursor: not-allowed; }
        .btn-primary { background: linear-gradient(90deg, var(--brand), var(--teal)); color: #fff; }
        .btn-primary:hover { opacity: .9; }
        .btn-ghost { background: var(--bg); color: var(--muted); border: 1.5px solid var(--border); }
        .btn-ghost:hover { background: var(--border); }
        .btn-danger { background: #fff; color: var(--red); border: 1.5px solid var(--red); }
        .btn-danger:hover { background: var(--red); color: #fff; }
        .btn-sm { padding: 7px 11px; font-size: 12px; border-radius: 7px; }

        /* Layout principal */
        .agenda-layout {
            display: grid;
            grid-template-columns: 1fr 340px;
            gap: 20px;
            align-items: start;
        }
        @media (max-width: 960px) { .agenda-layout { grid-template-columns: 1fr; } }

        /* Panel base */
        .panel {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            overflow: hidden;
        }

        .panel-header {
            padding: 14px 18px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .panel-title {
            font-size: 14px;
            font-weight: 700;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .panel-title i { color: var(--teal); }

        /* Calendário */
        .cal-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .cal-month {
            font-size: 15px;
            font-weight: 800;
            color: var(--text);
            min-width: 160px;
            text-align: center;
        }

        .cal-grid {
            padding: 16px;
        }

        .cal-weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            margin-bottom: 6px;
        }

        .cal-weekday {
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
            padding: 4px 0;
        }

        .cal-days {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }

        .cal-cell {
            min-height: 72px;
            border-radius: 10px;
            padding: 6px;
            border: 1.5px solid transparent;
            cursor: pointer;
            transition: all .15s;
            background: var(--bg);
            position: relative;
        }
        .cal-cell:hover { border-color: var(--teal); background: #f0fdfa; }
        .cal-cell.other-month { opacity: .35; cursor: default; }
        .cal-cell.today { border-color: var(--teal); background: #f0fdfa; }
        .cal-cell.selected {
            border-color: var(--brand);
            background: #ccfbf1;
            box-shadow: 0 0 0 2px rgba(15,118,110,.15);
        }

        .cal-day-num {
            font-size: 12px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 3px;
        }
        .cal-cell.today .cal-day-num {
            color: var(--brand);
        }
        .cal-cell.other-month .cal-day-num { color: var(--muted); }

        .cal-event-tag {
            display: block;
            font-size: 10px;
            background: var(--teal);
            color: #fff;
            border-radius: 4px;
            padding: 1px 5px;
            margin-top: 2px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .cal-more {
            font-size: 10px;
            color: var(--muted);
            margin-top: 2px;
        }

        /* Painel lateral de eventos do dia */
        .day-panel { display: flex; flex-direction: column; }

        .day-label {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
        }

        .day-events {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-height: 520px;
            overflow-y: auto;
        }

        .event-card {
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            padding: 12px 14px;
            position: relative;
            border-left: 4px solid var(--teal);
        }

        .event-card h4 {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 4px;
        }

        .event-card p {
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 2px;
        }

        .event-card-actions {
            display: flex;
            gap: 6px;
            margin-top: 8px;
        }

        .empty-day {
            text-align: center;
            padding: 40px 20px;
            color: var(--muted);
            font-size: 13px;
        }
        .empty-day i { font-size: 1.8rem; color: #cbd5e1; display: block; margin-bottom: 10px; }

        /* Status */
        .status-bar {
            font-size: 12px;
            padding: 8px 14px;
            border-top: 1px solid var(--border);
            color: var(--muted);
            min-height: 34px;
        }
        .status-bar.error { color: var(--red); }
        .status-bar.ok { color: var(--green); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(2,6,23,.6);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-overlay.show { display: flex; }

        .modal {
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow-lg);
            width: min(96vw, 540px);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .modal-head {
            padding: 16px 20px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .modal-head h3 {
            font-size: 16px;
            font-weight: 800;
            color: var(--text);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .modal-head h3 i { color: var(--teal); }

        .modal-close {
            background: none;
            border: none;
            color: var(--muted);
            font-size: 1.1rem;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
        }
        .modal-close:hover { background: var(--bg); color: var(--text); }

        .modal-body {
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .field { display: flex; flex-direction: column; gap: 5px; }
        .field label {
            font-size: 11px;
            font-weight: 700;
            color: var(--muted);
            text-transform: uppercase;
        }
        .field input,
        .field select,
        .field textarea {
            padding: 10px 12px;
            border: 1.5px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            color: var(--text);
            background: var(--bg);
            font-family: inherit;
            transition: border-color .2s;
        }
        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            outline: none;
            border-color: var(--teal);
            background: #fff;
        }
        .field textarea { min-height: 80px; resize: vertical; }

        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .modal-foot {
            padding: 14px 20px;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
        }

        .form-msg {
            font-size: 12px;
            color: var(--red);
            min-height: 18px;
        }

        /* Tipo badge */
        .tipo-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 999px;
        }
        .tipo-culto    { background: #dbeafe; color: #1d4ed8; }
        .tipo-reuniao  { background: #fef3c7; color: #92400e; }
        .tipo-evento   { background: #d1fae5; color: #065f46; }
        .tipo-outro    { background: #f1f5f9; color: #475569; }

        /* Loading */
        .loading-spinner {
            text-align: center;
            padding: 40px;
            color: var(--muted);
            font-size: 13px;
        }
        .loading-spinner i { font-size: 1.5rem; display: block; margin-bottom: 10px; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>

      data-shell-title="Agenda"

<main class="main-content enterprise-main">
<div class="page-wrap">

    <!-- Cabeçalho -->

            <h2><i class="fa-solid fa-calendar-days"></i> Agenda & Eventos</h2>

        <div class="header-actions">

    <!-- Layout principal -->

        <!-- Calendário -->

                <div class="panel-title">
                    <i class="fa-solid fa-calendar"></i>
                    <span id="calMonthLabel">Carregando...</span>
                </div>
                <div class="cal-nav">

            </div>

            <div class="cal-grid">
                <div class="cal-weekdays">
                    <div class="cal-weekday">Dom</div>
                    <div class="cal-weekday">Seg</div>
                    <div class="cal-weekday">Ter</div>
                    <div class="cal-weekday">Qua</div>

            <div class="status-bar" id="statusBar"></div>

        <!-- Painel lateral do dia -->

                <button class="btn btn-primary btn-sm" id="btnNovoNoDia">

            <div class="day-events" id="dayEvents">

            </div>

    </div>

</div>
</main>

<!-- Modal novo/editar evento -->
<div class="modal-overlay" id="eventModal">
    <div class="modal">
        <div class="modal-head">
            <h3><i class="fa-solid fa-calendar-plus"></i> <span id="modalTitle">Novo Evento</span></h3>
            <button class="modal-close" id="btnModalClose"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <div class="modal-body">
            <input type="hidden" id="eventId">
            <div class="field">
                <label>Título do evento *</label>
                <input type="text" id="titulo" placeholder="Ex: Culto de Domingo, Reunião de Líderes...">
            </div>
            <div class="field">
                <label>Tipo</label>
                <select id="tipo">
                    <option value="Culto">Culto</option>
                    <option value="Reunião">Reunião</option>
                    <option value="Evento">Evento Especial</option>
                    <option value="EBD">EBD</option>
                    <option value="Outro">Outro</option>
                </select>
            </div>
            <div class="grid-2">
                <div class="field">
                    <label>Início *</label>
                    <input type="datetime-local" id="inicio">
                </div>
                <div class="field">
                    <label>Fim *</label>
                    <input type="datetime-local" id="fim">
                </div>
            </div>
            <div class="field">
                <label>Local</label>
                <input type="text" id="local" placeholder="Ex: Templo principal, Sala 3...">
            </div>
            <div class="field">
                <label>Descrição</label>
                <textarea id="descricao" placeholder="Detalhes adicionais sobre o evento..."></textarea>
            </div>
        </div>
        <div class="modal-foot">
            <span class="form-msg" id="formMessage"></span>
            <div style="display:flex;gap:8px">
                <button class="btn btn-ghost" id="btnCancelar">Cancelar</button>
                <button class="btn btn-primary" id="btnSalvarEvento">
                    <i class="fa-solid fa-floppy-disk"></i> Salvar
                </button>
            </div>
        </div>
    </div>
</div>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script>
    requireAuthSession();

    /* ── Helpers ── */
    const $ = id => document.getElementById(id);

    const MESES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho',
                   'Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
    const DIAS  = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];

    let currentMonth = new Date();
    currentMonth.setDate(1);

    let selectedDate  = new Date();
    let monthEvents   = [];

    /* ── Formatação ── */
    const toInputDT = iso => {
        const d = new Date(iso);
        const pad = n => String(n).padStart(2,'0');
        return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    };

    const toApiDT = local => {
        if (!local) return '';
        return new Date(local).toISOString();
    };

    const fmtDateTime = iso => {
        if (!iso) return '-';
        const d = new Date(iso);
        return d.toLocaleString('pt-BR', { dateStyle:'short', timeStyle:'short' });
    };

    const fmtDate = d => `${DIAS[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`;

    const isSameDay = (d1, d2) =>
        d1.getFullYear() === d2.getFullYear() &&
        d1.getMonth()    === d2.getMonth()    &&
        d1.getDate()     === d2.getDate();

    const eventMatchesDay = (ev, d) => {
        const s = new Date(ev.inicio);
        const e = new Date(ev.fim);
        const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
        const dayEnd = new Date(day.getTime() + 86400000 - 1);
        return s <= dayEnd && e >= day;
    };

    const tipoCls = tipo => {
        const map = { Culto:'culto', Reunião:'reuniao', Evento:'evento' };
        return map[tipo] || 'outro';
    };

    /* ── Status bar ── */
    const setStatus = (msg, type='') => {
        const el = $('statusBar');
        el.textContent = msg || '';
        el.className = 'status-bar' + (type ? ' ' + type : '');
    };

    /* ── Renderizar calendário ── */
    const renderCalendar = () => {
        $('calMonthLabel').textContent = `${MESES[currentMonth.getMonth()]} ${currentMonth.getFullYear()}`;

        const firstDay = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
        const lastDay  = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+1, 0);
        const today    = new Date();

        const grid = $('calDays');
        grid.innerHTML = '';

        /* Preencher dias anteriores */
        let startDow = firstDay.getDay();
        for (let i = startDow - 1; i >= 0; i--) {
            const d = new Date(firstDay);
            d.setDate(d.getDate() - i - 1);
            grid.appendChild(buildCell(d, true));
        }

        /* Dias do mês */
        for (let d = 1; d <= lastDay.getDate(); d++) {
            const date = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), d);
            grid.appendChild(buildCell(date, false));
        }

        /* Completar linha final */
        const total = startDow + lastDay.getDate();
        const remaining = total % 7 === 0 ? 0 : 7 - (total % 7);
        for (let i = 1; i <= remaining; i++) {
            const d = new Date(lastDay);
            d.setDate(d.getDate() + i);
            grid.appendChild(buildCell(d, true));
        }
    };

    const buildCell = (date, otherMonth) => {
        const cell = document.createElement('div');
        cell.className = 'cal-cell' +
            (otherMonth ? ' other-month' : '') +
            (isSameDay(date, new Date()) ? ' today' : '') +
            (isSameDay(date, selectedDate) ? ' selected' : '');

        const num = document.createElement('div');
        num.className = 'cal-day-num';
        num.textContent = date.getDate();
        cell.appendChild(num);

        if (!otherMonth) {
            const evs = monthEvents.filter(e => eventMatchesDay(e, date));
            evs.slice(0,2).forEach(ev => {
                const tag = document.createElement('span');
                tag.className = 'cal-event-tag';
                tag.textContent = ev.titulo;
                cell.appendChild(tag);
            });
            if (evs.length > 2) {
                const more = document.createElement('div');
                more.className = 'cal-more';
                more.textContent = `+${evs.length - 2} mais`;
                cell.appendChild(more);
            }

            cell.addEventListener('click', () => {
                selectedDate = date;
                renderCalendar();
                renderDayEvents();
            });
        }

        return cell;
    };

    /* ── Renderizar eventos do dia ── */
    const renderDayEvents = () => {
        $('dayLabel').textContent = fmtDate(selectedDate);
        const evs = monthEvents.filter(e => eventMatchesDay(e, selectedDate));
        const container = $('dayEvents');

        if (!evs.length) {
            container.innerHTML = `
                <div class="empty-day">
                    <i class="fa-regular fa-calendar-xmark"></i>
                    Nenhum evento neste dia.
                </div>`;
            return;
        }

        container.innerHTML = evs.map(ev => `
            <div class="event-card">
                <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:6px">
                    <span class="tipo-badge tipo-${tipoCls(ev.tipo || 'Culto')}">
                        <i class="fa-solid fa-circle" style="font-size:6px"></i>
                        ${ev.tipo || 'Culto'}
                    </span>
                </div>
                <h4>${ev.titulo}</h4>
                <p><i class="fa-regular fa-clock" style="margin-right:4px"></i>
                   ${fmtDateTime(ev.inicio)} → ${fmtDateTime(ev.fim)}</p>
                ${ev.local ? `<p><i class="fa-solid fa-location-dot" style="margin-right:4px"></i>${ev.local}</p>` : ''}
                ${ev.descricao ? `<p style="margin-top:4px">${ev.descricao}</p>` : ''}
                <div class="event-card-actions">
                    <button class="btn btn-ghost btn-sm" data-edit="${ev.id}">
                        <i class="fa-solid fa-pen"></i> Editar
                    </button>
                    <button class="btn btn-danger btn-sm" data-del="${ev.id}">
                        <i class="fa-solid fa-trash-can"></i> Excluir
                    </button>
                </div>
            </div>
        `).join('');

        container.querySelectorAll('[data-edit]').forEach(btn => {
            btn.addEventListener('click', () => openModal(Number(btn.dataset.edit)));
        });
        container.querySelectorAll('[data-del]').forEach(btn => {
            btn.addEventListener('click', () => removeEvent(Number(btn.dataset.del)));
        });
    };

    /* ── API ── */
    const fetchMonthEvents = async () => {
        const start = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
        const end   = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+1, 1);
        const q = new URLSearchParams({ start: start.toISOString(), end: end.toISOString() });

        const res = await fetch(`/agenda/eventos?${q}`);
        if (!res.ok) throw new Error('Falha ao carregar agenda.');
        monthEvents = await res.json();
    };

    const refreshAgenda = async () => {
        try {
            setStatus('Carregando...');
            await fetchMonthEvents();
            renderCalendar();
            renderDayEvents();
            setStatus(`${monthEvents.length} evento(s) em ${MESES[currentMonth.getMonth()]}.`, 'ok');
        } catch (err) {
            setStatus(err.message, 'error');
        }
    };

    /* ── Modal ── */
    const openModal = (id = null) => {
        $('formMessage').textContent = '';
        $('eventId').value = '';

        if (id) {
            const ev = monthEvents.find(e => Number(e.id) === Number(id));
            if (!ev) return;
            $('modalTitle').textContent = 'Editar Evento';
            $('eventId').value   = String(ev.id);
            $('titulo').value    = ev.titulo || '';
            $('tipo').value      = ev.tipo   || 'Culto';
            $('inicio').value    = toInputDT(ev.inicio);
            $('fim').value       = toInputDT(ev.fim);
            $('local').value     = ev.local  || '';
            $('descricao').value = ev.descricao || '';
        } else {
            $('modalTitle').textContent = 'Novo Evento';
            const start = new Date(selectedDate.getFullYear(), selectedDate.getMonth(), selectedDate.getDate(), 19, 0);
            const end   = new Date(start.getTime() + 7200000);
            $('titulo').value    = '';
            $('tipo').value      = 'Culto';
            $('inicio').value    = toInputDT(start.toISOString());
            $('fim').value       = toInputDT(end.toISOString());
            $('local').value     = '';
            $('descricao').value = '';
        }

        $('eventModal').classList.add('show');
    };

    const closeModal = () => $('eventModal').classList.remove('show');

    const salvarEvento = async () => {
        $('formMessage').textContent = '';
        const id      = $('eventId').value;
        const titulo  = $('titulo').value.trim();
        const tipo    = $('tipo').value;
        const inicio  = toApiDT($('inicio').value);
        const fim     = toApiDT($('fim').value);
        const local   = $('local').value.trim();
        const descricao = $('descricao').value.trim();

        if (!titulo || !inicio || !fim) {
            $('formMessage').textContent = 'Preencha título, início e fim.';
            return;
        }

        const url    = id ? `/agenda/eventos/${id}` : '/agenda/eventos';
        const method = id ? 'PUT' : 'POST';

        const res = await fetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ titulo, tipo, inicio, fim, local, descricao })
        });

        if (!res.ok) {
            const d = await res.json().catch(() => ({}));
            $('formMessage').textContent = d.error || 'Não foi possível salvar.';
            return;
        }

        closeModal();
        await refreshAgenda();
    };

    const removeEvent = async id => {
        if (!confirm('Deseja excluir este evento?')) return;
        const res = await fetch(`/agenda/eventos/${id}`, { method: 'DELETE' });
        if (!res.ok) { alert('Não foi possível excluir o evento.'); return; }
        await refreshAgenda();
    };

    /* ── Eventos UI ── */
    $('btnNovoEvento').addEventListener('click', () => openModal());
    $('btnNovoNoDia').addEventListener('click', () => openModal());
    $('btnModalClose').addEventListener('click', closeModal);
    $('btnCancelar').addEventListener('click', closeModal);
    $('btnSalvarEvento').addEventListener('click', salvarEvento);

    $('eventModal').addEventListener('click', e => {
        if (e.target === $('eventModal')) closeModal();
    });

    $('btnHoje').addEventListener('click', () => {
        currentMonth = new Date();
        currentMonth.setDate(1);
        selectedDate = new Date();
        refreshAgenda();
    });

    $('btnPrev').addEventListener('click', () => {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth()-1, 1);
        selectedDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
        refreshAgenda();
    });

    $('btnNext').addEventListener('click', () => {
        currentMonth = new Date(currentMonth.getFullYear(), currentMonth.getMonth()+1, 1);
        selectedDate = new Date(currentMonth.getFullYear(), currentMonth.getMonth(), 1);
        refreshAgenda();
    });

    /* ── Init ── */
    refreshAgenda();
</script>
</body>
</html>
