<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>LDFP - Login do Membro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #101826;
      --bg-card: #141d2b;
      --accent: #f97316;
      --accent-soft: #fed7aa;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2933;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 8px 20px rgba(0,0,0,0.35);
      --error-red: #ef4444;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-container {
      max-width: 380px;
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 30px;
      border: 1px solid rgba(15,23,42,0.7);
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    .login-logo {
      width: 120px;
      height: auto;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 10px rgba(249,115,22,0.5));
    }

    .login-container h1 {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 10px;
      color: var(--text);
    }

    .login-container p {
      font-size: 14px;
      color: var(--muted);
      margin-bottom: 25px;
    }

    .input-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .input-group label {
      display: block;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 6px;
    }

    .input-field {
      width: 100%;
      padding: 12px 15px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px 15px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-primary {
      background: var(--accent);
      color: #111827;
      border: none;
    }

    .btn-primary:hover { background: #e06a14; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .link-forgot {
      display: block;
      margin-top: 15px;
      font-size: 13px;
      color: var(--accent-soft);
      text-decoration: none;
    }

    .link-forgot:hover { text-decoration: underline; }

    .error-message {
      color: var(--error-red);
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }

    .success-message {
      color: #22c55e;
      font-size: 13px;
      margin-top: 15px;
      display: none;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <img id="churchLogo" src="" alt="Logo da Igreja" class="login-logo"
         onerror="this.style.display='none'">
    <h1>Acesso do Membro</h1>
    <p>Entre com seu CPF e senha para acessar o aplicativo.</p>

    <form id="loginForm">
      <div class="input-group">
        <label for="igrejaNome">Igreja <span style="color:var(--muted);font-size:12px;">(opcional)</span></label>
        <input type="text" id="igrejaNome" class="input-field"
               placeholder="Nome da igreja, se solicitado">
      </div>
      <div class="input-group">
        <label for="cpf">CPF</label>
        <input type="text" id="cpf" class="input-field"
               placeholder="Seu CPF (somente números)"
               required pattern="\d{11}"
               title="Digite seu CPF com 11 dígitos, somente números."
               inputmode="numeric" maxlength="11">
      </div>
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" class="input-field"
               placeholder="Sua senha" required>
      </div>

      <button type="submit" class="btn btn-primary" id="loginButton">Entrar</button>

      <a href="#" class="link-forgot" id="toggleFirstAccess">Primeiro acesso? Criar senha do App</a>
      <div id="message" class="error-message"></div>
    </form>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    const loginForm = $('loginForm');
    const cpfInput = $('cpf');
    const passwordInput = $('password');
    const loginButton = $('loginButton');
    const messageDiv = $('message');
    const churchLogo = $('churchLogo');

    // Carrega logo salva no localStorage
    const logoUrl = localStorage.getItem('church_logo_url');
    if (logoUrl) churchLogo.src = logoUrl;

    function showMessage(msg, type = 'error') {
      messageDiv.textContent = msg;
      messageDiv.className = type === 'error' ? 'error-message' : 'success-message';
      messageDiv.style.display = 'block';
    }

    // Simulação de autenticação
    // Para integrar com o backend real: substitua por fetch('/api/app/login', { method:'POST', ... })
    function authenticateUser(cpf, password) {
      return new Promise((resolve, reject) => {
        setTimeout(() => {
          if (cpf === '11122233344' && password === '111222') {
            resolve({
              success: true,
              user: { id: 'membro123', nome: 'Leonardo', cpf },
              token: 'fake-jwt-token-123'
            });
          } else {
            reject(new Error('CPF ou senha incorretos.'));
          }
        }, 1000);
      });
    }

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      messageDiv.style.display = 'none';
      loginButton.disabled = true;
      loginButton.textContent = 'Entrando...';

      const cpf = cpfInput.value.replace(/\D/g, '');
      const password = passwordInput.value;

      if (cpf.length !== 11) {
        showMessage('CPF deve ter 11 dígitos.');
        loginButton.disabled = false;
        loginButton.textContent = 'Entrar';
        return;
      }

      try {
        const result = await authenticateUser(cpf, password);
        if (result.success) {
          localStorage.setItem('app_member_token', result.token);
          localStorage.setItem('app_member_user', JSON.stringify(result.user));
          showMessage('Login bem-sucedido! Redirecionando...', 'success');
          // ▶ Redireciona para o app do membro (layout novo)
          window.location.href = 'app_membro_v2.html';
        }
      } catch (error) {
        showMessage(error.message);
      } finally {
        loginButton.disabled = false;
        loginButton.textContent = 'Entrar';
      }
    });
  </script>
</body>
</html>
