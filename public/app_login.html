<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>LDFP - Login do Membro</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg-main: #101826;
      --bg-card: #141d2b;
      --accent: #f97316;
      --accent-soft: #fed7aa;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #1f2933;
      --radius-lg: 18px;
      --radius-md: 12px;
      --shadow-soft: 0 8px 20px rgba(0,0,0,0.35);
      --error-red: #ef4444;
      --success-green: #22c55e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg-main);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      max-width: 380px;
      width: 100%;
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      padding: 30px;
      border: 1px solid rgba(15,23,42,0.7);
      box-shadow: var(--shadow-soft);
      text-align: center;
    }

    .login-logo {
      width: 120px;
      height: auto;
      margin-bottom: 25px;
      filter: drop-shadow(0 0 10px rgba(249,115,22,0.5));
    }

    .card h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .card p { font-size: 14px; color: var(--muted); margin-bottom: 24px; }

    .input-group { margin-bottom: 16px; text-align: left; }
    .input-group label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }

    .input-field {
      width: 100%;
      padding: 12px 15px;
      background: #020617;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text);
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }
    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: var(--muted); }

    .btn {
      width: 100%;
      padding: 14px;
      border-radius: var(--radius-md);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background 0.2s, opacity 0.2s;
    }
    .btn-primary { background: var(--accent); color: #111827; }
    .btn-primary:hover:not(:disabled) { background: #e06a14; }
    .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }

    .msg {
      font-size: 13px;
      margin-top: 14px;
      display: none;
      padding: 10px 12px;
      border-radius: var(--radius-md);
    }
    .msg.error  { background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.25); color: #fca5a5; display: block; }
    .msg.success{ background: rgba(34,197,94,0.12); border: 1px solid rgba(34,197,94,0.25); color: #86efac; display: block; }

    .hint { display: block; margin-top: 14px; font-size: 13px; color: var(--accent-soft); }

    .screen { display: none; }
    .screen.active { display: block; }
  </style>
</head>
<body>
  <div class="card">
    <img id="churchLogo" src="" alt="" class="login-logo" onerror="this.style.display='none'">

    <!-- TELA 1: Login -->
    <div id="screenLogin" class="screen active">
      <h1>Acesso do Membro</h1>
      <p>Entre com seu CPF e senha para acessar o aplicativo.</p>

      <form id="loginForm">
        <div class="input-group">
          <label for="igrejaNome">Igreja <span style="font-size:12px;color:var(--muted)">(opcional)</span></label>
          <input type="text" id="igrejaNome" class="input-field" placeholder="Nome da igreja, se solicitado">
        </div>
        <div class="input-group">
          <label for="cpf">CPF</label>
          <input type="text" id="cpf" class="input-field" placeholder="Somente números" required
                 inputmode="numeric" maxlength="11">
        </div>
        <div class="input-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" class="input-field" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn btn-primary" id="loginBtn">Entrar</button>
        <span class="hint">Primeiro acesso? Use os 6 primeiros dígitos do CPF como senha.</span>
        <div id="loginMsg" class="msg"></div>
      </form>
    </div>

    <!-- TELA 2: Troca de senha obrigatória -->
    <div id="screenTrocar" class="screen">
      <h1>Crie sua senha</h1>
      <p>Por segurança, defina uma senha pessoal antes de continuar.</p>

      <form id="trocarForm">
        <div class="input-group">
          <label for="novaSenha">Nova senha</label>
          <input type="password" id="novaSenha" class="input-field" placeholder="Mínimo 6 caracteres" required minlength="6">
        </div>
        <div class="input-group">
          <label for="confirmarSenha">Confirmar senha</label>
          <input type="password" id="confirmarSenha" class="input-field" placeholder="Repita a senha" required>
        </div>
        <button type="submit" class="btn btn-primary" id="trocarBtn">Salvar senha e entrar</button>
        <div id="trocarMsg" class="msg"></div>
      </form>
    </div>
  </div>

  <script>
    (function () {
      const logo = document.getElementById('churchLogo');
      const logoUrl = localStorage.getItem('church_logo_url');
      if (logoUrl) logo.src = logoUrl;

      let tempToken = null;

      function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
      }

      function showMsg(elId, text, type) {
        const el = document.getElementById(elId);
        el.textContent = text;
        el.className = 'msg ' + type;
      }

      function clearMsg(elId) {
        const el = document.getElementById(elId);
        el.className = 'msg';
        el.textContent = '';
      }

      // ── Tela 1: Login ─────────────────────────────────────────────
      document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg('loginMsg');

        const cpf   = document.getElementById('cpf').value.replace(/\D/g, '');
        const senha = document.getElementById('senha').value;
        const igrejaNome = document.getElementById('igrejaNome').value.trim();

        if (cpf.length !== 11) {
          showMsg('loginMsg', 'CPF deve ter 11 dígitos.', 'error');
          return;
        }

        const btn = document.getElementById('loginBtn');
        btn.disabled = true;
        btn.textContent = 'Entrando...';

        try {
          const body = { cpf, senha };
          if (igrejaNome) body.igreja_nome = igrejaNome;

          const resp = await fetch('/app-membro/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(body)
          });

          const data = await resp.json();

          if (!resp.ok) {
            showMsg('loginMsg', data?.error || data?.message || 'CPF ou senha incorretos.', 'error');
            return;
          }

          tempToken = data.token;
          localStorage.setItem('app_member_token', data.token);
          localStorage.setItem('app_member_user', JSON.stringify(data.membro));

          if (data.precisa_trocar) {
            showScreen('screenTrocar');
          } else {
            window.location.href = 'app_membro_v2.html';
          }

        } catch (err) {
          showMsg('loginMsg', 'Erro de conexão. Tente novamente.', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Entrar';
        }
      });

      // ── Tela 2: Trocar senha ───────────────────────────────────────
      document.getElementById('trocarForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        clearMsg('trocarMsg');

        const novaSenha     = document.getElementById('novaSenha').value;
        const confirmarSenha = document.getElementById('confirmarSenha').value;

        if (novaSenha.length < 6) {
          showMsg('trocarMsg', 'A senha deve ter pelo menos 6 caracteres.', 'error');
          return;
        }
        if (novaSenha !== confirmarSenha) {
          showMsg('trocarMsg', 'As senhas não coincidem.', 'error');
          return;
        }

        const btn = document.getElementById('trocarBtn');
        btn.disabled = true;
        btn.textContent = 'Salvando...';

        try {
          const resp = await fetch('/app-membro/trocar-senha', {
            method: 'PUT',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + tempToken
            },
            body: JSON.stringify({ novaSenha })
          });

          const data = await resp.json();

          if (!resp.ok) {
            showMsg('trocarMsg', data?.error || 'Erro ao salvar senha.', 'error');
            return;
          }

          showMsg('trocarMsg', 'Senha salva! Redirecionando...', 'success');
          setTimeout(() => { window.location.href = 'app_membro_v2.html'; }, 1000);

        } catch (err) {
          showMsg('trocarMsg', 'Erro de conexão. Tente novamente.', 'error');
        } finally {
          btn.disabled = false;
          btn.textContent = 'Salvar senha e entrar';
        }
      });
    })();
  </script>
</body>
</html>
