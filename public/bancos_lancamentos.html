<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Lançamentos Bancários</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tesouraria-ui.css">
    <script src="tema.js"></script>
</head>
<body class="theme-petroleo enterprise-shell-page tx-ui"
      data-shell-title="Lançamentos Bancários"
      data-shell-breadcrumb="LDFP / Tesouraria / Bancos e Contas"
      data-shell-active="bancos_lancamentos.html"
      data-shell-chip="Tesouraria">

<main class="main-content enterprise-main">
    <div class="tx-page">
        <div class="tx-titlebar">
            <h2 id="titulo">Lançamentos Bancários</h2>
            <nav class="tx-crumbs" aria-label="Caminho">
                <a href="tesouraria_dizimos.html">Tesouraria</a><span class="sep">›</span>
                <a href="bancos_lancamentos.html">Lançamentos Bancários</a><span class="sep" id="crumbSep" style="display:none;">›</span>
                <span class="atual" id="crumbConta"></span>
            </nav>
        </div>

        <!-- Escolher o banco -->
        <section id="escolha" style="display:none;" aria-labelledby="escTitulo">
            <p class="tx-sub" id="escTitulo">Selecione o banco para ver e fazer lançamentos.</p>
            <div class="tx-total-geral" id="totalGeral"></div>
            <div id="contas" class="tx-contas"></div>
        </section>

        <!-- Lançamentos da conta -->
        <div id="conteudo" style="display:none;">
            <section class="tx-card" aria-label="Resumo da conta">
                <div class="tx-card-head">
                    <h3><span class="ico"><i class="fa-solid fa-building-columns" id="icoConta"></i></span> <span id="nomeConta"></span></h3>
                    <div class="tx-mes-nav" role="group" aria-label="Mês">
                        <button class="tx-btn-icon" type="button" id="mesAnt" title="Mês anterior" aria-label="Mês anterior"><i class="fa-solid fa-chevron-left"></i></button>
                        <strong id="mesRotulo"></strong>
                        <button class="tx-btn-icon" type="button" id="mesProx" title="Próximo mês" aria-label="Próximo mês"><i class="fa-solid fa-chevron-right"></i></button>
                    </div>
                </div>
                <div class="tx-stats">
                    <div><span>Saldo anterior</span><strong id="sAnterior">R$ 0,00</strong></div>
                    <div><span>Créditos</span><strong class="pos" id="sCreditos">R$ 0,00</strong></div>
                    <div><span>Débitos</span><strong class="neg" id="sDebitos">R$ 0,00</strong></div>
                    <div><span id="rotAtual">Saldo no fim do mês</span><strong class="destaque" id="sAtual">R$ 0,00</strong></div>
                </div>
            </section>

            <section class="tx-card" style="margin-top:16px;">
                <div class="tx-toolbar">
                    <div class="tx-search">
                        <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                        <input id="busca" class="tx-input" type="search" placeholder="Buscar..." autocomplete="off" aria-label="Buscar na descrição, documento ou conta">
                    </div>
                    <select id="fTipo" class="tx-input" style="width:auto;" aria-label="Tipo">
                        <option value="">Créditos e débitos</option>
                        <option value="entrada">Só créditos</option>
                        <option value="saida">Só débitos</option>
                    </select>
                    <select id="fPeriodo" class="tx-input" style="width:auto;" aria-label="Período">
                        <option value="mes">Mês selecionado</option>
                        <option value="todos">Todo o período</option>
                    </select>
                    <a class="tx-btn tx-btn-primary" id="btnNovo" href="#"><i class="fa-solid fa-plus"></i> Novo</a>
                </div>

                <div class="tx-table-wrap">
                    <table class="tx-table">
                        <thead>
                            <tr>
                                <th class="sortable" data-ord="data">Data <i class="fa-solid fa-sort-down"></i></th>
                                <th>Descrição</th>
                                <th class="sortable num" data-ord="valor">Valor <i class="fa-solid fa-sort"></i></th>
                                <th>Classificação</th>
                                <th class="acoes">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="linhas"></tbody>
                    </table>
                </div>
                <div class="tx-foot">
                    <span id="contagem">0 registro(s)</span>
                    <div class="tx-pages" id="paginas"></div>
                </div>
            </section>
        </div>
    </div>
</main>

<script src="session.js"></script>
<script src="enterprise-shell.js"></script>
<script src="tesouraria-ui.js"></script>
<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const qs = new URLSearchParams(location.search);
    const contaId = qs.get('conta');
    const POR_PAGINA = 20;
    const ICO = { corrente: 'fa-building-columns', aplicacao: 'fa-piggy-bank', cartao: 'fa-credit-card' };
    const ORIGEM = {
        dizimo: { rotulo: 'Dízimo', ico: 'fa-coins', titulo: 'Lançado automaticamente pelo dízimo', link: (l) => `dizimo_lancamento.html?id=${encodeURIComponent(l.origem_id)}` },
        transferencia: { rotulo: 'Transferência', ico: 'fa-right-left', titulo: 'Outra ponta de uma transferência', link: (l) => `banco_lancamento.html?id=${encodeURIComponent(l.origem_id)}` },
        caixa: { rotulo: 'Caixa', ico: 'fa-cash-register', titulo: 'Depósito/saque lançado pelo caixa', link: (l) => `caixa_lancamento.html?id=${encodeURIComponent(l.origem_id)}` },
        conta_pagar: { rotulo: 'Conta paga', ico: 'fa-file-invoice-dollar', titulo: 'Pagamento de uma conta a pagar', link: () => 'contas_pagar.html' },
        link_pagamento: { rotulo: 'Link', ico: 'fa-link', titulo: 'Recebimento de um link de pagamento', link: () => 'pagamentos.html' }
    };
    const st = { mes: qs.get('mes') || TX.hojeISO().slice(0, 7), periodo: 'mes', tipo: '', busca: '', pagina: 1, ordem: { campo: 'data', desc: true }, conta: null };

    function mesMais(mes, d) {
        const [a, m] = mes.split('-').map(Number);
        const x = new Date(a, m - 1 + d, 1);
        return `${x.getFullYear()}-${String(x.getMonth() + 1).padStart(2, '0')}`;
    }

    // ── Escolher banco ───────────────────────────────────────────────────
    async function mostrarEscolha() {
        $('escolha').style.display = '';
        $('contas').innerHTML = '<div class="tx-conta"><div class="tx-skel" style="height:70px;"></div></div>';
        let contas;
        try {
            contas = (await TX.api('/banco/contas?saldo=1')).filter((c) => Number(c.ativo) !== 0);
        } catch (e) {
            $('contas').innerHTML = `<section class="tx-card" style="grid-column:1/-1;"><div class="tx-empty"><strong>Não foi possível carregar</strong><span>${TX.esc(e.message)}</span></div></section>`;
            return;
        }
        if (!contas.length) {
            $('contas').innerHTML = `<section class="tx-card" style="grid-column:1/-1;"><div class="tx-empty">
                <div class="ico"><i class="fa-solid fa-building-columns"></i></div>
                <strong>Nenhuma conta cadastrada</strong><span>Cadastre uma conta para começar a lançar.</span>
                <a class="tx-btn tx-btn-primary" href="banco_conta.html" style="margin-top:12px;"><i class="fa-solid fa-plus"></i> Nova conta</a></div></section>`;
            return;
        }
        const disponivel = contas.filter((c) => c.tipo !== 'cartao').reduce((s, c) => s + Number(c.saldo_atual || 0), 0);
        $('totalGeral').innerHTML = `Saldo disponível nos bancos: <b>${TX.money(disponivel)}</b>`;
        $('contas').innerHTML = contas.map((c) => {
            const cartao = c.tipo === 'cartao';
            const saldo = Number(c.saldo_atual || 0);
            const valor = cartao ? Math.max(0, -saldo) : saldo;
            const sub = cartao ? `Cartão · final ${c.final_cartao || '----'}`
                : [c.banco, c.agencia && `Ag. ${c.agencia}`, c.conta && `C/C ${c.conta}${c.digito ? '-' + c.digito : ''}`].filter(Boolean).join(' · ');
            return `<a class="tx-conta" href="bancos_lancamentos.html?conta=${encodeURIComponent(c.id)}">
                <div class="tx-conta-topo"><span class="ico"><i class="fa-solid ${ICO[c.tipo] || ICO.corrente}"></i></span>
                    <div><strong>${TX.esc(c.nome)}</strong><small>${TX.esc(sub || 'Conta bancária')}</small></div></div>
                <div class="tx-conta-saldo"><span>${cartao ? 'Fatura em aberto' : 'Saldo atual'}</span>
                    <b class="${cartao ? (valor > 0 ? 'tx-valor-neg' : '') : saldo < 0 ? 'tx-valor-neg' : 'tx-valor-pos'}">${TX.money(valor)}</b></div>
            </a>`;
        }).join('');
    }

    // ── Lançamentos da conta ─────────────────────────────────────────────
    async function carregar() {
        $('linhas').innerHTML = Array.from({ length: 4 }, () => `<tr>${'<td><div class="tx-skel"></div></td>'.repeat(5)}</tr>`).join('');
        const p = new URLSearchParams({ mes: st.mes, page: st.pagina, limit: POR_PAGINA, ordem: st.ordem.campo, dir: st.ordem.desc ? 'desc' : 'asc' });
        if (st.periodo === 'todos') p.set('periodo', 'todos');
        if (st.tipo) p.set('tipo', st.tipo);
        if (st.busca) p.set('busca', st.busca);
        let r;
        try {
            r = await TX.api(`/banco/contas/${encodeURIComponent(contaId)}/lancamentos?${p}`);
        } catch (e) {
            if (e.status === 404) { location.href = 'bancos_lancamentos.html'; return; }
            $('linhas').innerHTML = `<tr><td colspan="5"><div class="tx-empty"><strong>Não foi possível carregar</strong><span>${TX.esc(e.message)}</span></div></td></tr>`;
            return;
        }
        st.conta = r.conta;
        const cartao = r.conta.tipo === 'cartao';
        $('nomeConta').textContent = r.conta.nome;
        $('icoConta').className = `fa-solid ${ICO[r.conta.tipo] || ICO.corrente}`;
        $('crumbConta').textContent = r.conta.nome;
        $('crumbSep').style.display = '';
        $('titulo').textContent = `Lançamentos Bancários - ${r.conta.nome}`;
        document.title = `LDFP - ${r.conta.nome}`;
        $('mesRotulo').textContent = TX.mesParaCompetencia(st.mes);
        const s = r.resumo;
        // no cartão o "saldo" é dívida: mostra positivo como fatura
        const ver = (v) => TX.money(cartao ? -v : v);
        $('sAnterior').textContent = ver(s.saldoAnterior);
        $('sCreditos').textContent = TX.money(s.creditos);
        $('sDebitos').textContent = TX.money(s.debitos);
        $('sAtual').textContent = ver(s.saldoAtual);
        $('rotAtual').textContent = cartao ? 'Fatura no fim do mês' : 'Saldo no fim do mês';
        $('btnNovo').href = `banco_lancamento.html?conta=${encodeURIComponent(contaId)}`;
        renderLinhas(r.items || [], cartao);
        renderPaginas(r.meta || {});
    }

    function renderLinhas(itens, cartao) {
        if (!itens.length) {
            $('linhas').innerHTML = `<tr><td colspan="5"><div class="tx-empty">
                <div class="ico"><i class="fa-solid fa-receipt"></i></div>
                <strong>Nenhum lançamento ${st.periodo === 'mes' ? 'em ' + TX.esc(TX.mesParaCompetencia(st.mes)) : ''}</strong>
                <span>${st.busca || st.tipo ? 'Tente buscar com outros termos.' : 'Clique em <b>Novo</b> para registrar um crédito ou débito.'}</span>
            </div></td></tr>`;
            return;
        }
        $('linhas').innerHTML = itens.map((l) => {
            const credito = l.tipo === 'entrada';
            const o = ORIGEM[l.origem];
            const badge = o ? `<span class="tx-origem" title="${o.titulo}"><i class="fa-solid ${o.ico}"></i> ${o.rotulo}</span>` : '';
            const doc = l.doc ? `<span class="sub">Doc.: ${TX.esc(l.doc)}</span>` : '';
            const acoes = o
                ? `<a class="tx-btn-icon" href="${o.link(l)}" title="Abrir a origem" aria-label="Abrir o lançamento de origem"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>`
                : `<a class="tx-btn-icon" href="banco_lancamento.html?id=${encodeURIComponent(l.id)}" title="Editar" aria-label="Editar ${TX.esc(l.descricao)}"><i class="fa-solid fa-pen"></i></a>
                   <button class="tx-btn-icon danger" type="button" data-excluir="${TX.esc(l.id)}" data-nome="${TX.esc(l.descricao)}" title="Excluir" aria-label="Excluir ${TX.esc(l.descricao)}"><i class="fa-solid fa-trash"></i></button>`;
            return `<tr>
                <td>${TX.dataBR(l.data_lancamento)}</td>
                <td>${TX.esc(l.descricao)}${badge}${doc}</td>
                <td class="num"><span class="${credito ? 'tx-valor-pos' : 'tx-valor-neg'}">${credito ? '' : '- '}${TX.money(l.valor)}</span></td>
                <td>${l.conta_contabil ? TX.esc(l.conta_contabil) : '<span class="sub">—</span>'}</td>
                <td class="acoes">${acoes}</td>
            </tr>`;
        }).join('');
    }

    function renderPaginas(meta) {
        $('contagem').textContent = `${Number(meta.total || 0)} registro(s)`;
        const tp = Number(meta.totalPages || 1);
        if (tp <= 1) { $('paginas').innerHTML = ''; return; }
        const atual = Number(meta.page || 1);
        const ini = Math.max(1, atual - 2), fim = Math.min(tp, ini + 4);
        let html = `<button type="button" data-pag="${atual - 1}" ${atual === 1 ? 'disabled' : ''} aria-label="Anterior">‹</button>`;
        for (let i = ini; i <= fim; i++) html += `<button type="button" data-pag="${i}" class="${i === atual ? 'atual' : ''}">${i}</button>`;
        html += `<button type="button" data-pag="${atual + 1}" ${atual === tp ? 'disabled' : ''} aria-label="Próxima">›</button>`;
        $('paginas').innerHTML = html;
    }

    function irMes(d) {
        st.mes = mesMais(st.mes, d);
        st.pagina = 1;
        const u = new URL(location.href);
        u.searchParams.set('mes', st.mes);
        history.replaceState(null, '', u);
        carregar();
    }
    $('mesAnt').addEventListener('click', () => irMes(-1));
    $('mesProx').addEventListener('click', () => irMes(1));
    $('fTipo').addEventListener('change', () => { st.tipo = $('fTipo').value; st.pagina = 1; carregar(); });
    $('fPeriodo').addEventListener('change', () => { st.periodo = $('fPeriodo').value; st.pagina = 1; carregar(); });
    $('busca').addEventListener('input', TX.debounce(() => { st.busca = $('busca').value.trim(); st.pagina = 1; carregar(); }, 300));
    document.querySelectorAll('th.sortable').forEach((th) => th.addEventListener('click', () => {
        const campo = th.dataset.ord;
        st.ordem = { campo, desc: st.ordem.campo === campo ? !st.ordem.desc : true };
        document.querySelectorAll('th.sortable i').forEach((i) => { i.className = 'fa-solid fa-sort'; });
        th.querySelector('i').className = `fa-solid ${st.ordem.desc ? 'fa-sort-down' : 'fa-sort-up'}`;
        st.pagina = 1;
        carregar();
    }));
    $('paginas').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pag]');
        if (!b || b.disabled) return;
        st.pagina = Number(b.dataset.pag);
        carregar();
    });
    $('linhas').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-excluir]');
        if (!b) return;
        const ok = await TX.confirmar({ titulo: 'Excluir lançamento', texto: `Excluir "${b.dataset.nome}"? Se for uma transferência, saque ou depósito, a outra ponta também é excluída.` });
        if (!ok) return;
        try {
            await TX.api(`/banco/lancamentos/${encodeURIComponent(b.dataset.excluir)}`, { method: 'DELETE' });
            TX.toast('Lançamento excluído.');
            carregar();
        } catch (err) {
            TX.toast(err.message, 'erro');
        }
    });

    TX.toastPendente();
    if (contaId) {
        $('conteudo').style.display = '';
        carregar();
    } else {
        mostrarEscolha();
    }
})();
</script>
</body>
</html>
