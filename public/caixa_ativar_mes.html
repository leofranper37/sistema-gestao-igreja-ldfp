<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Ativar Competência</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tesouraria-ui.css">
    <script src="tema.js"></script>
</head>
<body class="theme-petroleo enterprise-shell-page tx-ui"
      data-shell-title="Ativar Competência"
      data-shell-breadcrumb="LDFP / Tesouraria / Caixa"
      data-shell-active="caixa_ativar_mes.html"
      data-shell-chip="Tesouraria">

<main class="main-content enterprise-main">
    <div class="tx-page">
        <div class="tx-titlebar">
            <h2>Ativar Competência</h2>
            <nav class="tx-crumbs" aria-label="Caminho">
                <a href="tesouraria_dizimos.html">Tesouraria</a><span class="sep">›</span>
                <a href="tesouraria_caixa.html">Caixa</a><span class="sep">›</span>
                <span class="atual">Ativar Competência</span>
            </nav>
        </div>

        <section class="tx-card tx-narrow" id="cartao" aria-labelledby="cTitulo">
            <div class="tx-card-head"><h3 id="cTitulo"><span class="ico"><i class="fa-solid fa-calendar-check"></i></span> Ativar Competência</h3></div>
            <div class="tx-card-body" id="corpo">
                <div class="tx-skel" style="height:60px;"></div>
            </div>
            <div class="tx-card-foot" id="rodape" style="display:none;">
                <button class="tx-btn tx-btn-primary" type="button" id="btnAtivar"><i class="fa-solid fa-circle-check"></i> Ativar Competência</button>
            </div>
        </section>
    </div>
</main>

<script src="session.js"></script>
<script src="enterprise-shell.js"></script>
<script src="tesouraria-ui.js"></script>
<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    let caixa = null;

    function render() {
        const c = caixa;
        if (!c.configurado) {
            $('corpo').innerHTML = `<div class="tx-alert warn" style="margin:0;"><i class="fa-solid fa-triangle-exclamation"></i>
                <span>O caixa ainda não foi iniciado. Antes de ativar competências, <a href="caixa_saldo_inicial.html">informe o saldo inicial</a>.</span></div>`;
            $('rodape').style.display = 'none';
            return;
        }
        $('corpo').innerHTML = `
            <div class="tx-alert info"><i class="fa-solid fa-circle-info"></i><span>
                <b>Primeira competência (Saldo Inicial):</b> ${TX.esc(c.primeiraCompetencia)}<br>
                <b>Última competência cadastrada:</b> ${TX.esc(c.competenciaAtiva)}
            </span></div>
            <div class="tx-comp-grid">
                <div class="tx-comp-box"><label><i class="fa-solid fa-calendar"></i> Competência Atual</label><div class="valor">${TX.esc(c.competenciaAtiva)}</div></div>
                <div class="tx-comp-box"><label><i class="fa-solid fa-calendar-plus"></i> Competência a Ativar</label><div class="valor alvo">${TX.esc(c.proximaCompetencia)}</div></div>
            </div>
            <p style="margin:14px 0 0;font-size:12.5px;color:var(--tx-muted);text-align:center;">
                Saldo que passa para ${TX.esc(c.proximaCompetencia)}: <b style="color:var(--tx-text);">${TX.money(c.saldoAtual)}</b>.
                Depois de ativar, os lançamentos de ${TX.esc(c.competenciaAtiva)} ficam fechados.
            </p>
            ${c.podeAtivar ? '' : `<div class="tx-alert warn" style="margin:14px 0 0;"><i class="fa-solid fa-hourglass-half"></i><span>${TX.esc(c.proximaCompetencia)} ainda é uma competência futura. Ela poderá ser ativada a partir do mês anterior a ela.</span></div>`}`;
        $('rodape').style.display = '';
        $('btnAtivar').disabled = !c.podeAtivar;
    }

    async function carregar() {
        try {
            caixa = await TX.api('/caixa/competencia');
            render();
        } catch (e) {
            $('corpo').innerHTML = `<div class="tx-alert erro" style="margin:0;"><i class="fa-solid fa-circle-exclamation"></i><span>${TX.esc(e.message)}</span></div>`;
        }
    }

    $('btnAtivar').addEventListener('click', async () => {
        const ok = await TX.confirmar({
            titulo: 'Ativar competência',
            texto: `Ativar ${caixa.proximaCompetencia}? Os lançamentos de ${caixa.competenciaAtiva} ficarão fechados e o saldo de ${TX.money(caixa.saldoAtual)} passa para o novo mês.`,
            botao: 'Ativar',
            perigo: false
        });
        if (!ok) return;
        $('btnAtivar').disabled = true;
        try {
            const r = await TX.api('/caixa/competencia/ativar', { method: 'POST', body: {} });
            TX.toast(r.message);
            caixa = r.estado;
            render();
        } catch (e) {
            TX.toast(e.message, 'erro');
            $('btnAtivar').disabled = false;
        }
    });

    carregar();
})();
</script>
</body>
</html>
