<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Contas a Pagar</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tesouraria-ui.css">
    <script src="tema.js"></script>
</head>
<body class="theme-petroleo enterprise-shell-page tx-ui"
      data-shell-title="Contas a Pagar"
      data-shell-breadcrumb="LDFP / Tesouraria / Contas a Pagar"
      data-shell-active="contas_pagar.html"
      data-shell-chip="Tesouraria">

<main class="main-content enterprise-main">
    <div class="tx-page">
        <div class="tx-titlebar">
            <h2>Contas a Pagar</h2>
            <nav class="tx-crumbs" aria-label="Caminho">
                <a href="tesouraria_dizimos.html">Tesouraria</a><span class="sep">›</span>
                <span class="atual">Contas a Pagar</span>
            </nav>
        </div>

        <section class="tx-card" aria-label="Resumo">
            <div class="tx-card-head">
                <h3><span class="ico"><i class="fa-solid fa-file-invoice-dollar"></i></span> Compromissos da igreja</h3>
                <button class="tx-btn tx-btn-primary" type="button" id="btnNova"><i class="fa-solid fa-plus"></i> Nova conta</button>
            </div>
            <div class="tx-stats">
                <div><span>Em aberto</span><strong id="sAberto">R$ 0,00</strong></div>
                <div><span>Vencidas</span><strong class="neg" id="sVencido">R$ 0,00</strong></div>
                <div><span>A vencer</span><strong id="sPendente">R$ 0,00</strong></div>
                <div><span>Pagas</span><strong class="pos" id="sPago">R$ 0,00</strong></div>
            </div>
        </section>

        <section class="tx-card" style="margin-top:16px;">
            <div class="tx-toolbar">
                <div class="tx-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="busca" class="tx-input" type="search" placeholder="Buscar descrição..." autocomplete="off" aria-label="Buscar conta">
                </div>
                <div class="tx-seg" role="radiogroup" aria-label="Situação" id="filtroStatus">
                    <button type="button" role="radio" data-st="aberto" aria-checked="true">Em aberto</button>
                    <button type="button" role="radio" data-st="vencido" aria-checked="false">Vencidas</button>
                    <button type="button" role="radio" data-st="pago" aria-checked="false">Pagas</button>
                    <button type="button" role="radio" data-st="" aria-checked="false">Todas</button>
                </div>
            </div>
            <div class="tx-table-wrap">
                <table class="tx-table">
                    <thead>
                        <tr>
                            <th>Vencimento</th>
                            <th>Descrição</th>
                            <th>Classificação</th>
                            <th class="num">Valor</th>
                            <th>Situação</th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="linhas"></tbody>
                </table>
            </div>
            <div class="tx-foot">
                <span id="contagem">0 conta(s)</span>
                <div class="tx-pages" id="paginas"></div>
            </div>
        </section>
    </div>
</main>

<datalist id="dlFornecedores"></datalist>
<datalist id="dlCategorias"></datalist>

<script src="session.js"></script>
<script src="enterprise-shell.js"></script>
<script src="tesouraria-ui.js"></script>
<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const ST = { pendente: 'A vencer', vencido: 'Vencida', pago: 'Paga' };
    let status = 'aberto';
    let pagina = 1;
    let fornecedores = [];
    let centros = [];
    let contas = [];

    async function carregarCadastros() {
        const pega = (u) => TX.api(u).then((r) => r.items || []).catch(() => []);
        const [f, c, cats] = await Promise.all([
            pega('/api/tesouraria/fornecedores'), pega('/api/tesouraria/centros-custo'), pega('/caixa/contas-sugeridas')
        ]);
        fornecedores = f;
        centros = c;
        $('dlFornecedores').innerHTML = f.map((x) => `<option value="${TX.esc(x.nome)}">`).join('');
        $('dlCategorias').innerHTML = cats.filter((x) => x.natureza === 'despesa')
            .map((x) => `<option value="${TX.esc(x.rotulo)}">`).join('');
    }

    async function totais() {
        try {
            const t = await TX.api('/contas-pagar/totais');
            $('sAberto').textContent = TX.money(t.totalAberto || 0);
            $('sVencido').textContent = TX.money(t.totalVencido || 0);
            $('sPendente').textContent = TX.money(t.totalPendente || 0);
            $('sPago').textContent = TX.money(t.totalPago || 0);
        } catch (_) { /* os cards ficam zerados */ }
    }

    async function listar() {
        $('linhas').innerHTML = Array.from({ length: 4 }, () => `<tr>${'<td><div class="tx-skel"></div></td>'.repeat(6)}</tr>`).join('');
        const q = new URLSearchParams({ page: pagina, limit: 25 });
        if (status) q.set('status', status);
        const busca = $('busca').value.trim();
        if (busca) q.set('descricao', busca);
        let r;
        try {
            r = await TX.api('/contas-pagar?' + q);
        } catch (e) {
            $('linhas').innerHTML = `<tr><td colspan="6"><div class="tx-empty"><strong>Não foi possível carregar</strong><span>${TX.esc(e.message)}</span></div></td></tr>`;
            return;
        }
        contas = r.items || [];
        const meta = r.meta || { total: contas.length, totalPages: 1 };
        $('contagem').textContent = `${meta.total} conta(s)`;
        $('paginas').innerHTML = meta.totalPages > 1
            ? Array.from({ length: meta.totalPages }, (_, i) => `<button type="button" class="${i + 1 === pagina ? 'atual' : ''}" data-pg="${i + 1}">${i + 1}</button>`).join('')
            : '';
        if (!contas.length) {
            $('linhas').innerHTML = `<tr><td colspan="6"><div class="tx-empty">
                <span class="ico"><i class="fa-regular fa-circle-check"></i></span>
                <strong>${status === 'pago' ? 'Nenhuma conta paga ainda' : 'Nenhuma conta em aberto'}</strong>
                <span>Cadastre as contas da igreja (luz, água, aluguel...) para acompanhar os vencimentos.</span></div></td></tr>`;
            return;
        }
        $('linhas').innerHTML = contas.map(linha).join('');
    }

    function origemPagamento(c) {
        if (!c.pago_com) return c.data_pagamento ? 'Baixa manual' : '';
        if (c.pago_com === 'caixa') return 'Pago pelo caixa';
        return 'Pago pelo banco';
    }

    function linha(c) {
        const venc = String(c.vencimento || '').slice(0, 10);
        const pago = c.status === 'pago';
        const sub = pago
            ? `Pago em ${TX.dataBR(String(c.data_pagamento || '').slice(0, 10))} · ${origemPagamento(c)}`
            : (c.fornecedor || '');
        const acoes = pago
            ? `<button class="tx-btn tx-btn-ghost tx-btn-sm" type="button" data-estornar="${c.id}"><i class="fa-solid fa-rotate-left"></i> Estornar</button>`
            : `<button class="tx-btn tx-btn-primary tx-btn-sm tx-btn-pagar" type="button" data-pagar="${c.id}"><i class="fa-solid fa-check"></i> Pagar</button>
               <button class="tx-btn-icon" type="button" data-editar="${c.id}" title="Editar" aria-label="Editar ${TX.esc(c.descricao)}"><i class="fa-solid fa-pen"></i></button>
               <button class="tx-btn-icon danger" type="button" data-excluir="${c.id}" title="Excluir" aria-label="Excluir ${TX.esc(c.descricao)}"><i class="fa-solid fa-trash"></i></button>`;
        return `<tr>
            <td>${TX.dataBR(venc)}</td>
            <td><strong>${TX.esc(c.descricao)}</strong>${sub ? `<small style="display:block;color:var(--tx-muted);">${TX.esc(sub)}</small>` : ''}</td>
            <td>${TX.esc(c.categoria || '—')}${c.centro_custo_nome ? `<small style="display:block;color:var(--tx-muted);">${TX.esc(c.centro_custo_nome)}</small>` : ''}</td>
            <td class="num"><strong>${TX.money(Number(c.valor))}</strong></td>
            <td><span class="tx-status ${c.status}">${ST[c.status] || c.status}</span></td>
            <td class="acoes"><div class="tx-acoes-linha">${acoes}</div></td>
        </tr>`;
    }

    function atualizar() { listar(); totais(); }

    // ── Nova / editar conta ────────────────────────────────────────────
    async function formConta(c) {
        const v = c || {};
        const optCentros = '<option value="">Nenhum</option>' + centros.map((x) =>
            `<option value="${x.id}" ${Number(v.centro_custo_id) === Number(x.id) ? 'selected' : ''}>${TX.esc([x.codigo, x.nome].filter(Boolean).join(' - '))}</option>`).join('');
        await TX.dialogo({
            titulo: c ? 'Editar conta' : 'Nova conta a pagar',
            botao: 'Salvar',
            corpo: `
                <div class="tx-field"><label for="fDesc">Descrição <span class="req">*</span></label>
                    <input id="fDesc" class="tx-input" maxlength="255" placeholder="Ex: Conta de luz de novembro" value="${TX.esc(v.descricao || '')}"></div>
                <div class="tx-grid c2">
                    <div class="tx-field"><label for="fValor">Valor <span class="req">*</span></label>
                        <div class="tx-input-group"><span class="pre">R$</span><input id="fValor" class="tx-input valor" inputmode="numeric" autocomplete="off"></div></div>
                    <div class="tx-field"><label for="fVenc">Vencimento <span class="req">*</span></label>
                        <input id="fVenc" class="tx-input" type="date" value="${TX.esc(String(v.vencimento || '').slice(0, 10))}"></div>
                </div>
                <div class="tx-field"><label for="fForn">Fornecedor / favorecido</label>
                    <input id="fForn" class="tx-input" list="dlFornecedores" maxlength="255" autocomplete="off" placeholder="Ex: Energisa" value="${TX.esc(v.fornecedor || '')}"></div>
                <div class="tx-field"><label for="fCat">Classificação (conta contábil)</label>
                    <input id="fCat" class="tx-input" list="dlCategorias" maxlength="255" autocomplete="off" placeholder="Digite para buscar..." value="${TX.esc(v.categoria || '')}">
                    <small class="tx-hint">É a conta usada no caixa/banco quando a conta for paga.</small></div>
                <div class="tx-grid c2">
                    <div class="tx-field"><label for="fCentro">Centro de custo</label><select id="fCentro" class="tx-input">${optCentros}</select></div>
                    <div class="tx-field"><label for="fDoc">Nº do documento</label>
                        <input id="fDoc" class="tx-input" maxlength="80" placeholder="Ex: boleto, NF" value="${TX.esc(v.numero_documento || '')}"></div>
                </div>
                <div class="tx-field"><label for="fObs">Observação</label><textarea id="fObs" maxlength="2000" placeholder="Opcional">${TX.esc(v.observacao || '')}</textarea></div>`,
            aoAbrir: () => {
                const m = TX.maskMoney($('fValor'));
                if (v.valor) m.set(Number(v.valor));
                if (!v.vencimento) $('fVenc').value = TX.hojeISO();
            },
            aoConfirmar: async () => {
                const descricao = $('fDesc').value.trim();
                const valor = TX.parseMoney($('fValor').value);
                if (!descricao) throw new Error('Informe a descrição.');
                if (!(valor > 0)) throw new Error('Informe um valor maior que zero.');
                if (!$('fVenc').value) throw new Error('Informe o vencimento.');
                const nomeForn = $('fForn').value.trim();
                const forn = fornecedores.find((f) => f.nome.toLowerCase() === nomeForn.toLowerCase());
                const body = {
                    descricao, valor: String(valor), vencimento: $('fVenc').value,
                    fornecedor: nomeForn || null, fornecedorId: forn ? forn.id : null,
                    categoria: $('fCat').value.trim() || null,
                    centroCustoId: $('fCentro').value ? Number($('fCentro').value) : null,
                    numeroDocumento: $('fDoc').value.trim() || null,
                    observacao: $('fObs').value.trim() || null
                };
                if (c) await TX.api(`/contas-pagar/${c.id}`, { method: 'PUT', body });
                else await TX.api('/contas-pagar', { method: 'POST', body });
            }
        }).then((ok) => { if (ok) { TX.toast(c ? 'Conta atualizada.' : 'Conta cadastrada.'); atualizar(); } });
    }

    // ── Pagar ─────────────────────────────────────────────────────────
    async function pagar(c) {
        let lista;
        try { lista = await TX.destinos(true); } catch (e) { TX.toast(e.message, 'erro'); return; }
        const temAlgum = lista.some((d) => d.disponivel !== false);
        let msg = '';
        await TX.dialogo({
            titulo: 'Pagar conta',
            botao: 'Confirmar pagamento',
            corpo: `
                <div class="tx-modal-resumo">
                    <span>${TX.esc(c.descricao)}${c.fornecedor ? ' · ' + TX.esc(c.fornecedor) : ''}</span><span>Vence ${TX.dataBR(String(c.vencimento).slice(0, 10))}</span>
                    <b class="grande">${TX.money(Number(c.valor))}</b><span class="tx-status ${c.status}">${ST[c.status] || ''}</span>
                </div>
                <div class="tx-grid c2">
                    <div class="tx-field"><label for="pData">Data do pagamento <span class="req">*</span></label>
                        <input id="pData" class="tx-input" type="date"></div>
                    <div class="tx-field"><label for="pCom">Pago com <span class="req">*</span></label>
                        <select id="pCom" class="tx-input">${TX.opcoesDestino(lista, { semCartao: false })}</select></div>
                </div>
                <small class="tx-hint">${temAlgum
                    ? 'A saída é lançada automaticamente no caixa ou no extrato da conta escolhida. Se precisar desfazer, use “Estornar”.'
                    : 'Cadastre uma conta bancária ou inicie o caixa para poder registrar o pagamento.'}</small>`,
            aoAbrir: () => {
                $('pData').value = TX.hojeISO();
                const salvo = (() => { try { return localStorage.getItem('ldfp_cp_pago_com'); } catch (_) { return null; } })();
                const opt = salvo && $('pCom').querySelector(`option[value="${CSS.escape(salvo)}"]:not([disabled])`);
                if (opt) $('pCom').value = salvo;
            },
            aoConfirmar: async () => {
                const pagoCom = $('pCom').value;
                if (!pagoCom) throw new Error('Escolha o caixa ou a conta bancária de onde saiu o dinheiro.');
                const r = await TX.api(`/contas-pagar/${c.id}/pagar`, { method: 'POST', body: { dataPagamento: $('pData').value, pagoCom } });
                try { localStorage.setItem('ldfp_cp_pago_com', pagoCom); } catch (_) { /* opcional */ }
                msg = r.message;
            }
        }).then((ok) => { if (ok) { TX.toast(msg || 'Conta paga.'); atualizar(); } });
    }

    async function estornar(c) {
        const ok = await TX.confirmar({
            titulo: 'Estornar pagamento',
            texto: `O pagamento de "${c.descricao}" (${TX.money(Number(c.valor))}) será desfeito e a saída retirada do caixa/banco. A conta volta a ficar em aberto.`,
            botao: 'Estornar'
        });
        if (!ok) return;
        try {
            const r = await TX.api(`/contas-pagar/${c.id}/estornar`, { method: 'POST' });
            TX.toast(r.message);
            atualizar();
        } catch (e) { TX.toast(e.message, 'erro'); }
    }

    async function excluir(c) {
        const ok = await TX.confirmar({ titulo: 'Excluir conta', texto: `Excluir "${c.descricao}" de ${TX.money(Number(c.valor))}? Esta ação não pode ser desfeita.` });
        if (!ok) return;
        try {
            await TX.api(`/contas-pagar/${c.id}`, { method: 'DELETE' });
            TX.toast('Conta excluída.');
            atualizar();
        } catch (e) { TX.toast(e.message, 'erro'); }
    }

    // ── Eventos ───────────────────────────────────────────────────────
    $('btnNova').addEventListener('click', () => formConta(null));
    $('busca').addEventListener('input', TX.debounce(() => { pagina = 1; listar(); }, 300));
    $('filtroStatus').addEventListener('click', (e) => {
        const b = e.target.closest('[data-st]');
        if (!b) return;
        status = b.dataset.st;
        pagina = 1;
        $('filtroStatus').querySelectorAll('[data-st]').forEach((x) => x.setAttribute('aria-checked', String(x === b)));
        listar();
    });
    $('paginas').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pg]');
        if (b) { pagina = Number(b.dataset.pg); listar(); }
    });
    $('linhas').addEventListener('click', (e) => {
        const b = e.target.closest('button');
        if (!b) return;
        const id = Number(b.dataset.pagar || b.dataset.editar || b.dataset.excluir || b.dataset.estornar);
        const c = contas.find((x) => Number(x.id) === id);
        if (!c) return;
        if (b.dataset.pagar) pagar(c);
        else if (b.dataset.editar) formConta(c);
        else if (b.dataset.excluir) excluir(c);
        else if (b.dataset.estornar) estornar(c);
    });

    TX.toastPendente();
    carregarCadastros();
    atualizar();
})();
</script>
</body>
</html>
