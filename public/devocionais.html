<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devocionais — LDFP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-wrap { padding: 24px 30px 40px; }
        .page-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
        .page-header h2 { margin: 0; font-size: 24px; color: #0f172a; }
        .page-header small { color: #64748b; font-size: 13px; }
        .btn-primary { background: linear-gradient(90deg, #0ea5e9 0%, #10b981 100%); color: #fff; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
        .btn-secondary { background: #f1f5f9; color: #475569; border: none; border-radius: 8px; padding: 10px 16px; font-weight: 700; cursor: pointer; }
        .table-card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 14px rgba(15,23,42,.03); }
        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th, .data-table td { padding: 14px 16px; text-align: left; border-bottom: 1px solid #f1f5f9; font-size: 14px; color: #334155; }
        .data-table th { background: #f8fafc; font-size: 12px; text-transform: uppercase; color: #64748b; font-weight: 700; }
        .data-table tr:hover { background: #f8fafc; }
        .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .badge.ativo { background: #dcfce7; color: #166534; }
        .badge.inativo { background: #f1f5f9; color: #475569; }
        .btn-icon { width: 32px; height: 32px; border-radius: 6px; border: none; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; font-size: 14px; margin-right: 4px; }
        .btn-edit { background: #eff6ff; color: #2563eb; }
        .btn-del { background: #fef2f2; color: #dc2626; }
        .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
        
        /* Modal */
        .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.5); z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(2px); }
        .modal-overlay.open { display: flex; }
        .modal-card { background: #fff; border-radius: 16px; width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
        .modal-header { padding: 20px 24px; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .modal-header h3 { margin: 0; font-size: 18px; color: #0f172a; }
        .btn-close { background: none; border: none; font-size: 20px; color: #94a3b8; cursor: pointer; }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; font-weight: 700; color: #475569; margin-bottom: 6px; text-transform: uppercase; }
        .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 14px; font-family: inherit; box-sizing: border-box; outline: none; }
        .form-group input:focus, .form-group textarea:focus { border-color: #0ea5e9; }
        .form-row { display: flex; gap: 16px; }
        .form-row .form-group { flex: 1; }
        .modal-footer { padding: 16px 24px; border-top: 1px solid #e2e8f0; display: flex; justify-content: flex-end; gap: 10px; }
        
        #toast { position: fixed; bottom: 24px; right: 24px; background: #0f172a; color: #fff; padding: 12px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; transform: translateY(100px); opacity: 0; transition: 0.3s; z-index: 2000; }
        #toast.show { transform: translateY(0); opacity: 1; }
    </style>
</head>
<body class="theme-petroleo" data-shell-title="Devocionais" data-shell-breadcrumb="LDFP / Ensino / Devocionais" data-shell-active="devocionais.html">
    <main class="main-content enterprise-main">
        <div class="page-wrap">
            <div class="page-header">
                <div class="title-area">
                    <h2><i class="fa-solid fa-book-open-reader" style="color:#0ea5e9;margin-right:8px;"></i>Devocionais Diários</h2>
                    <small>Crie e gerencie as mensagens devocionais diárias para os membros da sua igreja.</small>
                </div>
                <div class="header-actions">
                    <button class="btn-primary" onclick="openModal()"><i class="fa-solid fa-plus"></i> Novo Devocional</button>
                </div>
            </div>
            
            <div class="table-card">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>Data Base</th>
                            <th>Título</th>
                            <th>Versículo Ref.</th>
                            <th>Status</th>
                            <th style="text-align:right">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <tr><td colspan="5" class="empty-state"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>Carregando...</p></td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>
    
    <div class="modal-overlay" id="modalForm">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitle">Novo Devocional</h3>
                <button class="btn-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="devId">
                <div class="form-row">
                    <div class="form-group">
                        <label>Data Ref. *</label>
                        <input type="date" id="devData">
                    </div>
                    <div class="form-group">
                        <label>Status</label>
                        <select id="devAtivo">
                            <option value="1">Ativo (Público)</option>
                            <option value="0">Rascunho (Oculto)</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Título *</label>
                    <input type="text" id="devTitulo" placeholder="Ex: A Força da Oração">
                </div>
                <div class="form-group">
                    <label>Versículo Base</label>
                    <input type="text" id="devVersiculo" placeholder="Ex: Filipenses 4:6">
                </div>
                <div class="form-group">
                    <label>Corpo / Texto *</label>
                    <textarea id="devCorpo" rows="8" placeholder="Escreva a reflexão aqui..."></textarea>
                </div>
                <div class="form-group">
                    <label>Oração Final</label>
                    <textarea id="devOracao" rows="3" placeholder="Senhor, ajuda-me a..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="closeModal()">Cancelar</button>
                <button class="btn-primary" onclick="salvarDevocional()"><i class="fa-solid fa-check"></i> Salvar</button>
            </div>
        </div>
    </div>
    
    <div id="toast"></div>

    <script src="session.js?v=20260501"></script>
    <script src="enterprise-shell.js?v=20260501"></script>
    <script>
        requireAuthSession();
        const tableBody = document.getElementById('tableBody');
        
        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 3000);
        }
        
        function fmtDate(iso) {
            if (!iso) return '';
            const [y, m, d] = iso.split('T')[0].split('-');
            return `${d}/${m}/${y}`;
        }
        
        function escHtml(str) {
            return String(str || '').replace(/[&<>'"]/g, match => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            })[match]);
        }

        async function notificarDevocional(titulo) {
            if (!confirm(`Deseja enviar uma notificação push para a igreja sobre o devocional "${titulo}"?`)) return;
            
            try {
                const res = await fetch('/api/push/send', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        titulo: 'Devocional de Hoje',
                        corpo: titulo,
                        url: '/estudo.html'
                    })
                });
                const data = await res.json();
                if (!res.ok) throw new Error(data.erro || 'Erro ao enviar notificação.');
                showToast(`Notificação enviada para ${data.enviados} membro(s).`);
            } catch (err) {
                showToast(err.message);
            }
        }

        async function loadDevocionais() {
            try {
                const res = await fetch('/api/estudo/admin/devocionais');
                if (!res.ok) throw new Error('Erro ao buscar');
                const data = await res.json();
                
                if (data.length === 0) {
                    tableBody.innerHTML = `<tr><td colspan="5" class="empty-state"><i class="fa-solid fa-book-open-reader fa-3x" style="color:#cbd5e1;margin-bottom:16px;"></i><br>Nenhum devocional cadastrado.</td></tr>`;
                    return;
                }
                
                tableBody.innerHTML = data.map(d => `
                    <tr>
                        <td><strong>${fmtDate(d.data_ref)}</strong></td>
                        <td>${d.titulo}</td>
                        <td>${d.versiculo_ref || '-'}</td>
                        <td><span class="badge ${d.ativo ? 'ativo' : 'inativo'}">${d.ativo ? 'Ativo' : 'Rascunho'}</span></td>
                        <td style="text-align:right">
                            <button class="btn-icon" style="background:#eff6ff;color:#0ea5e9" onclick="notificarDevocional('${escHtml(d.titulo)}')" title="Enviar Notificação Push"><i class="fa-solid fa-bell"></i></button>
                            <button class="btn-icon btn-edit" onclick="editarDevocional(${d.id})" title="Editar"><i class="fa-solid fa-pen"></i></button>
                            <button class="btn-icon btn-del" onclick="excluirDevocional(${d.id})" title="Excluir"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `).join('');
            } catch (err) {
                tableBody.innerHTML = `<tr><td colspan="5" class="empty-state" style="color:#ef4444">${err.message}</td></tr>`;
            }
        }
        
        function openModal() {
            document.getElementById('modalTitle').textContent = 'Novo Devocional';
            document.getElementById('devId').value = '';
            document.getElementById('devData').value = new Date().toISOString().split('T')[0];
            document.getElementById('devAtivo').value = '1';
            document.getElementById('devTitulo').value = '';
            document.getElementById('devVersiculo').value = '';
            document.getElementById('devCorpo').value = '';
            document.getElementById('devOracao').value = '';
            document.getElementById('modalForm').classList.add('open');
        }
        
        function closeModal() {
            document.getElementById('modalForm').classList.remove('open');
        }
        
        async function editarDevocional(id) {
            try {
                const res = await fetch(`/api/estudo/admin/devocionais/${id}`);
                if (!res.ok) throw new Error('Erro ao buscar devocional');
                const d = await res.json();
                
                document.getElementById('modalTitle').textContent = 'Editar Devocional';
                document.getElementById('devId').value = d.id;
                document.getElementById('devData').value = d.data_ref.split('T')[0];
                document.getElementById('devAtivo').value = d.ativo;
                document.getElementById('devTitulo').value = d.titulo;
                document.getElementById('devVersiculo').value = d.versiculo_ref || '';
                document.getElementById('devCorpo').value = d.corpo;
                document.getElementById('devOracao').value = d.oracao || '';
                document.getElementById('modalForm').classList.add('open');
            } catch (err) { showToast(err.message); }
        }
        
        async function salvarDevocional() {
            const id = document.getElementById('devId').value;
            const payload = {
                data_ref: document.getElementById('devData').value,
                ativo: parseInt(document.getElementById('devAtivo').value),
                titulo: document.getElementById('devTitulo').value,
                versiculo_ref: document.getElementById('devVersiculo').value,
                corpo: document.getElementById('devCorpo').value,
                oracao: document.getElementById('devOracao').value
            };
            
            if (!payload.data_ref || !payload.titulo || !payload.corpo) return alert('Preencha os campos obrigatórios (*)');
            
            const method = id ? 'PUT' : 'POST';
            const url = id ? `/api/estudo/admin/devocionais/${id}` : `/api/estudo/admin/devocionais`;
            
            try {
                const res = await fetch(url, {
                    method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload)
                });
                if (!res.ok) throw new Error('Erro ao salvar');
                showToast('Devocional salvo com sucesso!');
                closeModal();
                loadDevocionais();
            } catch (err) { showToast(err.message); }
        }
        
        async function excluirDevocional(id) {
            if (!confirm('Deseja realmente excluir este devocional?')) return;
            try {
                const res = await fetch(`/api/estudo/admin/devocionais/${id}`, { method: 'DELETE' });
                if (!res.ok) throw new Error('Erro ao excluir');
                showToast('Devocional removido.');
                loadDevocionais();
            } catch (err) { showToast(err.message); }
        }
        
        loadDevocionais();
    </script>
</body>
</html>
