<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Novo Apontamento EBD</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-wrap { padding: 24px 30px 30px; }
        .form-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.06);
            overflow: hidden;
            max-width: 980px;
        }
        .form-head {
            padding: 12px 14px;
            background: #f8fafc;
            border-bottom: 1px solid #e2e8f0;
            font-size: 14px;
            font-weight: 700;
            color: #0f172a;
        }
        .form-body { padding: 16px; display: grid; gap: 12px; }
        .section {
            background: #ffffff;
            border: 1px solid #e9edf4;
            border-radius: 8px;
            padding: 10px;
        }
        .section-title {
            margin: 0 0 10px;
            font-size: 12px;
            font-weight: 700;
            color: #92400e;
            border-bottom: 1px solid #fcd34d;
            padding-bottom: 6px;
            text-transform: uppercase;
        }
        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
        }
        .field { display: flex; flex-direction: column; gap: 6px; }
        .field label {
            color: #64748b;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
        }
        .field input, .field select {
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            padding: 10px;
            font-size: 14px;
            background: #fff;
        }
        .students-box {
            border: 1px dashed #dbe3ef;
            border-radius: 8px;
            padding: 10px;
            min-height: 120px;
        }
        .student-row {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .student-row:last-child { border-bottom: none; }
        .actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
        .btn-primary {
            border: none;
            border-radius: 8px;
            padding: 10px 14px;
            color: #fff;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background: linear-gradient(90deg, #d97706 0%, #f59e0b 100%);
        }
        .btn-ghost {
            border: 1px solid #dbe3ef;
            border-radius: 8px;
            padding: 10px 14px;
            color: #475569;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
            background: #fff;
        }
        .status { font-size: 12px; font-weight: 600; color: #92400e; }
        .status.error { color: #b91c1c; }
        .muted { color: #94a3b8; font-style: italic; }
        @media (max-width: 900px) {
            .grid-4 { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body class="theme-petroleo" data-shell-title="Novo Apontamento" data-shell-breadcrumb="LDFP / Secretaria / EBD / Grades EBD / Novo Apontamento" data-shell-active="ebd_grades.html" data-shell-chip="Ambiente autenticado" data-shell-role="Administrador">
    <main class="main-content enterprise-main">
        <div class="page-wrap">
            <div class="form-card">
                <div class="form-head" id="formHead">Novo Apontamento</div>
                <form id="gradeForm" class="form-body">
                    <div class="section">
                        <h3 class="section-title">Dados do Apontamento</h3>
                        <div class="grid-4">
                            <div class="field">
                                <label for="turmaGrade">Turma</label>
                                <select id="turmaGrade" required></select>
                            </div>
                            <div class="field">
                                <label for="dataGrade">Data</label>
                                <input type="date" id="dataGrade" required>
                            </div>
                            <div class="field">
                                <label for="ofertaGrade">Oferta</label>
                                <input type="number" id="ofertaGrade" min="0" step="0.01" value="0">
                            </div>
                            <div class="field">
                                <label for="visitantesGrade">Visitas</label>
                                <input type="number" id="visitantesGrade" min="0" value="0">
                            </div>
                        </div>
                    </div>

                    <div class="section">
                        <h3 class="section-title">Alunos</h3>
                        <div class="students-box" id="studentsBox">
                            <p class="muted">Selecione a turma para carregar os alunos.</p>
                        </div>
                    </div>

                    <div class="actions">
                        <button class="btn-primary" type="submit" id="btnSalvar">Salvar</button>
                        <button class="btn-ghost" type="button" id="btnVoltar">Voltar</button>
                        <span class="status" id="statusMsg"></span>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="session.js?v=20260501"></script>
    <script src="enterprise-shell.js?v=20260501"></script>
    <script>
        requireAuthSession();

        const form        = document.getElementById('gradeForm');
        const statusMsg   = document.getElementById('statusMsg');
        const formHead    = document.getElementById('formHead');
        const btnSalvar   = document.getElementById('btnSalvar');
        const turmaSelect = document.getElementById('turmaGrade');
        const studentsBox = document.getElementById('studentsBox');

        const params    = new URLSearchParams(window.location.search);
        const editingId = params.get('edit');

        let selectedStudents = []; // [{ id, nome, estagio, presente }]

        const setStatus = (msg, err = false) => {
            statusMsg.textContent = msg;
            statusMsg.className   = 'status' + (err ? ' error' : '');
        };

        async function loadTurmas() {
            try {
                const turmas = await fetch('/api/ebd/turmas').then(r => r.json());
                turmaSelect.innerHTML = '<option value="">Selecione...</option>' +
                    turmas.map(t => `<option value="${t.id}">${t.nome}</option>`).join('');
            } catch (e) {
                console.error('loadTurmas:', e);
            }
        }

        async function loadStudentsByTurma(turmaId) {
            try {
                const alunos = await fetch(`/api/ebd/alunos?turma_id=${turmaId}`).then(r => r.json());
                if (!alunos.length) {
                    studentsBox.innerHTML = '<p class="muted">Nenhum aluno encontrado para esta turma.</p>';
                    selectedStudents = [];
                    return;
                }
                selectedStudents = alunos.map(a => ({ id: a.id, nome: a.nome, estagio: a.estagio, presente: true }));
                renderStudentRows();
            } catch (e) {
                studentsBox.innerHTML = '<p class="muted">Erro ao carregar alunos.</p>';
            }
        }

        function renderStudentRows() {
            if (!selectedStudents.length) {
                studentsBox.innerHTML = '<p class="muted">Nenhum aluno encontrado para esta turma.</p>';
                return;
            }
            studentsBox.innerHTML = selectedStudents.map((item, index) => {
                const checked = item.presente ? 'checked' : '';
                return `
                    <div class="student-row">
                        <span>${item.nome || '-'}</span>
                        <label><input type="checkbox" data-index="${index}" ${checked}> Presente</label>
                    </div>
                `;
            }).join('');
            studentsBox.querySelectorAll('input[type="checkbox"]').forEach(cb => {
                cb.addEventListener('change', () => {
                    const idx = Number(cb.getAttribute('data-index'));
                    if (Number.isFinite(idx) && selectedStudents[idx]) {
                        selectedStudents[idx].presente = cb.checked;
                    }
                });
            });
        }

        async function loadEditData() {
            if (!editingId) return;
            try {
                const res = await fetch(`/api/ebd/apontamentos/${editingId}`);
                const apt = await res.json();
                if (!res.ok) { setStatus(apt.error || 'Apontamento não encontrado.', true); return; }

                document.getElementById('dataGrade').value      = apt.data || '';
                document.getElementById('ofertaGrade').value    = apt.oferta || 0;
                document.getElementById('visitantesGrade').value= apt.visitantes || 0;
                turmaSelect.value = String(apt.turmaId || '');

                selectedStudents = Array.isArray(apt.alunos) ? apt.alunos : [];
                renderStudentRows();
                formHead.textContent  = 'Editar Apontamento';
                btnSalvar.textContent = 'Atualizar';
            } catch (e) {
                setStatus('Erro ao carregar apontamento.', true);
            }
        }

        turmaSelect.addEventListener('change', async () => {
            const turmaId = turmaSelect.value;
            if (!turmaId) {
                studentsBox.innerHTML = '<p class="muted">Selecione a turma para carregar os alunos.</p>';
                selectedStudents = [];
                return;
            }
            if (!editingId) await loadStudentsByTurma(turmaId);
        });

        document.getElementById('btnVoltar').addEventListener('click', () => {
            window.location.href = 'ebd_grades.html';
        });

        form.addEventListener('submit', async (event) => {
            event.preventDefault();
            btnSalvar.disabled = true;
            setStatus('');

            const turmaId   = turmaSelect.value;
            const data      = document.getElementById('dataGrade').value;
            const oferta    = document.getElementById('ofertaGrade').value;
            const visitantes= document.getElementById('visitantesGrade').value;

            if (!turmaId || !data) {
                setStatus('Informe Turma e Data.', true);
                btnSalvar.disabled = false;
                return;
            }

            const payload = {
                turmaId: parseInt(turmaId),
                data,
                oferta: parseFloat(oferta) || 0,
                visitantes: parseInt(visitantes) || 0,
                alunos: selectedStudents
            };
            const url    = editingId ? `/api/ebd/apontamentos/${editingId}` : '/api/ebd/apontamentos';
            const method = editingId ? 'PUT' : 'POST';

            try {
                const res  = await fetch(url, {
                    method,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const json = await res.json();
                if (!res.ok) { setStatus(json.error || 'Erro ao salvar.', true); return; }
                setStatus(editingId ? 'Apontamento atualizado!' : 'Apontamento salvo com sucesso!');
                if (!editingId) {
                    form.reset();
                    studentsBox.innerHTML = '<p class="muted">Selecione a turma para carregar os alunos.</p>';
                    selectedStudents = [];
                }
            } catch (e) {
                setStatus('Erro de comunicação.', true);
            } finally {
                btnSalvar.disabled = false;
            }
        });

        (async () => {
            await loadTurmas();
            document.getElementById('dataGrade').value = new Date().toISOString().slice(0, 10);
            await loadEditData();
        })();
    </script>
</body>
</html>
