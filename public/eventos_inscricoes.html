<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Inscrições em Eventos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="relatorios.css?v=20261111b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .ev-layout { display:grid; grid-template-columns:minmax(260px, 360px) 1fr; gap:16px; align-items:start; }
        @media (max-width: 960px) { .ev-layout { grid-template-columns:1fr; } }
        .ev-item { border:1px solid #e2e8f0; border-radius:10px; padding:10px 12px; margin-bottom:8px; cursor:pointer; background:#fff; }
        .ev-item:hover { border-color:#0f766e; }
        .ev-item.sel { border-color:#0f766e; box-shadow:0 0 0 2px rgba(15,118,110,.15); }
        .ev-item strong { display:block; color:#0f172a; font-size:14px; }
        .ev-item small { color:#64748b; font-size:12px; }
        .ev-tag { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; margin-top:6px; background:#e2e8f0; color:#334155; }
        .ev-tag.aberta { background:#dcfce7; color:#166534; } .ev-tag.esgotada, .ev-tag.encerrada { background:#fee2e2; color:#991b1b; }
        .ev-cfg { display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; align-items:end; }
        .ev-cfg label { display:flex; flex-direction:column; gap:4px; font-size:12px; font-weight:600; color:#475569; }
        .ev-cfg input[type=number], .ev-cfg input[type=datetime-local] { padding:9px 10px; border:1px solid #dbe3ef; border-radius:8px; font-size:14px; }
        .ev-cfg .chk { flex-direction:row; align-items:center; gap:8px; font-size:14px; color:#0f172a; }
        .ev-msg { font-size:13px; margin-top:8px; } .ev-msg.ok { color:#047857; } .ev-msg.erro { color:#b91c1c; }
        .ev-vazio { text-align:center; color:#94a3b8; padding:30px 10px; }
        .ev-pres { width:18px; height:18px; cursor:pointer; }
        tr.cancelado td { color:#94a3b8; text-decoration:line-through; }
    </style>
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="eventos_inscricoes.html" data-shell-title="Inscrições em Eventos" data-shell-breadcrumb="LDFP / Secretaria / Inscrições em Eventos" data-shell-chip="Ambiente autenticado">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Inscrições em Eventos</h2>
                <p>Abra inscrições para eventos da <a href="agenda.html">Agenda</a>. O membro se inscreve pelo App (Eventos), e aqui você acompanha a lista e marca a presença.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-solid fa-clipboard-check"></i> Eventos</div>
        </div>

        <div class="ev-layout">
            <section class="rl-card">
                <h3>Eventos (últimos 30 dias e próximos)</h3>
                <div id="eventos"><div class="ev-vazio">Carregando...</div></div>
            </section>

            <section class="rl-card" id="painel">
                <div class="ev-vazio" id="semSel">Escolha um evento ao lado.</div>
                <div id="det" hidden>
                    <h3 id="evTitulo"></h3>
                    <p id="evQuando" style="margin:-4px 0 12px;color:#64748b;font-size:13px;"></p>
                    <div class="ev-cfg">
                        <label class="chk"><input type="checkbox" id="cfgAberta"> Inscrições abertas no App</label>
                        <label>Vagas (vazio = ilimitado)<input type="number" min="1" id="cfgVagas"></label>
                        <label>Inscrições até (opcional)<input type="datetime-local" id="cfgAte"></label>
                        <button class="rl-btn" id="btnSalvar" type="button"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
                    </div>
                    <p class="ev-msg" id="cfgMsg"></p>

                    <div class="rl-kpis" id="kpis" style="margin:14px 0;"></div>

                    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center;">
                        <h3 style="margin:0">Inscritos</h3>
                        <button class="rl-btn ghost" id="btnCsv" type="button" style="margin-left:auto"><i class="fa-solid fa-file-csv"></i> Excel (CSV)</button>
                        <button class="rl-btn ghost" id="btnImprimir" type="button"><i class="fa-solid fa-print"></i> Imprimir lista</button>
                    </div>
                    <div id="inscritos"></div>
                </div>
            </section>
        </div>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script src="relatorios-core.js?v=20261111b"></script>
<script>
requireAuthSession();
(function () {
    const $ = (id) => document.getElementById(id);
    const esc = RL.esc;
    let eventos = [];
    let sel = null;
    let inscritos = [];

    async function api(url, method = 'GET', body) {
        const opts = { method, headers: { Accept: 'application/json' } };
        if (method !== 'GET') { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body || {}); }
        const r = await fetch(url, opts);
        let d = null; try { d = await r.json(); } catch (_) { /* vazio */ }
        if (!r.ok) throw new Error(r.status === 403 ? 'Apenas admin, secretaria ou pastor gerenciam inscrições.' : ((d && (d.error || d.message)) || `Erro ${r.status}`));
        return d;
    }
    // Agenda grava UTC "YYYY-MM-DD HH:MM:SS"
    function dt(v) {
        if (!v) return null;
        const s = String(v);
        const d = /^\d{4}-\d{2}-\d{2} \d{2}:\d{2}/.test(s) ? new Date(s.replace(' ', 'T') + 'Z') : new Date(s);
        return isNaN(d) ? null : d;
    }
    const fmt = (v) => { const d = dt(v); return d ? d.toLocaleString('pt-BR', { dateStyle: 'short', timeStyle: 'short' }) : '—'; };
    function paraInput(v) {
        const d = dt(v); if (!d) return '';
        const p = (n) => String(n).padStart(2, '0');
        return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
    }
    const ROTULO = { aberta: 'inscrições abertas', fechada: 'sem inscrição', esgotada: 'vagas esgotadas', encerrada: 'inscrições encerradas' };

    function renderEventos() {
        if (!eventos.length) { $('eventos').innerHTML = '<div class="ev-vazio">Nenhum evento. Cadastre na <a href="agenda.html">Agenda</a>.</div>'; return; }
        $('eventos').innerHTML = eventos.map((e) => `<div class="ev-item ${sel && sel.id === e.id ? 'sel' : ''}" data-id="${e.id}">
            <strong>${esc(e.titulo)}</strong><small>${esc(fmt(e.inicio))}</small><br>
            <span class="ev-tag ${e.situacao_inscricao}">${ROTULO[e.situacao_inscricao] || ''}</span>
            ${e.inscritos ? `<span class="ev-tag">${e.inscritos} inscrito(s)${e.vagas ? ' / ' + e.vagas : ''}</span>` : ''}
        </div>`).join('');
    }

    async function carregarEventos() {
        try {
            eventos = (await api('/api/eventos-inscricao/eventos')).items;
            renderEventos();
            const qs = new URLSearchParams(location.search).get('evento');
            if (!sel && qs && eventos.find((e) => String(e.id) === qs)) abrir(Number(qs));
        } catch (e) { $('eventos').innerHTML = `<div class="rl-alerta erro">${esc(e.message)}</div>`; }
    }

    async function abrir(id) {
        try {
            const d = await api(`/api/eventos-inscricao/eventos/${id}/inscritos`);
            sel = d.evento;
            inscritos = d.items;
            $('semSel').hidden = true; $('det').hidden = false;
            $('evTitulo').textContent = sel.titulo;
            $('evQuando').textContent = `${fmt(sel.inicio)} → ${fmt(sel.fim)}`;
            $('cfgAberta').checked = sel.inscricao_aberta;
            $('cfgVagas').value = sel.vagas || '';
            $('cfgAte').value = paraInput(sel.inscricao_ate);
            $('cfgMsg').textContent = '';
            renderInscritos();
            renderEventos();
        } catch (e) { alert(e.message); }
    }

    function renderInscritos() {
        const ativos = inscritos.filter((i) => i.status === 'inscrito');
        const pres = ativos.filter((i) => i.presente).length;
        $('kpis').innerHTML = `
            <div class="rl-kpi"><small>Inscritos</small><strong>${ativos.length}</strong></div>
            <div class="rl-kpi"><small>Vagas restantes</small><strong>${sel.vagas ? Math.max(0, sel.vagas - ativos.length) : '∞'}</strong></div>
            <div class="rl-kpi pos"><small>Presentes</small><strong>${pres}</strong></div>
            <div class="rl-kpi"><small>Cancelados</small><strong>${inscritos.length - ativos.length}</strong></div>`;
        if (!inscritos.length) { $('inscritos').innerHTML = '<div class="ev-vazio">Ninguém inscrito ainda.</div>'; return; }
        $('inscritos').innerHTML = `<div class="rl-tabela-wrap"><table class="rl-tabela"><thead><tr>
            <th>#</th><th>Nome</th><th>Celular</th><th>Inscrito em</th><th>Situação</th><th>Presente</th></tr></thead><tbody>
            ${inscritos.map((i, n) => `<tr class="${i.status}" data-iid="${i.id}">
                <td>${n + 1}</td><td>${esc(i.nome)}</td><td>${esc(i.celular || '')}</td><td>${esc(fmt(i.created_at))}</td>
                <td>${i.status === 'inscrito' ? 'Inscrito' : 'Cancelado'}</td>
                <td>${i.status === 'inscrito' ? `<input type="checkbox" class="ev-pres" ${i.presente ? 'checked' : ''}>` : ''}</td>
            </tr>`).join('')}</tbody></table></div>`;
    }

    $('eventos').addEventListener('click', (ev) => {
        const it = ev.target.closest('.ev-item');
        if (it) abrir(Number(it.dataset.id));
    });

    $('inscritos').addEventListener('change', async (ev) => {
        if (!ev.target.classList.contains('ev-pres')) return;
        const iid = Number(ev.target.closest('tr').dataset.iid);
        try {
            await api(`/api/eventos-inscricao/inscritos/${iid}`, 'PATCH', { presente: ev.target.checked });
            const i = inscritos.find((x) => x.id === iid); if (i) i.presente = ev.target.checked;
            renderInscritos();
        } catch (e) { alert(e.message); ev.target.checked = !ev.target.checked; }
    });

    $('btnSalvar').addEventListener('click', async () => {
        if (!sel) return;
        const ate = $('cfgAte').value;
        try {
            await api(`/api/eventos-inscricao/eventos/${sel.id}/config`, 'PUT', {
                inscricao_aberta: $('cfgAberta').checked,
                vagas: $('cfgVagas').value,
                inscricao_ate: ate ? new Date(ate).toISOString() : null
            });
            $('cfgMsg').className = 'ev-msg ok';
            $('cfgMsg').textContent = $('cfgAberta').checked ? 'Salvo! O botão "Inscrever-se" já aparece no App do Membro.' : 'Salvo. Inscrições fechadas.';
            await carregarEventos();
            abrir(sel.id);
        } catch (e) { $('cfgMsg').className = 'ev-msg erro'; $('cfgMsg').textContent = e.message; }
    });

    const COLS = [{ key: 'nome', label: 'Nome' }, { key: 'celular', label: 'Celular' }, { key: 'status', label: 'Situação' }, { key: 'presenteTxt', label: 'Presente' }];
    $('btnCsv').addEventListener('click', () => {
        if (!sel) return;
        RL.exportarCSV(`inscritos-${sel.titulo}`, COLS, inscritos.map((i) => ({ ...i, presenteTxt: i.presente ? 'Sim' : 'Não' })));
    });
    $('btnImprimir').addEventListener('click', () => {
        if (!sel) return;
        const w = window.open('', '_blank');
        if (!w) { alert('Permita pop-ups para imprimir.'); return; }
        const linhas = inscritos.filter((i) => i.status === 'inscrito')
            .map((i, n) => `<tr><td>${n + 1}</td><td>${esc(i.nome)}</td><td>${esc(i.celular || '')}</td><td style="width:90px">${i.presente ? '✔' : ''}</td><td style="width:200px"></td></tr>`).join('');
        w.document.write(`<!DOCTYPE html><html lang="pt-br"><head><meta charset="UTF-8"><title>Lista de presença</title>
            <style>body{font-family:Arial,sans-serif;color:#0f172a;margin:20px}h1{font-size:20px;margin:0}p{margin:4px 0 14px;color:#475569}
            table{width:100%;border-collapse:collapse;font-size:13px}th,td{border:1px solid #cbd5e1;padding:7px;text-align:left}th{background:#f1f5f9}</style></head><body>
            <h1>${esc(sel.titulo)}</h1><p>${esc(fmt(sel.inicio))} — ${esc(RL.nomeIgreja ? RL.nomeIgreja() : '')}</p>
            <table><thead><tr><th>#</th><th>Nome</th><th>Celular</th><th>Presente</th><th>Assinatura</th></tr></thead><tbody>${linhas}</tbody></table>
            </body></html>`);
        w.document.close();
        setTimeout(() => { w.focus(); w.print(); }, 400);
    });

    carregarEventos();
})();
</script>
</body>
</html>
