<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Graficos Secretaria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px; box-shadow:0 8px 24px rgba(15,23,42,.08); margin-bottom:16px; }
        .bar { margin:14px 0; }
        .bar-head { display:flex; justify-content:space-between; font-size:13px; color:#334155; margin-bottom:6px; }
        .bar-track { width:100%; height:12px; border-radius:999px; background:#e2e8f0; overflow:hidden; }
        .bar-fill { height:100%; background:linear-gradient(90deg,#0ea5e9,#14b8a6); }
    </style>
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="graficos_secretaria.html" data-shell-title="Graficos Secretaria" data-shell-breadcrumb="LDFP / Graficos / Secretaria" data-shell-chip="Indicadores" data-shell-role="Secretaria">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Graficos da Secretaria</h2>
                <p>Indicadores visuais de cadastro, visitantes e grupos da igreja.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-solid fa-chart-pie"></i> Painel visual</div>
        </div>

        <section class="card">
            <h3>Resumo do mes</h3>
            <div class="bar">
                <div class="bar-head"><span>Novos membros</span><strong>68%</strong></div>
                <div class="bar-track"><div class="bar-fill" style="width:68%"></div></div>
            </div>
            <div class="bar">
                <div class="bar-head"><span>Visitantes convertidos</span><strong>41%</strong></div>
                <div class="bar-track"><div class="bar-fill" style="width:41%"></div></div>
            </div>
            <div class="bar">
                <div class="bar-head"><span>Presenca em grupos</span><strong>77%</strong></div>
                <div class="bar-track"><div class="bar-fill" style="width:77%"></div></div>
            </div>
        </section>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script>requireAuthSession();</script>
</body>
</html>
