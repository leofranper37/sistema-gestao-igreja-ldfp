<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Gráficos Secretaria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="relatorios.css?v=20261111">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="graficos_secretaria.html" data-shell-title="Gráficos Secretaria" data-shell-breadcrumb="LDFP / Gráficos / Secretaria" data-shell-chip="Indicadores" data-shell-role="Secretaria">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Gráficos da Secretaria</h2>
                <p>Perfil da igreja e crescimento, com dados reais do cadastro.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-solid fa-chart-pie"></i> Secretaria</div>
        </div>

        <section class="rl-card rl-noprint">
            <div class="rl-filtros">
                <label>De <input type="date" id="inicio"></label>
                <label>Até <input type="date" id="fim"></label>
                <label>Membros
                    <select id="situacao">
                        <option value="">Todas as situações</option>
                        <option value="Ativo">Somente ativos</option>
                    </select>
                </label>
                <button class="rl-btn" id="btnGerar" type="button"><i class="fa-solid fa-rotate"></i> Atualizar</button>
                <div class="rl-acoes">
                    <button class="rl-btn ghost" id="btnImprimir" type="button"><i class="fa-solid fa-print"></i> Imprimir / PDF</button>
                </div>
            </div>
            <p class="rl-status" id="status"></p>
        </section>

        <div class="rl-kpis" id="kpis"></div>

        <div class="rl-grid">
            <section class="rl-card full"><h3><i class="fa-solid fa-arrow-trend-up"></i> Novos cadastros — últimos 12 meses</h3><div class="rl-chart"><canvas id="gCrescimento"></canvas></div></section>
            <section class="rl-card"><h3><i class="fa-solid fa-venus-mars"></i> Sexo</h3><div class="rl-chart"><canvas id="gSexo"></canvas></div></section>
            <section class="rl-card"><h3><i class="fa-solid fa-cake-candles"></i> Faixa etária</h3><div class="rl-chart"><canvas id="gFaixa"></canvas></div></section>
            <section class="rl-card"><h3><i class="fa-solid fa-ring"></i> Estado civil</h3><div class="rl-chart"><canvas id="gCivil"></canvas></div></section>
            <section class="rl-card"><h3><i class="fa-solid fa-user-check"></i> Situação dos membros</h3><div class="rl-chart"><canvas id="gSituacao"></canvas></div></section>
            <section class="rl-card"><h3><i class="fa-solid fa-id-badge"></i> Cargos</h3><div class="rl-chart alto"><canvas id="gCargo"></canvas></div></section>
            <section class="rl-card"><h3><i class="fa-solid fa-location-dot"></i> Cidades</h3><div class="rl-chart alto"><canvas id="gCidade"></canvas></div></section>
        </div>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script src="relatorios-core.js?v=20261111"></script>
<script>
requireAuthSession();
(function () {
    const $ = (id) => document.getElementById(id);
    const C = RL.CORES;

    function rosca(id, lista) {
        RL.grafico(id, {
            type: 'doughnut',
            data: { labels: lista.map((x) => x.label), datasets: [{ data: lista.map((x) => x.valor), backgroundColor: lista.map((_, i) => C[i % C.length]), borderWidth: 2, borderColor: '#fff' }] },
            options: { plugins: { legend: { position: 'right' } }, cutout: '55%' }
        });
    }
    function barras(id, lista, horizontal, cor) {
        RL.grafico(id, {
            type: 'bar',
            data: { labels: lista.map((x) => x.label), datasets: [{ data: lista.map((x) => x.valor), backgroundColor: cor || C[0], borderRadius: 4, maxBarThickness: 36 }] },
            options: { indexAxis: horizontal ? 'y' : 'x', plugins: { legend: { display: false } }, scales: { [horizontal ? 'x' : 'y']: { beginAtZero: true, ticks: { precision: 0 } } } }
        });
    }

    async function gerar() {
        RL.status($('status'), 'Carregando…');
        try {
            const r = await RL.get('/api/relatorios/secretaria/resumo', { inicio: $('inicio').value, fim: $('fim').value, situacao: $('situacao').value });
            const k = r.kpis;
            $('kpis').innerHTML = [
                ['Membros cadastrados', k.membrosTotal, `${RL.numero(k.membrosAtivos)} ativos`],
                ['Novos membros', k.novosMembros, 'no período'],
                ['Visitantes', k.visitantesPeriodo, 'no período'],
                ['Batizados', k.batizados, 'no período'],
                ['Congregados', k.congregados, 'total'],
                ['Crianças', k.criancas, 'total'],
                ['Grupos ativos', k.gruposAtivos, 'total']
            ].map(([t, v, s]) => `<div class="rl-kpi"><small>${t}</small><strong>${RL.numero(v)}</strong><div class="sub">${s}</div></div>`).join('');

            const d = r.distribuicoes;
            rosca('gSexo', d.sexo);
            barras('gFaixa', d.faixaEtaria, false, C[1]);
            rosca('gCivil', d.estadoCivil);
            rosca('gSituacao', d.situacao);
            barras('gCargo', d.cargo, true, C[4]);
            barras('gCidade', d.cidade, true, C[7]);

            const meses = r.crescimento.meses.map((m) => RL.MESES[Number(m.slice(5, 7)) - 1] + '/' + m.slice(2, 4));
            RL.grafico('gCrescimento', {
                type: 'bar',
                data: { labels: meses, datasets: [
                    { label: 'Novos membros', data: r.crescimento.membros, backgroundColor: C[0], borderRadius: 4 },
                    { label: 'Visitantes', data: r.crescimento.visitantes, backgroundColor: C[2], borderRadius: 4 }
                ] },
                options: { scales: { y: { beginAtZero: true, ticks: { precision: 0 } } } }
            });
            RL.status($('status'), k.membrosTotal ? '' : 'Ainda não há membros cadastrados nesta igreja.');
        } catch (e) {
            RL.status($('status'), e.message, true);
        }
    }

    $('inicio').value = RL.inicioAnoISO();
    $('fim').value = RL.hojeISO();
    $('btnGerar').addEventListener('click', gerar);
    $('btnImprimir').addEventListener('click', () => RL.imprimir('Gráficos da Secretaria', `Período ${RL.data($('inicio').value)} a ${RL.data($('fim').value)}`));
    gerar();
})();
</script>
</body>
</html>
