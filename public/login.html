<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - LDFP</title>
    <style>
        body { margin: 0; font-family: 'Segoe UI', sans-serif; background-color: #e5e7eb; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .login-card { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 100%; max-width: 400px; text-align: center; }
        
        /* LOGO */
        .logo img { height: 80px; margin-bottom: 20px; }

        .form-group { margin-bottom: 15px; text-align: left; }
        .form-group label { display: block; font-size: 13px; font-weight: bold; color: #555; margin-bottom: 5px; }
        .form-group input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .form-group input:focus { border-color: #f59e0b; outline: none; }
        
        .options { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 20px; }
        .options a { color: #f59e0b; text-decoration: none; }
        
        .btn-login { 
            background-color: #f59e0b; color: #111; width: 100%; padding: 12px; 
            border: none; border-radius: 4px; font-weight: bold; cursor: pointer; font-size: 16px; transition: 0.2s; 
        }
        .btn-login:hover { background-color: #d97706; }
        .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }
        
        .footer-links { margin-top: 20px; font-size: 13px; color: #666; }
        .footer-links a { color: #f59e0b; font-weight: bold; text-decoration: none; }
    </style>
</head>
<body class="theme-petroleo">

    <div class="login-card">
        <div class="logo">
            <img src="logo.png" alt="LDFP">
        </div>

        <h2 style="margin-bottom: 20px; font-size: 20px;">Acessar Painel</h2>

        <form onsubmit="return false;"> 
            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="seu@email.com" id="email">
            </div>
            
            <div class="form-group">
                <label>Senha</label>
                <input type="password" placeholder="********" id="senha">
            </div>

            <div class="options">
                <label><input type="checkbox"> Lembrar-me</label>
                <a href="esqueci_senha.html">Esqueceu a senha?</a>
            </div>

            <button type="button" class="btn-login" id="btnLogin" onclick="fazerLogin()">Login</button>
            <!-- Lote 8: login com Google (só aparece se GOOGLE_CLIENT_ID estiver configurado) -->
            <div id="blocoGoogle" style="display:none;margin-top:14px;">
                <div style="display:flex;align-items:center;gap:8px;color:#888;font-size:12px;margin-bottom:10px;"><span style="flex:1;height:1px;background:#ddd"></span>ou<span style="flex:1;height:1px;background:#ddd"></span></div>
                <div id="googleBtn" style="display:flex;justify-content:center;"></div>
            </div>
        </form>
        <!-- Lote 7: verificação em duas etapas -->
        <form id="form2fa" onsubmit="return false;" style="display:none">
            <p style="font-size:13px;color:#444;text-align:left;margin:0 0 10px;">
                <strong>Verificação em duas etapas.</strong> Abra o aplicativo autenticador no celular e digite o código de 6 dígitos.
                Sem o celular? Use um dos seus códigos de recuperação.
            </p>
            <div class="form-group">
                <label>Código</label>
                <input type="text" id="codigo2fa" inputmode="numeric" autocomplete="one-time-code" maxlength="12" placeholder="000000" style="letter-spacing:4px;font-size:18px;text-align:center">
            </div>
            <button type="button" class="btn-login" id="btn2fa" onclick="confirmar2fa()">Confirmar</button>
            <p style="margin-top:10px;font-size:12px;"><a href="login.html" style="color:#555">Voltar</a></p>
        </form>

        <div id="status" style="margin-top:12px; font-size:13px; text-align:left;"></div>

        <div class="footer-links">
            <a href="index.html" style="color:#555; font-size:11px;">Voltar ao inicio</a>
        </div>
    </div>

    <script src="session.js?v=20260501"></script>
    <script>
        function isMasterWorkspaceUser(user) {
            const role = String(user?.role || user?.perfil || '').trim().toLowerCase();
            const igreja = String(user?.igreja || '').trim().toLowerCase();
            const superRoles = new Set(['super-admin', 'super_admin', 'superadmin', 'master', 'owner', 'root', 'super admin']);
            return superRoles.has(role) || (role === 'admin' && igreja === 'ldfp master');
        }

        function isMemberOnlyUser(user) {
            const role = String(user?.role || user?.perfil || '').trim().toLowerCase();
            return role === 'membro' || role === 'visitante';
        }

        function extractErrorMessage(data, fallbackMessage) {
            if (!data) {
                return fallbackMessage;
            }

            return data.error || data.message || fallbackMessage;
        }

        async function fazerLogin() {
            const email = document.getElementById('email').value.trim();
            const senha = document.getElementById('senha').value;
            const status = document.getElementById('status');
            const btn = document.getElementById('btnLogin');

            status.textContent = '';
            status.style.color = '#b91c1c';

            if (!email || !senha) {
                status.textContent = 'Informe e-mail e senha para continuar.';
                return;
            }

            if (!/^\S+@\S+\.\S+$/.test(email)) {
                status.textContent = 'Digite um e-mail valido.';
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Entrando...';

            try {
                const resp = await fetch('/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, senha })
                });

                const data = await resp.json().catch(() => ({}));

                if (!resp.ok) {
                    throw new Error(extractErrorMessage(data, 'Nao foi possivel entrar agora.'));
                }

                if (data.requer_2fa) {
                    window._desafio2fa = data.desafio;
                    document.querySelector('form:not(#form2fa)').style.display = 'none';
                    document.getElementById('form2fa').style.display = '';
                    status.textContent = '';
                    document.getElementById('codigo2fa').focus();
                    return;
                }

                concluirLogin(data);
            } catch (err) {
                status.textContent = err.message || 'Erro inesperado ao tentar entrar.';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Login';
            }
        }

        async function confirmar2fa() {
            const status = document.getElementById('status');
            const btn = document.getElementById('btn2fa');
            const codigo = document.getElementById('codigo2fa').value.trim();
            status.style.color = '#b91c1c';
            if (!codigo) { status.textContent = 'Digite o código.'; return; }
            btn.disabled = true;
            try {
                const resp = await fetch('/login/2fa', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ desafio: window._desafio2fa, codigo })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(extractErrorMessage(data, 'Código incorreto.'));
                if (data.aviso) alert(data.aviso);
                concluirLogin(data);
            } catch (err) {
                status.textContent = err.message;
                if (/expirou|novo|Muitas/i.test(err.message)) setTimeout(() => { window.location.href = 'login.html'; }, 2500);
            } finally {
                btn.disabled = false;
            }
        }
        document.getElementById('codigo2fa').addEventListener('keydown', (e) => { if (e.key === 'Enter') confirmar2fa(); });

        // ── Lote 8: Entrar com Google ──
        async function iniciarGoogle() {
            try {
                const r = await fetch('/api/auth/google/config');
                const cfg = await r.json().catch(() => ({}));
                if (!cfg.ativo || !cfg.clientId) return;
                const sc = document.createElement('script');
                sc.src = 'https://accounts.google.com/gsi/client';
                sc.async = true;
                sc.onload = () => {
                    google.accounts.id.initialize({ client_id: cfg.clientId, callback: entrarComGoogle, ux_mode: 'popup' });
                    google.accounts.id.renderButton(document.getElementById('googleBtn'), { theme: 'outline', size: 'large', text: 'signin_with', locale: 'pt-BR', width: 280 });
                    document.getElementById('blocoGoogle').style.display = '';
                };
                document.head.appendChild(sc);
            } catch (_) { /* sem Google: segue só com senha */ }
        }
        async function entrarComGoogle(resposta) {
            const status = document.getElementById('status');
            status.style.color = '#475569';
            status.textContent = 'Verificando conta Google...';
            try {
                const resp = await fetch('/login/google', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ credential: resposta.credential })
                });
                const data = await resp.json().catch(() => ({}));
                if (!resp.ok) throw new Error(extractErrorMessage(data, 'Não foi possível entrar com o Google.'));
                if (data.requer_2fa) {
                    window._desafio2fa = data.desafio;
                    document.querySelector('form:not(#form2fa)').style.display = 'none';
                    document.getElementById('form2fa').style.display = '';
                    status.textContent = '';
                    document.getElementById('codigo2fa').focus();
                    return;
                }
                concluirLogin(data);
            } catch (err) {
                status.style.color = '#b91c1c';
                status.textContent = err.message;
            }
        }
        iniciarGoogle();

        function concluirLogin(data) {
            const status = document.getElementById('status');
            const btn = document.getElementById('btnLogin');
            {
                if (isMasterWorkspaceUser(data.user)) {
                    status.style.color = '#b91c1c';
                    status.textContent = 'Use a entrada exclusiva do administrador do sistema.';
                    btn.disabled = false;
                    btn.textContent = 'Login';
                    return;
                }

                status.style.color = '#15803d';
                status.textContent = 'Login realizado com sucesso!';
                setTimeout(() => {
                    if (isMemberOnlyUser(data.user)) {
                        clearAuthSession();
                        localStorage.removeItem('ldfpUser');
                        window.location.href = 'app_login.html';
                    } else {
                        saveAuthSession(data);
                        localStorage.setItem('ldfpUser', JSON.stringify(data.user));
                        window.location.href = 'dashboard.html';
                    }
                }, 600);
            }
        }

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Enter' && document.getElementById('form2fa').style.display === 'none') {
                fazerLogin();
            }
        });
    </script>
    <script src="speed-insights.js" defer></script>
</body>
</html>
