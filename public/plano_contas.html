<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Plano de Contas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px; box-shadow:0 8px 24px rgba(15,23,42,.08); margin-bottom:16px; }
        .grid { display:grid; grid-template-columns: 180px 1fr 180px auto; gap:10px; align-items:end; }
        .field { width:100%; padding:10px; border:1px solid #dbe3ef; border-radius:8px; }
        .btn { border:0; background:#0f766e; color:#fff; border-radius:8px; padding:10px 14px; font-weight:700; cursor:pointer; }
        .table { width:100%; border-collapse:collapse; }
        .table th, .table td { border-bottom:1px solid #e5e7eb; text-align:left; padding:10px; font-size:13px; }
        @media (max-width:1100px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="plano_contas.html" data-shell-title="Plano de Contas" data-shell-breadcrumb="LDFP / Contabilidade / Plano de Contas" data-shell-chip="Contabilidade" data-shell-role="Financeiro">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Plano de Contas</h2>
                <p>Cadastre e organize contas contabeis para classificacao das movimentacoes.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-solid fa-list-ol"></i> Estrutura contabil</div>
        </div>

        <section class="card">
            <h3>Nova conta</h3>
            <div class="grid">
                <input id="codigo" class="field" placeholder="Codigo (ex: 1.1.01)">
                <input id="descricao" class="field" placeholder="Descricao da conta">
                <select id="natureza" class="field">
                    <option value="Ativo">Ativo</option>
                    <option value="Passivo">Passivo</option>
                    <option value="Receita">Receita</option>
                    <option value="Despesa">Despesa</option>
                </select>
                <button id="btnAdd" class="btn" type="button">Adicionar</button>
            </div>
        </section>

        <section class="card">
            <h3>Contas cadastradas</h3>
            <table class="table">
                <thead><tr><th>Codigo</th><th>Descricao</th><th>Natureza</th></tr></thead>
                <tbody id="tbody"></tbody>
            </table>
        </section>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script>
requireAuthSession();

const KEY = 'ldfp_plano_contas_v1';

function getItems() {
    try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (_) { return []; }
}

function setItems(items) {
    localStorage.setItem(KEY, JSON.stringify(items));
}

function render() {
    const tbody = document.getElementById('tbody');
    const items = getItems();
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="3">Nenhuma conta cadastrada.</td></tr>';
        return;
    }

    tbody.innerHTML = items.map((i) => '<tr><td>' + i.codigo + '</td><td>' + i.descricao + '</td><td>' + i.natureza + '</td></tr>').join('');
}

document.getElementById('btnAdd').addEventListener('click', () => {
    const codigo = document.getElementById('codigo').value.trim();
    const descricao = document.getElementById('descricao').value.trim();
    const natureza = document.getElementById('natureza').value;
    if (!codigo || !descricao) return;

    const items = getItems();
    items.push({ codigo, descricao, natureza });
    setItems(items);

    document.getElementById('codigo').value = '';
    document.getElementById('descricao').value = '';
    render();
});

render();
</script>
</body>
</html>
