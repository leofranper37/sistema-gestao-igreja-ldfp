<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Plano de Contas</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .card { background:#fff; border:1px solid #e5e7eb; border-radius:12px; padding:18px; box-shadow:0 8px 24px rgba(15,23,42,.08); margin-bottom:16px; }
        .grid { display:grid; grid-template-columns: 180px 1fr 180px auto; gap:10px; align-items:end; }
        .field { width:100%; padding:10px; border:1px solid #dbe3ef; border-radius:8px; }
        .btn { border:0; background:#0f766e; color:#fff; border-radius:8px; padding:10px 14px; font-weight:700; cursor:pointer; }
        .table { width:100%; border-collapse:collapse; }
        .table th, .table td { border-bottom:1px solid #e5e7eb; text-align:left; padding:10px; font-size:13px; }
        @media (max-width:1100px) { .grid { grid-template-columns: 1fr 1fr; } }
    </style>
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="plano_contas.html" data-shell-title="Plano de Contas" data-shell-breadcrumb="LDFP / Contabilidade / Plano de Contas" data-shell-chip="Contabilidade" data-shell-role="Financeiro">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Plano de Contas</h2>
                <p>Cadastre e organize contas contábeis para classificação das movimentações.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-solid fa-list-ol"></i> Estrutura contábil</div>
        </div>

        <section class="card">
            <h3>Nova conta</h3>
            <div class="grid">
                <input id="codigo" class="field" placeholder="Código (ex: 1.1.01)">
                <input id="descricao" class="field" placeholder="Descrição da conta">
                <select id="natureza" class="field" title="Natureza da conta" aria-label="Natureza da conta">
                    <option value="ativo">Ativo</option>
                    <option value="passivo">Passivo</option>
                    <option value="receita">Receita</option>
                    <option value="despesa">Despesa</option>
                </select>
                <button id="btnAdd" class="btn" type="button">Adicionar</button>
            </div>
            <p id="msg" style="margin-top:10px;font-size:13px;"></p>
        </section>

        <section class="card">
            <h3>Contas cadastradas</h3>
            <table class="table">
                <thead><tr><th>Código</th><th>Descrição</th><th>Natureza</th></tr></thead>
                <tbody id="tbody"><tr><td colspan="3">Carregando...</td></tr></tbody>
            </table>
        </section>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script>
requireAuthSession();

const NATUREZA_LABEL = { ativo: 'Ativo', passivo: 'Passivo', receita: 'Receita', despesa: 'Despesa' };

function setMsg(text, isError) {
    const el = document.getElementById('msg');
    el.textContent = text;
    el.style.color = isError ? '#b91c1c' : '#0f766e';
}

function render(items) {
    const tbody = document.getElementById('tbody');
    if (!items.length) {
        tbody.innerHTML = '<tr><td colspan="3">Nenhuma conta cadastrada.</td></tr>';
        return;
    }

    tbody.innerHTML = items.map((i) => '<tr><td>' + i.codigo + '</td><td>' + i.nome + '</td><td>' + (NATUREZA_LABEL[i.natureza] || i.natureza) + '</td></tr>').join('');
}

async function carregar() {
    try {
        const resp = await fetch('/contabilidade/plano-contas');
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || 'Erro ao carregar plano de contas.');
        render(data.items || []);
    } catch (err) {
        document.getElementById('tbody').innerHTML = '<tr><td colspan="3">Não foi possível carregar as contas.</td></tr>';
        setMsg(err.message, true);
    }
}

document.getElementById('btnAdd').addEventListener('click', async () => {
    const codigo = document.getElementById('codigo').value.trim();
    const nome = document.getElementById('descricao').value.trim();
    const natureza = document.getElementById('natureza').value;
    if (!codigo || !nome) {
        setMsg('Informe código e descrição.', true);
        return;
    }

    try {
        const resp = await fetch('/contabilidade/plano-contas', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ codigo, nome, natureza })
        });
        const data = await resp.json().catch(() => ({}));
        if (!resp.ok) throw new Error(data.error || 'Erro ao adicionar conta.');

        document.getElementById('codigo').value = '';
        document.getElementById('descricao').value = '';
        setMsg('Conta adicionada com sucesso.', false);
        await carregar();
    } catch (err) {
        setMsg(err.message, true);
    }
});

carregar();
</script>
</body>
</html>
