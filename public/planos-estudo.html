<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planos de Leitura — LDFP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .page-wrap { padding: 24px 30px 40px; }
        .page-header { margin-bottom: 24px; }
        .page-header h2 { margin: 0; font-size: 24px; color: #0f172a; display: flex; align-items: center; gap: 10px; }
        .page-header p { color: #64748b; font-size: 13px; margin-top: 4px; }

        .planos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .plano-card {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 14px rgba(15,23,42,.04);
            text-decoration: none;
            color: inherit;
            display: flex;
            flex-direction: column;
            transition: transform .2s, box-shadow .2s;
        }
        .plano-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 25px rgba(15,23,42,.08);
        }
        .plano-card-header {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            margin-bottom: 12px;
        }
        .plano-icon {
            width: 44px; height: 44px;
            border-radius: 12px;
            display: grid;
            place-items: center;
            font-size: 20px;
            color: #fff;
            flex-shrink: 0;
        }
        .plano-icon.leitura { background: linear-gradient(135deg, #0ea5e9, #3b82f6); }
        .plano-icon.tematico { background: linear-gradient(135deg, #8b5cf6, #a855f7); }
        .plano-icon.devocional { background: linear-gradient(135deg, #10b981, #22c55e); }

        .plano-title { font-size: 16px; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
        .plano-desc { font-size: 13px; color: #64748b; line-height: 1.5; flex-grow: 1; }

        .progress-wrap { margin-top: 16px; }
        .progress-info { display: flex; justify-content: space-between; font-size: 11px; color: #64748b; margin-bottom: 4px; font-weight: 600; }
        .progress-track { height: 8px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
        .progress-bar { height: 100%; background: linear-gradient(90deg, #0ea5e9, #10b981); border-radius: 99px; transition: width .4s; }
        .progress-bar.done { background: #10b981; }

        .empty-state { text-align: center; padding: 60px 20px; color: #64748b; }
    </style>
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-title="Planos de Leitura" data-shell-breadcrumb="LDFP / Ensino / Planos" data-shell-active="planos-estudo.html">
    <main class="main-content enterprise-main">
        <div class="page-wrap">
            <div class="page-header">
                <div>
                    <h2><i class="fa-solid fa-map-signs" style="color:#8b5cf6"></i> Planos de Leitura</h2>
                    <p>Escolha um plano para começar sua jornada de estudo da Palavra.</p>
                </div>
            </div>
            <div id="planosGrid" class="planos-grid">
                <div class="empty-state"><i class="fa-solid fa-spinner fa-spin fa-2x"></i><p>Carregando planos...</p></div>
            </div>
        </div>
    </main>

    <script src="session.js?v=20260501"></script>
    <script src="enterprise-shell.js?v=20260501"></script>
    <script>
        requireAuthSession();

        async function carregarPlanos() {
            const grid = document.getElementById('planosGrid');
            try {
                const res = await fetch('/api/estudo/planos');
                if (!res.ok) throw new Error('Erro ao buscar planos.');
                const planos = await res.json();

                if (!planos.length) {
                    grid.innerHTML = '<div class="empty-state">Nenhum plano de leitura disponível no momento.</div>';
                    return;
                }

                grid.innerHTML = planos.map(p => {
                    const progresso = p.passo_atual || 0;
                    const total = p.dias_total || 1;
                    const percent = Math.round((progresso / total) * 100);
                    const concluido = p.concluido || progresso >= total;

                    let icon = 'fa-solid fa-book-bible';
                    if (p.tipo === 'tematico') icon = 'fa-solid fa-cross';
                    if (p.tipo === 'devocional') icon = 'fa-solid fa-sun';

                    return `
                        <a href="plano-detalhe.html?id=${p.id}" class="plano-card">
                            <div>
                                <div class="plano-card-header">
                                    <div class="plano-icon ${p.tipo || 'leitura'}"><i class="${icon}"></i></div>
                                    <div>
                                        <div class="plano-title">${p.titulo}</div>
                                        <div class="plano-desc">${p.descricao || ''}</div>
                                    </div>
                                </div>
                            </div>
                            <div class="progress-wrap">
                                <div class="progress-info">
                                    <span>${concluido ? 'Concluído!' : `Dia ${progresso} de ${total}`}</span>
                                    <span>${percent}%</span>
                                </div>
                                <div class="progress-track">
                                    <div class="progress-bar ${concluido ? 'done' : ''}" style="width: ${percent}%"></div>
                                </div>
                            </div>
                        </a>
                    `;
                }).join('');

            } catch (err) {
                grid.innerHTML = `<div class="empty-state" style="color:#ef4444">${err.message}</div>`;
            }
        }

        carregarPlanos();
    </script>
</body>
</html>
