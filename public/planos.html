<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>LDFP - Planos para Igrejas</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #020617;
      --card: #0d1929;
      --card-featured: #0f1f35;
      --border: #1e293b;
      --border-featured: #f97316;
      --accent: #f97316;
      --accent-soft: rgba(249,115,22,0.15);
      --green: #22c55e;
      --red: #ef4444;
      --text: #e2e8f0;
      --muted: #64748b;
      --muted-soft: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: radial-gradient(ellipse at top, #0f172a 0%, #020617 60%, #000 100%);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── HEADER ─────────────────────────────────────────────── */
    .page-header {
      text-align: center;
      padding: 48px 16px 36px;
      position: relative;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-bottom: 24px;
    }

    .brand-logo {
      width: 64px;
      height: 64px;
      object-fit: contain;
      filter: drop-shadow(0 0 12px rgba(249,115,22,0.4));
    }

    .brand-leao {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid rgba(249,115,22,0.5);
      box-shadow: 0 0 24px rgba(249,115,22,0.2);
    }

    .page-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(249,115,22,0.1);
      border: 1px solid rgba(249,115,22,0.25);
      border-radius: 999px;
      padding: 5px 14px;
      font-size: 0.78rem;
      color: #fdba74;
      margin-bottom: 16px;
      letter-spacing: 0.3px;
    }

    .page-title {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #f1f5f9, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-subtitle {
      font-size: 0.95rem;
      color: var(--muted-soft);
      max-width: 480px;
      margin: 0 auto;
      line-height: 1.6;
    }

    /* ── UPGRADE NOTICE ─────────────────────────────────────── */
    .upgrade-notice {
      background: rgba(245,158,11,0.1);
      border: 1px solid rgba(245,158,11,0.35);
      color: #fde68a;
      padding: 14px 20px;
      border-radius: 12px;
      font-size: 0.88rem;
      text-align: center;
      margin: 0 16px 28px;
      line-height: 1.5;
    }

    /* ── PLANS GRID ─────────────────────────────────────────── */
    .plans-wrap {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 16px 60px;
    }

    .plans-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      align-items: start;
    }

    /* ── PLAN CARD ──────────────────────────────────────────── */
    .plan-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: transform .18s, box-shadow .18s;
    }

    .plan-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 24px 48px rgba(0,0,0,0.5);
    }

    .plan-card.featured {
      border-color: var(--border-featured);
      background: var(--card-featured);
      box-shadow: 0 0 0 1px rgba(249,115,22,0.2), 0 20px 60px rgba(249,115,22,0.08);
    }

    .plan-card-top {
      padding: 24px 24px 20px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .plan-popular-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: var(--accent);
      color: #0b1120;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 999px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }

    .plan-name {
      font-size: 1.35rem;
      font-weight: 800;
      color: #f8fafc;
      margin-bottom: 4px;
    }

    .plan-subtitle {
      font-size: 0.85rem;
      color: var(--muted-soft);
      margin-bottom: 16px;
    }

    .plan-price-block {
      display: flex;
      align-items: baseline;
      gap: 4px;
    }

    .plan-price-currency {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--muted-soft);
    }

    .plan-price-value {
      font-size: 2.4rem;
      font-weight: 900;
      color: #f8fafc;
      line-height: 1;
    }

    .plan-price-period {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .plan-price-annual {
      font-size: 0.78rem;
      color: #22c55e;
      margin-top: 4px;
    }

    /* ── FEATURES LIST ──────────────────────────────────────── */
    .plan-features {
      padding: 18px 24px;
      flex: 1;
    }

    .features-section-label {
      font-size: 0.68rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
      margin: 14px 0 6px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .features-section-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.06);
    }

    .features-section-label:first-child { margin-top: 0; }

    .feat-row {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      font-size: 0.875rem;
    }

    .feat-icon {
      width: 18px;
      text-align: center;
      flex-shrink: 0;
      font-size: 0.78rem;
    }

    .feat-icon.ok { color: var(--green); }
    .feat-icon.no { color: #334155; }

    .feat-text.no {
      color: var(--muted);
      text-decoration: line-through;
      text-decoration-color: #334155;
    }

    /* ── CTA ────────────────────────────────────────────────── */
    .plan-cta-wrap {
      padding: 20px 24px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }

    .plan-cta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 13px 20px;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      transition: background .15s, transform .08s;
    }

    .plan-cta.primary {
      background: var(--accent);
      color: #0b1120;
    }

    .plan-cta.primary:hover {
      background: #ea580c;
      transform: translateY(-1px);
    }

    .plan-card.featured .plan-cta.primary {
      box-shadow: 0 4px 20px rgba(249,115,22,0.4);
    }

    .plan-cta-note {
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      margin-top: 8px;
    }

    /* ── FOOTER NOTE ────────────────────────────────────────── */
    .page-footnote {
      text-align: center;
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 8px;
      padding: 0 16px;
    }

    @media (max-width: 700px) {
      .plans-grid { grid-template-columns: 1fr; }
      .brand-leao { width: 60px; height: 60px; }
    }
  </style>
</head>
<body>

<div class="page-header">
  <div class="brand-row">
    <img src="logo.png" alt="LDFP" class="brand-logo" onerror="this.style.display='none'">
    <img src="leao-cruz.jpg" alt="Leão e Cruz" class="brand-leao" onerror="this.style.display='none'">
  </div>
  <div class="page-badge">
    <i class="fa-solid fa-church"></i>
    Planos pensados para a realidade da igreja local
  </div>
  <h1 class="page-title">Escolha o plano ideal para sua igreja</h1>
  <p class="page-subtitle">Do primeiro cadastro até a operação avançada, o LDFP cresce junto com sua igreja.</p>
</div>

<div class="plans-wrap">
  <div class="plans-grid" id="plansGrid">
    <div style="grid-column:1/-1;text-align:center;padding:60px;color:var(--muted)">
      <i class="fa-solid fa-spinner fa-spin fa-2x"></i>
    </div>
  </div>
  <p class="page-footnote">Valores em reais (R$). Cobrança mensal ou anual. Você só será cobrado após concluir o cadastro da igreja.</p>
</div>

<script>
  const plansGrid = document.getElementById('plansGrid');
  const _isUpgradeMode = new URLSearchParams(window.location.search).get('upgrade') === '1';

  function esc(t) {
    return String(t || '').replace(/[&<>"]/g, s => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[s]));
  }

  function fmtPrice(v) {
    return Number(v).toFixed(2).replace('.', ',');
  }

  // Modo upgrade: exibe aviso acima dos cards
  if (_isUpgradeMode) {
    const params = new URLSearchParams(window.location.search);
    const featureNome = params.get('feature_nome') || '';
    const notice = document.createElement('div');
    notice.className = 'upgrade-notice';
    const extra = featureNome ? ` — <strong>${esc(featureNome)}</strong>` : '';
    notice.innerHTML = `<i class="fa-solid fa-lock" style="margin-right:8px;color:#f59e0b"></i>Este recurso${extra} não está disponível no seu plano atual. Faça upgrade para liberar o acesso.`;
    document.querySelector('.plans-wrap').prepend(notice);
  }

  function renderPlanos(planos) {
    if (!Array.isArray(planos) || !planos.length) {
      plansGrid.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;text-align:center;grid-column:1/-1;padding:40px">Nenhum plano disponível no momento.</p>';
      return;
    }

    const destaqueSlug = 'betel';

    // Lista canônica de todos os módulos do sistema — igual ao admin-planos.html
    const ALL_MODULES = [
      { slug:'membros',            nome:'Membros (Lista e Cadastro)',     group:'Secretaria' },
      { slug:'cargos',             nome:'Cargos e Situações',             group:'Secretaria' },
      { slug:'historico-pastoral', nome:'Histórico Pastoral',             group:'Secretaria' },
      { slug:'grupos',             nome:'Grupos e Células',               group:'Secretaria' },
      { slug:'escalas',            nome:'Escalas de Culto',               group:'Secretaria' },
      { slug:'ebd',                nome:'EBD (Alunos, Turmas e Grades)',  group:'Secretaria' },
      { slug:'batismos',           nome:'Batismos',                       group:'Secretaria' },
      { slug:'agenda',             nome:'Agenda',                         group:'Secretaria' },
      { slug:'outras-igrejas',     nome:'Outras Igrejas',                 group:'Secretaria' },
      { slug:'missionarios',       nome:'Missionários',                   group:'Secretaria' },
      { slug:'visitantes',         nome:'Visitantes e Acompanhamento',    group:'Secretaria' },
      { slug:'criancas',           nome:'Crianças',                       group:'Secretaria' },
      { slug:'oracoes',            nome:'Orações e Pedidos',              group:'Secretaria' },
      { slug:'novidades',          nome:'Novidades / Comunicados',        group:'Secretaria' },
      { slug:'whatsapp',           nome:'Comunicação WhatsApp',           group:'Secretaria' },
      { slug:'autocadastro',       nome:'Aprovação de Cadastro Online',   group:'Secretaria' },
      { slug:'portaria-qr',        nome:'Portaria / Check-in QR',         group:'Secretaria' },
      { slug:'telao',              nome:'Telão de Visitantes',            group:'Secretaria' },
      { slug:'estudo-biblico',     nome:'Bíblia, Devocionais e Planos',   group:'Ensino' },
      { slug:'dizimos',            nome:'Dízimos & Ofertas',              group:'Tesouraria' },
      { slug:'caixa',              nome:'Caixa',                          group:'Tesouraria' },
      { slug:'bancos',             nome:'Bancos',                         group:'Tesouraria' },
      { slug:'pagamentos',         nome:'Links de Pagamento',             group:'Tesouraria' },
      { slug:'contas-pagar',       nome:'Contas a Pagar',                 group:'Tesouraria' },
      { slug:'recibos',            nome:'Recibos',                        group:'Tesouraria' },
      { slug:'transferencias',     nome:'Transferências',                 group:'Tesouraria' },
      { slug:'contabilidade',      nome:'Plano de Contas e Lançamentos',  group:'Contabilidade' },
      { slug:'graficos',           nome:'Gráficos',                       group:'Contabilidade' },
      { slug:'relatorios',         nome:'Relatórios',                     group:'Contabilidade' },
      { slug:'app-membro',         nome:'App do Membro',                  group:'App' },
    ];

    plansGrid.innerHTML = planos.map(p => {
      const isFeatured = p.slug === destaqueSlug;
      const planModuleSlugs = new Set((Array.isArray(p.modules) ? p.modules : []).map(m => m.slug));

      let featuresFixas = [];
      try { featuresFixas = JSON.parse(p.features_json || '[]'); } catch (_) {}

      // Benefícios fixos (limites, suporte, etc.)
      const fixasHtml = featuresFixas.length ? `
        <div class="features-section-label">Incluído neste plano</div>
        ${featuresFixas.map(f => `
          <div class="feat-row">
            <span class="feat-icon ok"><i class="fa-solid fa-check"></i></span>
            <span class="feat-text">${esc(f)}</span>
          </div>
        `).join('')}
      ` : '';

      // Módulos agrupados com ✓/✗ — todos os 30 módulos do sistema
      const groupOrder = ['Secretaria','Ensino','Tesouraria','Contabilidade','App'];
      const grouped = {};
      ALL_MODULES.forEach(m => { (grouped[m.group] = grouped[m.group] || []).push(m); });

      let modulosHtml = '';
      groupOrder.forEach(groupName => {
        const items = grouped[groupName];
        if (!items || !items.length) return;
        modulosHtml += `<div class="features-section-label">${groupName}</div>`;
        items.forEach(m => {
          const ok = planModuleSlugs.has(m.slug);
          modulosHtml += `
            <div class="feat-row">
              <span class="feat-icon ${ok ? 'ok' : 'no'}">
                <i class="fa-solid ${ok ? 'fa-check' : 'fa-xmark'}"></i>
              </span>
              <span class="feat-text ${ok ? '' : 'no'}">${esc(m.nome)}</span>
            </div>`;
        });
      });

      const ctaLabel = _isUpgradeMode ? `Fazer upgrade para ${esc(p.nome)}` : `Começar com ${esc(p.nome)}`;

      return `
      <article class="plan-card ${isFeatured ? 'featured' : ''}">
        <div class="plan-card-top">
          ${isFeatured ? '<div class="plan-popular-badge"><i class="fa-solid fa-star"></i> Mais escolhido</div>' : ''}
          <div class="plan-name">${esc(p.nome)}</div>
          <div class="plan-subtitle">${esc(p.subtitulo || '')}</div>
          <div class="plan-price-block">
            <span class="plan-price-currency">R$</span>
            <span class="plan-price-value">${fmtPrice(p.preco_mensal).replace(',00', '').split(',')[0]}<span style="font-size:1.1rem;font-weight:600;color:var(--muted-soft)">,${fmtPrice(p.preco_mensal).split(',')[1]}</span></span>
            <span class="plan-price-period">/mês</span>
          </div>
          <div class="plan-price-annual">ou R$ ${fmtPrice(p.preco_anual)} /ano</div>
        </div>

        <div class="plan-features">
          ${fixasHtml}
          ${modulosHtml}
        </div>

        <div class="plan-cta-wrap">
          <button class="plan-cta primary" onclick="assinarPlano('${esc(p.slug)}')">
            ${ctaLabel} <i class="fa-solid fa-arrow-right"></i>
          </button>
          <p class="plan-cta-note">7 dias grátis para testar</p>
        </div>
      </article>`;
    }).join('');
  }

  async function carregarPlanos() {
    try {
      const resp = await fetch('/api/planos', { headers: { Accept: 'application/json' } });
      if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
      const data = await resp.json();
      renderPlanos(Array.isArray(data) ? data : []);
    } catch (_) {
      plansGrid.innerHTML = '<p style="color:var(--muted);text-align:center;grid-column:1/-1;padding:40px">Não foi possível carregar os planos. Tente novamente em instantes.</p>';
    }
  }

  function assinarPlano(slug) {
    if (_isUpgradeMode) {
      window.location.href = `assinar.html?plano=${encodeURIComponent(slug)}&upgrade=1`;
    } else {
      window.location.href = `cadastro_igreja.html?plano=${encodeURIComponent(slug)}`;
    }
  }

  carregarPlanos();
</script>
</body>
</html>
