<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Editar Plano</title>
    <link rel="stylesheet" href="app.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --brand: #0f766e;
            --teal: #0d9488;
            --blue: #0284c7;
            --green: #16a34a;
            --red: #dc2626;
            --yellow: #f59e0b;
            --surface: #ffffff;
            --bg: #f1f5f9;
            --border: #e2e8f0;
            --text: #0f172a;
            --muted: #64748b;
            --radius: 14px;
            --shadow: 0 4px 16px rgba(15,23,42,.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        .enterprise-page-shell { padding: 16px; }

        .main-content {
            padding: 20px;
            max-width: 900px;
            margin: 20px auto;
            background: var(--surface);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
        }

        .top-header {
            background: var(--surface);
            padding: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 20px;
            border-radius: var(--radius) var(--radius) 0 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            flex-wrap: wrap;
        }

        .top-header h1 {
            font-size: 1.5rem;
            color: var(--text);
            margin: 0;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .top-header .back-button {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: background-color 0.2s;
        }

        .top-header .back-button:hover { background-color: var(--border); }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group { margin-bottom: 10px; }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 5px;
        }

        .form-group input[type="text"],
        .form-group input[type="number"],
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.9rem;
            color: var(--text);
            background-color: var(--bg);
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--brand);
            background-color: #fff;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 80px;
        }

        .form-group.full-width { grid-column: 1 / -1; }

        .features-list {
            margin-top: 15px;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            background-color: var(--bg);
        }

        .features-list h3 {
            font-size: 1rem;
            color: var(--text);
            margin-bottom: 10px;
        }

        .features-list .feature-item {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .features-list .feature-item input[type="checkbox"] { margin-right: 10px; }

        .features-list .feature-item label {
            font-size: 0.9rem;
            color: var(--text);
            font-weight: normal;
        }

        .btn-submit {
            background-color: var(--brand);
            color: #fff;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn-submit:hover { background-color: #0d635c; }

        .btn-submit:disabled {
            background-color: var(--muted);
            cursor: not-allowed;
        }

        .status-message {
            margin-top: 15px;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.9rem;
            display: none;
        }

        .status-message.error {
            background-color: #fee2e2;
            color: #dc2626;
            border: 1px solid #fca5a5;
        }

        .status-message.success {
            background-color: #dcfce7;
            color: #16a34a;
            border: 1px solid #86efac;
        }
    </style>
</head>
<body class="enterprise-shell-page"
      data-shell-active="planos_editar.html"
      data-shell-title="Editar Plano"
      data-shell-breadcrumb="LDFP / Administração / Editar Plano"
      data-shell-chip="Administração"
      data-shell-role="Master">
    <main class="main-content enterprise-main">
        <div class="enterprise-page-shell">
            <div class="main-content">
                <div class="top-header">
                    <h1><i class="fa-solid fa-file-invoice-dollar"></i> Editar Plano</h1>
                    <a href="planos_lista.html" class="back-button">
                        <i class="fa-solid fa-arrow-left"></i> Voltar para Planos
                    </a>
                </div>

                <form id="formPlano">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="nomePlano">Nome do Plano</label>
                            <input type="text" id="nomePlano" placeholder="Ex: Plano Essencial" required>
                        </div>
                        <div class="form-group">
                            <label for="precoMensal">Preço Mensal (R$)</label>
                            <input type="number" id="precoMensal" step="0.01" min="0" placeholder="Ex: 49.90" required>
                        </div>
                        <div class="form-group full-width">
                            <label for="descricaoPlano">Descrição Curta</label>
                            <textarea id="descricaoPlano" placeholder="Uma breve descrição do plano." rows="2"></textarea>
                        </div>
                        <div class="form-group full-width">
                            <label for="beneficios">Benefícios (um por linha)</label>
                            <textarea id="beneficios" placeholder="Ex:\n- Acesso ao App do Membro\n- Gestão de Dízimos e Ofertas\n- Suporte Básico" rows="5"></textarea>
                        </div>
                    </div>

                    <div class="features-list">
                        <h3>Recursos Disponíveis (Marque os que o plano inclui)</h3>
                        <div class="form-grid">
                            <div class="feature-item">
                                <input type="checkbox" id="featureAppMembro">
                                <label for="featureAppMembro">App do Membro</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureGestaoMembros">
                                <label for="featureGestaoMembros">Gestão de Membros</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureGestaoFinanceira">
                                <label for="featureGestaoFinanceira">Gestão Financeira (Dízimos/Ofertas)</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureAgendaEventos">
                                <label for="featureAgendaEventos">Agenda de Eventos</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureMidia">
                                <label for="featureMidia">Mídia (Vídeos/Fotos)</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureRelatorios">
                                <label for="featureRelatorios">Relatórios Personalizados</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureSuportePrioritario">
                                <label for="featureSuportePrioritario">Suporte Prioritário</label>
                            </div>
                            <div class="feature-item">
                                <input type="checkbox" id="featureMultiCongregacoes">
                                <label for="featureMultiCongregacoes">Múltiplas Congregações</label>
                            </div>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit" id="btnSalvarPlano">
                        <i class="fa-solid fa-save"></i> Salvar Plano
                    </button>
                    <div id="statusMessage" class="status-message"></div>
                </form>
            </div>
        </div>
    </main>

    <script src="session.js?v=20260501"></script>
    <script src="enterprise-shell.js?v=20260501"></script>
    <script>
        requireAuthSession();

        const $ = (id) => document.getElementById(id);

        $('formPlano').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = $('btnSalvarPlano');
            const statusMessage = $('statusMessage');

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Salvando...';
            statusMessage.style.display = 'none';

            const features = [];
            document.querySelectorAll('.features-list input[type="checkbox"]:checked').forEach((checkbox) => {
                features.push(checkbox.id.replace('feature', ''));
            });

            const planoData = {
                id: new URLSearchParams(window.location.search).get('id') || `plano_${Date.now()}`,
                nome: $('nomePlano').value.trim(),
                precoMensal: parseFloat($('precoMensal').value),
                descricao: $('descricaoPlano').value.trim(),
                beneficios: $('beneficios').value.split('\n').map((b) => b.trim()).filter((b) => b),
                recursos: features
            };

            try {
                if (!planoData.nome || Number.isNaN(planoData.precoMensal)) {
                    throw new Error('Preencha os campos obrigatórios do plano.');
                }

                await new Promise((resolve) => setTimeout(resolve, 700));

                const planos = JSON.parse(localStorage.getItem('ldfp_planos')) || [];
                const index = planos.findIndex((p) => p.id === planoData.id);

                if (index > -1) {
                    planos[index] = planoData;
                } else {
                    planos.push(planoData);
                }

                localStorage.setItem('ldfp_planos', JSON.stringify(planos));

                statusMessage.textContent = 'Plano salvo com sucesso! Redirecionando...';
                statusMessage.className = 'status-message success';
                statusMessage.style.display = 'block';

                setTimeout(() => {
                    window.location.href = 'planos_lista.html';
                }, 900);
            } catch (error) {
                statusMessage.textContent = error.message || 'Erro inesperado ao salvar.';
                statusMessage.className = 'status-message error';
                statusMessage.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-save"></i> Salvar Plano';
            }
        });

        function loadPlanoData() {
            const planoId = new URLSearchParams(window.location.search).get('id');
            if (!planoId) return;

            const planos = JSON.parse(localStorage.getItem('ldfp_planos')) || [];
            const plano = planos.find((p) => p.id === planoId);

            if (!plano) return;

            $('nomePlano').value = plano.nome || '';
            $('precoMensal').value = plano.precoMensal ?? '';
            $('descricaoPlano').value = plano.descricao || '';
            $('beneficios').value = Array.isArray(plano.beneficios) ? plano.beneficios.join('\n') : '';

            (plano.recursos || []).forEach((feature) => {
                const checkbox = $(`feature${feature}`);
                if (checkbox) checkbox.checked = true;
            });
        }

        loadPlanoData();
    </script>
</body>
</html>
