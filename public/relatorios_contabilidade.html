<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Relatórios Contábeis</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="relatorios.css?v=20261111b">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="relatorios_contabilidade.html" data-shell-title="Relatórios Contábeis" data-shell-breadcrumb="LDFP / Relatórios / Contabilidade" data-shell-chip="Relatórios" data-shell-role="Contabilidade">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Relatórios Contábeis</h2>
                <p>Livro Diário, Razão, Balancete, Balanço Patrimonial, DRE, Fluxo de Caixa e DMPL, a partir dos lançamentos contábeis.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-solid fa-scale-balanced"></i> Contabilidade</div>
        </div>

        <div id="diagnostico"></div>

        <section class="rl-card">
            <div class="rl-tipos" id="tipos"></div>
            <div class="rl-filtros">
                <label data-f="periodo">De <input type="date" id="inicio"></label>
                <label data-f="periodo">Até <input type="date" id="fim"></label>
                <label data-f="data">Posição em <input type="date" id="data"></label>
                <label data-f="ano">Ano <select id="ano"></select></label>
                <label data-f="conta">Conta <select id="conta"><option value="">Todas as contas com movimento</option></select></label>
                <label data-f="fonte">Base
                    <select id="fonte">
                        <option value="contabil">Lançamentos contábeis</option>
                        <option value="tesouraria">Tesouraria (caixa + bancos)</option>
                    </select>
                </label>
                <label data-f="zeradas" style="flex-direction:row;align-items:center;gap:6px;padding-bottom:10px;"><input type="checkbox" id="zeradas" style="min-width:0"> Mostrar contas zeradas</label>
                <button class="rl-btn" id="btnGerar" type="button"><i class="fa-solid fa-magnifying-glass"></i> Gerar</button>
                <div class="rl-acoes">
                    <button class="rl-btn ghost" id="btnCSV" type="button"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="rl-btn ghost" id="btnImprimir" type="button"><i class="fa-solid fa-print"></i> Imprimir / PDF</button>
                </div>
            </div>
            <p class="rl-status" id="status"></p>
        </section>

        <div class="rl-kpis" id="kpis"></div>

        <section class="rl-card">
            <h3 id="titulo"></h3>
            <div id="aviso"></div>
            <div id="saida"></div>
            <p class="rl-nota" id="nota"></p>
        </section>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script src="relatorios-core.js?v=20261111b"></script>
<script>
requireAuthSession();
(function () {
    const $ = (id) => document.getElementById(id);
    const v = (id) => $(id).value;
    const esc = RL.esc;
    const kpis = (lista) => { $('kpis').innerHTML = lista.map(([a, b, cls]) => `<div class="rl-kpi ${cls || ''}"><small>${a}</small><strong>${b}</strong></div>`).join(''); };
    const aviso = (html, cls) => { $('aviso').innerHTML = html ? `<div class="rl-alerta ${cls || ''}">${html}</div>` : ''; };

    // valor com indicação D (devedor) / C (credor)
    const dc = (val) => { const n = Number(val) || 0; return n === 0 ? RL.moeda(0) : `${RL.moeda(Math.abs(n))} ${n > 0 ? 'D' : 'C'}`; };
    const dcCsv = (val) => { const n = Number(val) || 0; return `${Math.abs(n).toFixed(2).replace('.', ',')}${n > 0 ? ' D' : n < 0 ? ' C' : ''}`; };
    const contaCol = {
        key: 'nome', label: 'Conta',
        fmt: (r) => r.__rotulo !== undefined ? esc(r.__rotulo)
            : `<span style="padding-left:${(r.nivel || 0) * 16}px;${r.sintetica ? 'font-weight:700' : ''}">${esc(r.codigo ? r.codigo + ' - ' : '')}${esc(r.nome)}${r.naoCadastrada ? ' <span class="rl-badge vencido" title="Conta digitada no lançamento que não existe no plano de contas">fora do plano</span>' : ''}</span>`,
        csv: (r) => r.__rotulo !== undefined ? r.__rotulo : `${'  '.repeat(r.nivel || 0)}${r.codigo ? r.codigo + ' - ' : ''}${r.nome}`
    };
    const valorCol = (label, idx) => ({ key: (r) => (r.valores ? r.valores[idx] : r.__valor), label, fmt: 'moeda' });
    const sub = (rotulo, valor, classe) => ({ __rotulo: rotulo, __valor: valor, valores: null, __classe: classe || 'subtotal' });

    const RELATORIOS = {
        diario: {
            titulo: 'Livro Diário', grupo: 'Livros', filtros: ['periodo'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/diario', { inicio: v('inicio'), fim: v('fim') });
                kpis([['Lançamentos', RL.numero(r.rows.length)], ['Total movimentado', RL.moeda(r.total)]]);
                return {
                    cols: [{ key: 'n', label: 'Nº', num: true }, { key: 'data', label: 'Data', fmt: 'data' }, { key: 'historico', label: 'Histórico' },
                        { key: 'debito', label: 'Débito' }, { key: 'credito', label: 'Crédito' }, { key: 'valor', label: 'Valor', fmt: 'moeda' }],
                    rows: r.rows, footer: { valor: r.total }, resumo: `${r.rows.length} lançamento(s)`
                };
            }
        },
        razao: {
            titulo: 'Livro Razão', grupo: 'Livros', filtros: ['periodo', 'conta'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/razao', { inicio: v('inicio'), fim: v('fim'), conta: v('conta') });
                const rows = [];
                r.contas.forEach((c) => {
                    rows.push({ __grupo: `${c.conta}${c.naoCadastrada ? '  (fora do plano)' : ''}` });
                    rows.push({ data: '', historico: 'Saldo anterior', contrapartida: '', debito: null, credito: null, saldo: c.saldoAnterior, __classe: 'subtotal' });
                    c.movimentos.forEach((m) => rows.push(m));
                    rows.push({ data: '', historico: 'Totais / saldo final', contrapartida: '', debito: c.debitos, credito: c.creditos, saldo: c.saldoFinal, __classe: 'subtotal' });
                });
                kpis([['Contas', RL.numero(r.contas.length)], ['Movimentos', RL.numero(r.contas.reduce((s, c) => s + c.movimentos.length, 0))]]);
                return {
                    cols: [{ key: 'data', label: 'Data', fmt: 'data' }, { key: 'historico', label: 'Histórico' }, { key: 'contrapartida', label: 'Contrapartida' },
                        { key: 'debito', label: 'Débito', num: true, fmt: (x) => (x.debito === null ? '' : RL.moeda(x.debito)), csv: (x) => (x.debito === null ? '' : x.debito.toFixed(2).replace('.', ',')) },
                        { key: 'credito', label: 'Crédito', num: true, fmt: (x) => (x.credito === null ? '' : RL.moeda(x.credito)), csv: (x) => (x.credito === null ? '' : x.credito.toFixed(2).replace('.', ',')) },
                        { key: 'saldo', label: 'Saldo', num: true, fmt: (x) => dc(x.saldo), csv: (x) => dcCsv(x.saldo) }],
                    rows, resumo: `${r.contas.length} conta(s)`
                };
            },
            nota: 'Saldo: D = devedor, C = credor. O saldo anterior inclui o balancete de abertura.'
        },
        balancete: {
            titulo: 'Balancete de Verificação', grupo: 'Demonstrações', filtros: ['periodo', 'zeradas'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/balancete', { inicio: v('inicio'), fim: v('fim'), zeradas: $('zeradas').checked ? 'true' : '' });
                const t = r.totais;
                kpis([['Débitos no período', RL.moeda(t.debitos)], ['Créditos no período', RL.moeda(t.creditos)], ['Situação', r.fechado ? 'Fechado ✔' : 'Não fecha', r.fechado ? 'pos' : 'neg']]);
                if (!r.fechado) aviso('<strong>O balancete não fecha.</strong> Normalmente isso acontece porque o balancete de abertura tem débitos diferentes dos créditos. Confira em <a href="balancete_abertura.html">Balancete de Abertura</a>.', 'erro');
                return {
                    cols: [contaCol,
                        { key: (x) => x.valores[0], label: 'Saldo anterior', num: true, fmt: (x) => dc(x.valores[0]), csv: (x) => dcCsv(x.valores[0]) },
                        { key: (x) => x.valores[1], label: 'Débitos', fmt: 'moeda' },
                        { key: (x) => x.valores[2], label: 'Créditos', fmt: 'moeda' },
                        { key: (x) => x.valores[3], label: 'Saldo atual', num: true, fmt: (x) => dc(x.valores[3]), csv: (x) => dcCsv(x.valores[3]) }],
                    rows: r.linhas,
                    footer: { nome: 'Total', __1: dc(t.saldoAnterior), __2: RL.moeda(t.debitos), __3: RL.moeda(t.creditos), __4: dc(t.saldoAtual) },
                    resumo: `${r.linhas.length} conta(s)`
                };
            },
            nota: 'Contas-mãe (em negrito) somam as contas filhas pelo código. Em um balancete correto, débitos = créditos e o saldo total é zero.'
        },
        balanco: {
            titulo: 'Balanço Patrimonial', grupo: 'Demonstrações', filtros: ['data'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/balanco', { data: v('data') });
                const val = valorCol('Valor', 0);
                const rows = [
                    { __grupo: 'ATIVO' }, ...r.ativo.linhas, sub('Total do Ativo', r.ativo.total, 'total'),
                    { __grupo: 'PASSIVO' }, ...r.passivo.linhas, sub('Total do Passivo', r.passivo.total),
                    { __grupo: 'PATRIMÔNIO SOCIAL' }, ...r.patrimonio.linhas,
                    sub('Superávits/déficits de exercícios anteriores', r.patrimonio.resultadosAnteriores, ''),
                    sub(`Superávit/déficit do exercício ${r.data.slice(0, 4)}`, r.patrimonio.resultadoExercicio, ''),
                    sub('Total do Patrimônio Social', r.patrimonio.total),
                    sub('Total do Passivo + Patrimônio Social', r.totalPassivoPL, 'total')
                ];
                kpis([['Ativo', RL.moeda(r.ativo.total)], ['Passivo', RL.moeda(r.passivo.total)], ['Patrimônio social', RL.moeda(r.patrimonio.total)],
                    ['Diferença', RL.moeda(r.diferenca), Math.abs(r.diferenca) < 0.005 ? 'pos' : 'neg']]);
                if (Math.abs(r.diferenca) >= 0.005) aviso(`<strong>Ativo ≠ Passivo + Patrimônio (diferença de ${RL.moeda(r.diferenca)}).</strong> Causas comuns: contas usadas nos lançamentos que não estão no plano de contas (sem natureza definida) ou balancete de abertura desequilibrado. Veja o aviso no topo da página.`, 'erro');
                return { cols: [contaCol, val], rows, resumo: `Posição em ${RL.data(r.data)}` };
            },
            nota: 'Contas de natureza "passivo" cujo nome (ou da conta-mãe) contém "Patrimônio", "Superávit", "Déficit" ou "Reserva" são tratadas como Patrimônio Social.'
        },
        dre: {
            titulo: 'DRE — Demonstração do Resultado', grupo: 'Demonstrações', filtros: ['periodo'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/dre', { inicio: v('inicio'), fim: v('fim') });
                const rows = [
                    { __grupo: 'RECEITAS' }, ...r.receitas.linhas, sub('Total das Receitas', r.receitas.total),
                    { __grupo: 'DESPESAS' }, ...r.despesas.linhas, sub('Total das Despesas', r.despesas.total),
                    sub(r.resultado >= 0 ? 'SUPERÁVIT DO PERÍODO' : 'DÉFICIT DO PERÍODO', r.resultado, 'total')
                ];
                kpis([['Receitas', RL.moeda(r.receitas.total), 'pos'], ['Despesas', RL.moeda(r.despesas.total), 'neg'], [r.resultado >= 0 ? 'Superávit' : 'Déficit', RL.moeda(r.resultado), r.resultado >= 0 ? 'pos' : 'neg']]);
                return { cols: [contaCol, valorCol('Valor', 0)], rows, resumo: `Período ${RL.data(v('inicio'))} a ${RL.data(v('fim'))}` };
            }
        },
        resumoAnual: {
            titulo: 'Resumo financeiro anual (DRE mês a mês)', grupo: 'Demonstrações', filtros: ['ano'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/dre-mensal', { ano: v('ano') });
                const linhaTot = (rotulo, vet, classe) => ({ __rotulo: rotulo, valores: vet, __classe: classe || 'subtotal' });
                const rows = [
                    { __grupo: 'RECEITAS' }, ...r.receitas.linhas, linhaTot('Total das Receitas', r.receitas.total),
                    { __grupo: 'DESPESAS' }, ...r.despesas.linhas, linhaTot('Total das Despesas', r.despesas.total),
                    linhaTot('Superávit / Déficit', r.resultado, 'total')
                ];
                const t = r.resultado[12];
                kpis([['Receitas no ano', RL.moeda(r.receitas.total[12]), 'pos'], ['Despesas no ano', RL.moeda(r.despesas.total[12]), 'neg'], ['Resultado', RL.moeda(t), t >= 0 ? 'pos' : 'neg']]);
                return {
                    cols: [contaCol, ...RL.MESES.map((m, i) => ({ key: (x) => x.valores[i], label: m, num: true, fmt: (x) => (x.valores[i] ? RL.moeda(x.valores[i]) : '—'), csv: (x) => x.valores[i].toFixed(2).replace('.', ',') })),
                        { key: (x) => x.valores[12], label: 'Total', fmt: 'moeda' }],
                    rows, resumo: `Ano ${r.ano}`
                };
            }
        },
        fluxo: {
            titulo: 'Fluxo de Caixa', grupo: 'Demonstrações', filtros: ['periodo', 'fonte'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/fluxo-caixa', { inicio: v('inicio'), fim: v('fim'), fonte: v('fonte') });
                if (r.fonte === 'tesouraria') {
                    kpis([['Saldo inicial', RL.moeda(r.saldoInicial)], ['Entradas', RL.moeda(r.entradas), 'pos'], ['Saídas', RL.moeda(r.saidas), 'neg'], ['Saldo final', RL.moeda(r.saldoFinal), r.saldoFinal >= 0 ? 'pos' : 'neg']]);
                    return {
                        cols: [{ key: (x) => `${RL.MESES_LONGOS[Number(x.mes.slice(5, 7)) - 1]}/${x.mes.slice(0, 4)}`, label: 'Mês', csv: (x) => x.mes },
                            { key: 'saldoInicial', label: 'Saldo inicial', fmt: 'moeda' }, { key: 'entradas', label: 'Entradas', fmt: 'moeda' },
                            { key: 'saidas', label: 'Saídas', fmt: 'moeda' }, { key: 'liquido', label: 'Variação', fmt: 'moeda' }, { key: 'saldoFinal', label: 'Saldo final', fmt: 'moeda' }],
                        rows: r.linhas, footer: { entradas: r.entradas, saidas: r.saidas, liquido: r.entradas - r.saidas, saldoFinal: r.saldoFinal },
                        resumo: 'Base: lançamentos do caixa e das contas bancárias'
                    };
                }
                const nomes = { operacional: 'Atividades operacionais', investimento: 'Atividades de investimento', financiamento: 'Atividades de financiamento' };
                const rows = [sub('Saldo inicial de caixa e equivalentes', r.saldoInicial)];
                r.secoes.forEach((s) => {
                    rows.push({ __grupo: nomes[s.nome] });
                    s.linhas.forEach((l) => rows.push({ __rotulo: l.conta, __valor: l.liquido, entradas: l.entradas, saidas: l.saidas }));
                    rows.push({ ...sub(`Caixa líquido — ${nomes[s.nome].toLowerCase()}`, s.liquido), entradas: s.entradas, saidas: s.saidas });
                });
                rows.push(sub('Variação líquida do caixa', r.variacao));
                rows.push(sub('Saldo final de caixa e equivalentes', r.saldoFinal, 'total'));
                kpis([['Saldo inicial', RL.moeda(r.saldoInicial)], ['Variação', RL.moeda(r.variacao), r.variacao >= 0 ? 'pos' : 'neg'], ['Saldo final', RL.moeda(r.saldoFinal)]]);
                if (!r.contasCaixa.length) aviso('Nenhuma conta de caixa/banco foi identificada no plano de contas. O sistema reconhece como disponível as contas de ativo com código iniciando em 1.1.1 ou com "Caixa", "Banco", "Disponível" ou "Aplicação financeira" no nome. Você também pode usar a base <strong>Tesouraria</strong>.', '');
                else aviso(`Contas de caixa consideradas: ${r.contasCaixa.map(esc).join(', ')}.`, 'ok');
                const opt = (k) => (x) => (x[k] === undefined || x[k] === null ? '' : RL.moeda(x[k]));
                return {
                    cols: [contaCol, { key: 'entradas', label: 'Entradas', num: true, fmt: opt('entradas'), csv: (x) => (x.entradas === undefined ? '' : x.entradas.toFixed(2).replace('.', ',')) },
                        { key: 'saidas', label: 'Saídas', num: true, fmt: opt('saidas'), csv: (x) => (x.saidas === undefined ? '' : x.saidas.toFixed(2).replace('.', ',')) },
                        valorCol('Líquido', 0)],
                    rows, resumo: 'Método direto'
                };
            },
            nota: 'Método direto: cada lançamento que movimenta caixa/banco é classificado pela contrapartida (receita/despesa = operacional; ativo fora do circulante = investimento; passivo de longo prazo/patrimônio = financiamento). Transferências entre caixa e banco não entram.'
        },
        dmpl: {
            titulo: 'DMPL — Mutações do Patrimônio Social', grupo: 'Demonstrações', filtros: ['ano'],
            run: async () => {
                const r = await RL.get('/api/relatorios/contabil/dmpl', { ano: v('ano') });
                const t = r.totais;
                kpis([['Patrimônio em 01/01', RL.moeda(t.saldoInicial)], ['Resultado do ano', RL.moeda(t.resultado), t.resultado >= 0 ? 'pos' : 'neg'], ['Patrimônio em 31/12', RL.moeda(t.saldoFinal)]]);
                return {
                    cols: [{ key: 'conta', label: 'Conta' }, { key: 'saldoInicial', label: `Saldo em 01/01/${r.ano}`, fmt: 'moeda' },
                        { key: 'resultado', label: 'Superávit/déficit do exercício', fmt: 'moeda' }, { key: 'outras', label: 'Outras mutações', fmt: 'moeda' },
                        { key: 'saldoFinal', label: `Saldo em 31/12/${r.ano}`, fmt: 'moeda' }],
                    rows: r.linhas, footer: { conta: 'Total do Patrimônio Social', saldoInicial: t.saldoInicial, resultado: t.resultado, outras: t.outras, saldoFinal: t.saldoFinal },
                    resumo: `Ano ${r.ano}`
                };
            }
        }
    };

    function mostrarDiagnostico(d) {
        if (!d) return;
        const partes = [];
        if (!d.lancamentos) {
            partes.push(`<div class="rl-alerta">Ainda não há lançamentos contábeis nesta igreja. Cadastre o <a href="plano_contas.html">plano de contas</a> e registre os <a href="lancamentos_contabeis.html">lançamentos contábeis</a>. Para ver a movimentação financeira sem contabilidade, use os <a href="relatorios_tesouraria.html">Relatórios da Tesouraria</a>.</div>`);
        }
        if (d.naoCadastradas && d.naoCadastradas.length) {
            const lista = d.naoCadastradas.slice(0, 12).map((x) => `<li>${esc(x.nome)} — usada ${x.usos}x${x.naturezaInferida ? ` (tratada como ${esc(x.naturezaInferida)} pelo código)` : ' <strong>(sem natureza: fica fora do Balanço e da DRE)</strong>'}</li>`).join('');
            partes.push(`<div class="rl-alerta"><strong>${d.naoCadastradas.length} conta(s) usada(s) nos lançamentos não existe(m) no plano de contas.</strong> Cadastre-as em <a href="plano_contas.html">Plano de Contas</a> com o mesmo código ou o mesmo nome digitado no lançamento.<ul>${lista}</ul>${d.naoCadastradas.length > 12 ? '<p>…e outras.</p>' : ''}</div>`);
        }
        if (d.aberturaDiferenca) {
            partes.push(`<div class="rl-alerta erro"><strong>Balancete de abertura desequilibrado:</strong> débitos ${RL.moeda(d.aberturaDebito)} × créditos ${RL.moeda(d.aberturaCredito)}. Ajuste em <a href="balancete_abertura.html">Balancete de Abertura</a>.</div>`);
        }
        $('diagnostico').innerHTML = partes.join('');
    }

    let atual = 'balancete';
    let ultimo = null;
    let grupoAnterior = '';
    Object.entries(RELATORIOS).forEach(([k, r]) => {
        if (r.grupo !== grupoAnterior) { $('tipos').insertAdjacentHTML('beforeend', `<div class="rl-grupo-titulo">${r.grupo}</div>`); grupoAnterior = r.grupo; }
        $('tipos').insertAdjacentHTML('beforeend', `<button type="button" class="rl-tipo" data-k="${k}">${esc(r.titulo)}</button>`);
    });
    $('tipos').addEventListener('click', (e) => {
        const b = e.target.closest('.rl-tipo');
        if (!b) return;
        selecionar(b.dataset.k);
        gerar();
    });

    function selecionar(k) {
        atual = k;
        document.querySelectorAll('.rl-tipo').forEach((b) => b.classList.toggle('ativo', b.dataset.k === k));
        const f = RELATORIOS[k].filtros;
        document.querySelectorAll('[data-f]').forEach((el) => { el.style.display = f.includes(el.dataset.f) ? '' : 'none'; });
        $('titulo').textContent = RELATORIOS[k].titulo;
        $('nota').textContent = RELATORIOS[k].nota || '';
        try { localStorage.setItem('ldfpRelCont', k); } catch (_) { /* ignore */ }
    }

    async function gerar() {
        RL.status($('status'), 'Gerando…');
        $('saida').innerHTML = '';
        $('kpis').innerHTML = '';
        aviso('');
        try {
            ultimo = await RELATORIOS[atual].run();
            RL.tabela($('saida'), ultimo.cols, ultimo.rows, { footer: ultimo.footer });
            RL.status($('status'), ultimo.resumo || '');
        } catch (e) {
            ultimo = null;
            RL.status($('status'), e.message, true);
        }
    }

    function subtitulo() {
        const f = RELATORIOS[atual].filtros;
        const p = [];
        if (f.includes('periodo')) p.push(`Período ${RL.data(v('inicio'))} a ${RL.data(v('fim'))}`);
        if (f.includes('data')) p.push(`Posição em ${RL.data(v('data'))}`);
        if (f.includes('ano')) p.push(`Exercício ${v('ano')}`);
        if (f.includes('conta') && v('conta')) p.push($('conta').selectedOptions[0].textContent);
        return p.join(' · ');
    }

    const anoAtual = new Date().getFullYear();
    for (let a = anoAtual + 1; a >= anoAtual - 6; a -= 1) $('ano').insertAdjacentHTML('beforeend', `<option ${a === anoAtual ? 'selected' : ''}>${a}</option>`);
    $('inicio').value = RL.inicioAnoISO();
    $('fim').value = RL.hojeISO();
    $('data').value = RL.hojeISO();
    $('btnGerar').addEventListener('click', gerar);
    $('btnCSV').addEventListener('click', () => {
        if (!ultimo || !ultimo.rows.length) { RL.status($('status'), 'Gere o relatório antes de exportar.', true); return; }
        RL.exportarCSV(`${RELATORIOS[atual].titulo} ${RL.hojeISO()}`, ultimo.cols, ultimo.rows);
    });
    $('btnImprimir').addEventListener('click', () => RL.imprimir(RELATORIOS[atual].titulo, subtitulo()));

    RL.get('/api/relatorios/contabil/contas').then((r) => {
        r.contas.filter((c) => c.comMovimento).forEach((c) => $('conta').insertAdjacentHTML('beforeend', `<option value="${esc(c.key)}">${esc(c.rotulo)}</option>`));
        mostrarDiagnostico(r.diagnostico);
    }).catch(() => { /* sem acesso / sem dados */ });

    let inicial = 'balancete';
    try { const s = localStorage.getItem('ldfpRelCont'); if (s && RELATORIOS[s]) inicial = s; } catch (_) { /* ignore */ }
    selecionar(inicial);
    gerar();
})();
</script>
</body>
</html>
