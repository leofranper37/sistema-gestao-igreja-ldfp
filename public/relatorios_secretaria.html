<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Relatórios Secretaria</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="relatorios.css?v=20261111">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="theme-petroleo enterprise-shell-page" data-shell-active="relatorios_secretaria.html" data-shell-title="Relatórios Secretaria" data-shell-breadcrumb="LDFP / Relatórios / Secretaria" data-shell-chip="Relatórios" data-shell-role="Secretaria">
<main class="main-content enterprise-main">
    <div class="enterprise-page-shell">
        <div class="enterprise-page-hero">
            <div>
                <h2>Relatórios da Secretaria</h2>
                <p>Listas de pessoas, aniversariantes, batizados e grupos, prontas para imprimir ou abrir no Excel.</p>
            </div>
            <div class="enterprise-page-badge"><i class="fa-regular fa-file-lines"></i> Secretaria</div>
        </div>

        <section class="rl-card">
            <div class="rl-tipos" id="tipos"></div>
            <div class="rl-filtros">
                <label data-f="periodo">Cadastro de <input type="date" id="inicio"></label>
                <label data-f="periodo">até <input type="date" id="fim"></label>
                <label data-f="mes">Mês
                    <select id="mes"></select>
                </label>
                <label data-f="publico">Público
                    <select id="publico">
                        <option value="todos">Todos</option>
                        <option value="membros">Membros</option>
                        <option value="visitantes">Visitantes</option>
                        <option value="congregados">Congregados</option>
                        <option value="criancas">Crianças</option>
                    </select>
                </label>
                <label data-f="situacao">Situação
                    <select id="situacao">
                        <option value="">Todas</option>
                        <option>Ativo</option>
                        <option>Inativo</option>
                        <option>Transferido</option>
                        <option>Falecido</option>
                    </select>
                </label>
                <label data-f="sexo">Sexo
                    <select id="sexo">
                        <option value="">Todos</option>
                        <option>Masculino</option>
                        <option>Feminino</option>
                    </select>
                </label>
                <label data-f="detalhe">Exibir
                    <select id="detalhe">
                        <option value="resumo">Resumo por grupo</option>
                        <option value="participantes">Participantes de cada grupo</option>
                        <option value="faixa">Composição por faixa etária</option>
                    </select>
                </label>
                <button class="rl-btn" id="btnGerar" type="button"><i class="fa-solid fa-magnifying-glass"></i> Gerar</button>
                <div class="rl-acoes">
                    <button class="rl-btn ghost" id="btnCSV" type="button"><i class="fa-solid fa-file-excel"></i> Excel</button>
                    <button class="rl-btn ghost" id="btnImprimir" type="button"><i class="fa-solid fa-print"></i> Imprimir / PDF</button>
                </div>
            </div>
            <p class="rl-status" id="status"></p>
        </section>

        <section class="rl-card">
            <h3 id="titulo"></h3>
            <div id="saida"></div>
        </section>
    </div>
</main>

<script src="session.js?v=20260501"></script>
<script src="enterprise-shell.js?v=20260501"></script>
<script src="relatorios-core.js?v=20261111"></script>
<script>
requireAuthSession();
(function () {
    const $ = (id) => document.getElementById(id);
    const v = (id) => $(id).value;
    const idadeCol = { key: 'idade', label: 'Idade', num: true, fmt: (r) => (r.idade === null || r.idade === undefined ? '' : r.idade) };

    const pessoasCols = {
        membros: [
            { key: 'nome', label: 'Nome' }, { key: 'sexo', label: 'Sexo' }, { key: 'nascimento', label: 'Nascimento', fmt: 'data' }, idadeCol,
            { key: 'estadoCivil', label: 'Estado civil' }, { key: 'cargo', label: 'Cargo' }, { key: 'situacao', label: 'Situação' },
            { key: 'telefone', label: 'Telefone' }, { key: 'bairro', label: 'Bairro' }, { key: 'cadastro', label: 'Cadastro', fmt: 'data' }
        ],
        visitantes: [
            { key: 'nome', label: 'Nome' }, { key: 'sexo', label: 'Sexo' }, idadeCol, { key: 'telefone', label: 'Telefone' },
            { key: 'email', label: 'E-mail' }, { key: 'bairro', label: 'Bairro' }, { key: 'cidade', label: 'Cidade' }, { key: 'cadastro', label: 'Visita', fmt: 'data' }
        ],
        congregados: [
            { key: 'nome', label: 'Nome' }, { key: 'sexo', label: 'Sexo' }, { key: 'nascimento', label: 'Nascimento', fmt: 'data' }, idadeCol,
            { key: 'estadoCivil', label: 'Estado civil' }, { key: 'telefone', label: 'Telefone' }, { key: 'bairro', label: 'Bairro' }, { key: 'cadastro', label: 'Cadastro', fmt: 'data' }
        ],
        criancas: [
            { key: 'nome', label: 'Nome' }, { key: 'sexo', label: 'Sexo' }, { key: 'nascimento', label: 'Nascimento', fmt: 'data' }, idadeCol,
            { key: 'responsaveis', label: 'Pais / responsáveis' }, { key: 'apresentacao', label: 'Apresentação', fmt: 'data' },
            { key: 'telefone', label: 'Telefone' }, { key: 'situacao', label: 'Situação' }
        ]
    };

    const listaPessoas = (tipo, titulo) => ({
        titulo, grupo: 'Pessoas', filtros: tipo === 'membros' ? ['periodo', 'situacao', 'sexo'] : ['periodo', 'sexo'],
        async run() {
            const rows = await RL.get('/api/relatorios/secretaria/lista', { tipo, inicio: v('inicio'), fim: v('fim'), situacao: tipo === 'membros' ? v('situacao') : '', sexo: v('sexo') });
            return { cols: pessoasCols[tipo], rows, resumo: `${RL.numero(rows.length)} registro(s)` };
        }
    });

    const RELATORIOS = {
        membros: listaPessoas('membros', 'Lista de membros'),
        visitantes: listaPessoas('visitantes', 'Lista de visitantes'),
        congregados: listaPessoas('congregados', 'Lista de congregados'),
        criancas: listaPessoas('criancas', 'Lista de crianças'),
        aniversariantes: {
            titulo: 'Aniversariantes do mês', grupo: 'Datas', filtros: ['mes', 'publico'],
            async run() {
                const rows = await RL.get('/api/relatorios/secretaria/aniversariantes', { mes: v('mes'), tipo: v('publico') });
                return {
                    cols: [
                        { key: 'dia', label: 'Dia', num: true }, { key: 'nome', label: 'Nome' }, { key: 'tipo', label: 'Tipo' },
                        { key: 'nascimento', label: 'Nascimento', fmt: 'data' },
                        { key: 'completa', label: 'Completa', num: true, fmt: (r) => (r.completa ? `${r.completa} anos` : '') },
                        { key: 'telefone', label: 'Telefone' }
                    ],
                    rows, resumo: `${RL.numero(rows.length)} aniversariante(s) em ${RL.MESES_LONGOS[v('mes') - 1]}`
                };
            }
        },
        batizados: {
            titulo: 'Batizados no período', grupo: 'Datas', filtros: ['periodo'],
            async run() {
                const rows = await RL.get('/api/relatorios/secretaria/batizados', { inicio: v('inicio'), fim: v('fim') });
                return {
                    cols: [
                        { key: 'data', label: 'Data', fmt: 'data' }, { key: 'cerimonia', label: 'Cerimônia' }, { key: 'nome', label: 'Nome' },
                        { key: 'status', label: 'Status' }, { key: 'telefone', label: 'Telefone' }, { key: 'local', label: 'Local' }, { key: 'pastor', label: 'Pastor' }
                    ],
                    rows, resumo: `${RL.numero(rows.filter((r) => r.status === 'Confirmado').length)} batizado(s) confirmado(s)`
                };
            }
        },
        grupos: {
            titulo: 'Grupos', grupo: 'Grupos', filtros: ['periodo', 'detalhe'],
            async run() {
                const r = await RL.get('/api/relatorios/secretaria/grupos', { inicio: v('inicio'), fim: v('fim') });
                const det = v('detalhe');
                if (det === 'participantes') {
                    const rows = [];
                    r.grupos.forEach((g) => {
                        rows.push({ __grupo: `${g.nome} — ${g.participantes} participante(s)${g.lider ? ' · Líder: ' + g.lider : ''}` });
                        g.membros.forEach((m) => rows.push({ grupo: g.nome, ...m }));
                    });
                    return {
                        cols: [{ key: 'grupo', label: 'Grupo' }, { key: 'nome', label: 'Participante' }, { key: 'funcao', label: 'Função' }, idadeCol,
                            { key: 'telefone', label: 'Telefone' }, { key: 'desde', label: 'Desde', fmt: 'data' }],
                        rows, resumo: `${r.grupos.length} grupo(s)`
                    };
                }
                if (det === 'faixa') {
                    const faixas = r.faixasOrdem;
                    const rows = r.grupos.map((g) => { const o = { nome: g.nome, total: g.participantes }; faixas.forEach((f) => { o[f] = g.faixas[f] || 0; }); return o; });
                    const footer = { total: rows.reduce((s, x) => s + x.total, 0) };
                    faixas.forEach((f) => { footer[f] = rows.reduce((s, x) => s + x[f], 0); });
                    return {
                        cols: [{ key: 'nome', label: 'Grupo' }, ...faixas.map((f) => ({ key: f, label: f, fmt: 'numero' })), { key: 'total', label: 'Total', fmt: 'numero' }],
                        rows, footer, resumo: `${r.grupos.length} grupo(s)`
                    };
                }
                const rows = r.grupos;
                return {
                    cols: [
                        { key: 'nome', label: 'Grupo' }, { key: 'categoria', label: 'Categoria' }, { key: 'lider', label: 'Líder' },
                        { key: 'telefoneLider', label: 'Telefone' },
                        { key: (g) => [g.diaSemana, g.horario].filter(Boolean).join(' '), label: 'Dia/Horário', csv: (g) => [g.diaSemana, g.horario].filter(Boolean).join(' ') },
                        { key: 'local', label: 'Endereço / local' }, { key: 'participantes', label: 'Participantes', fmt: 'numero' },
                        { key: 'reunioes', label: 'Reuniões no período', fmt: 'numero' }, { key: 'mediaPresentes', label: 'Média presentes', fmt: 'numero' },
                        { key: 'ultimaReuniao', label: 'Última reunião', fmt: 'data' }, { key: 'situacao', label: 'Situação' }
                    ],
                    rows, footer: { participantes: rows.reduce((s, g) => s + g.participantes, 0), reunioes: rows.reduce((s, g) => s + g.reunioes, 0) },
                    resumo: `${rows.length} grupo(s)`
                };
            }
        }
    };

    let atual = 'membros';
    let ultimo = null;

    // Botões de tipo
    let grupoAnterior = '';
    Object.entries(RELATORIOS).forEach(([k, r]) => {
        if (r.grupo !== grupoAnterior) { $('tipos').insertAdjacentHTML('beforeend', `<div class="rl-grupo-titulo">${r.grupo}</div>`); grupoAnterior = r.grupo; }
        $('tipos').insertAdjacentHTML('beforeend', `<button type="button" class="rl-tipo" data-k="${k}">${RL.esc(r.titulo)}</button>`);
    });
    $('tipos').addEventListener('click', (e) => {
        const b = e.target.closest('.rl-tipo');
        if (!b) return;
        selecionar(b.dataset.k);
        gerar();
    });

    function selecionar(k) {
        atual = k;
        document.querySelectorAll('.rl-tipo').forEach((b) => b.classList.toggle('ativo', b.dataset.k === k));
        const f = RELATORIOS[k].filtros;
        document.querySelectorAll('[data-f]').forEach((el) => { el.style.display = f.includes(el.dataset.f) ? '' : 'none'; });
        $('titulo').textContent = RELATORIOS[k].titulo;
        try { localStorage.setItem('ldfpRelSec', k); } catch (_) { /* ignore */ }
    }

    async function gerar() {
        const rel = RELATORIOS[atual];
        RL.status($('status'), 'Gerando…');
        $('saida').innerHTML = '';
        try {
            ultimo = await rel.run();
            RL.tabela($('saida'), ultimo.cols, ultimo.rows, { footer: ultimo.footer });
            RL.status($('status'), ultimo.resumo || '');
        } catch (e) {
            ultimo = null;
            RL.status($('status'), e.message, true);
        }
    }

    function subtitulo() {
        const f = RELATORIOS[atual].filtros;
        const p = [];
        if (f.includes('periodo') && (v('inicio') || v('fim'))) p.push(`Período ${RL.data(v('inicio')) || '…'} a ${RL.data(v('fim')) || '…'}`);
        if (f.includes('mes')) p.push(RL.MESES_LONGOS[v('mes') - 1]);
        if (f.includes('situacao') && v('situacao')) p.push(`Situação: ${v('situacao')}`);
        if (ultimo && ultimo.resumo) p.push(ultimo.resumo);
        return p.join(' · ');
    }

    RL.MESES_LONGOS.forEach((m, i) => $('mes').insertAdjacentHTML('beforeend', `<option value="${i + 1}">${m}</option>`));
    $('mes').value = String(new Date().getMonth() + 1);
    $('btnGerar').addEventListener('click', gerar);
    $('btnCSV').addEventListener('click', () => {
        if (!ultimo || !ultimo.rows.length) { RL.status($('status'), 'Gere o relatório antes de exportar.', true); return; }
        RL.exportarCSV(`${RELATORIOS[atual].titulo} ${RL.hojeISO()}`, ultimo.cols, ultimo.rows);
    });
    $('btnImprimir').addEventListener('click', () => RL.imprimir(RELATORIOS[atual].titulo, subtitulo()));

    let inicial = 'membros';
    try { const s = localStorage.getItem('ldfpRelSec'); if (s && RELATORIOS[s]) inicial = s; } catch (_) { /* ignore */ }
    selecionar(inicial);
    gerar();
})();
</script>
</body>
</html>
