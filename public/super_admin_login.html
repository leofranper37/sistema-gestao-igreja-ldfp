<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Master — LDFP</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        .card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 32px;
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            background: linear-gradient(135deg, #2563eb, #60a5fa);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
        }

        .logo-text h1 {
            font-size: 18px;
            font-weight: 800;
            color: #f1f5f9;
            letter-spacing: 0.3px;
        }

        .logo-text span {
            font-size: 11px;
            color: #10b981;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h2 {
            font-size: 22px;
            font-weight: 700;
            color: #f1f5f9;
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 13px;
            color: #64748b;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #94a3b8;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px 14px;
            background: #0f172a;
            border: 1px solid #334155;
            border-radius: 8px;
            font-size: 14px;
            color: #f1f5f9;
            outline: none;
            transition: border-color 0.2s;
        }

        input:focus {
            border-color: #2563eb;
        }

        input::placeholder {
            color: #475569;
        }

        .btn {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
        }

        .btn:hover:not(:disabled) {
            background: #1d4ed8;
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error-msg {
            display: none;
            margin-top: 14px;
            padding: 11px 14px;
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 8px;
            color: #fca5a5;
            font-size: 13px;
            text-align: center;
        }

        .error-msg.show { display: block; }

        .divider {
            border-top: 1px solid #1e293b;
            margin: 28px 0 16px;
        }

        .back-link {
            display: block;
            text-align: center;
            font-size: 12px;
            color: #475569;
            text-decoration: none;
        }

        .back-link:hover { color: #64748b; }

        .spinner {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            vertical-align: middle;
            margin-right: 6px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo">
            <div class="logo-icon">L</div>
            <div class="logo-text">
                <h1>LDFP Master</h1>
                <span>Área Restrita</span>
            </div>
        </div>

        <h2>Acesso ao Painel</h2>
        <p class="subtitle">Exclusivo para o administrador do sistema LDFP.</p>

        <form id="loginForm" autocomplete="off">
            <div class="field">
                <label for="email">E-mail</label>
                <input id="email" type="email" placeholder="seu@email.com" required autocomplete="username">
            </div>
            <div class="field">
                <label for="senha">Senha</label>
                <input id="senha" type="password" placeholder="••••••••" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn" id="submitBtn">Entrar</button>
            <div class="error-msg" id="errorMsg"></div>
        </form>

        <div class="divider"></div>
        <a class="back-link" href="login.html">← Voltar para login de clientes</a>
    </div>

    <script src="session.js?v=20260501"></script>
    <script>
        (function () {
            // Se já está logado como super-admin, vai direto pro painel
            const auth = window.getStoredAuth?.();
            if (auth?.token) {
                const role = String(auth?.user?.role || '').trim().toLowerCase();
                if (role === 'super-admin') {
                    window.location.href = '/super_admin';
                    return;
                }
                // Logado como outro role — limpa e pede login master
                window.clearAuthSession?.();
            }

            const form    = document.getElementById('loginForm');
            const emailEl = document.getElementById('email');
            const senhaEl = document.getElementById('senha');
            const btnEl   = document.getElementById('submitBtn');
            const errEl   = document.getElementById('errorMsg');

            function showError(msg) {
                errEl.textContent = msg;
                errEl.classList.add('show');
            }

            function clearError() {
                errEl.classList.remove('show');
            }

            function setLoading(on) {
                btnEl.disabled = on;
                btnEl.innerHTML = on
                    ? '<span class="spinner"></span>Verificando...'
                    : 'Entrar';
            }

            form.addEventListener('submit', async (e) => {
                e.preventDefault();
                clearError();

                const email = emailEl.value.trim().toLowerCase();
                const senha = senhaEl.value;

                if (!email || !senha) {
                    showError('Preencha e-mail e senha.');
                    return;
                }

                setLoading(true);

                try {
                    const resp = await fetch('/login', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, senha })
                    });

                    const data = await resp.json().catch(() => ({}));

                    if (!resp.ok) {
                        showError(data?.error || data?.message || 'E-mail ou senha incorretos.');
                        return;
                    }

                    const role = String(data?.user?.role || data?.role || '').trim().toLowerCase();

                    if (role !== 'super-admin') {
                        showError('Acesso negado. Esta área é exclusiva para o administrador LDFP.');
                        return;
                    }

                    // Salva sessão e redireciona
                    window.saveAuthSession?.({
                        token: data.token,
                        user: data.user
                    });

                    window.location.href = '/super_admin';

                } catch (err) {
                    showError('Erro de conexão. Verifique sua internet e tente novamente.');
                } finally {
                    setLoading(false);
                }
            });
        })();
    </script>
</body>
</html>
