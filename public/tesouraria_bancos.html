<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Contas Bancárias</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tesouraria-ui.css">
    <script src="tema.js"></script>
</head>
<body class="theme-petroleo enterprise-shell-page tx-ui"
      data-shell-title="Contas Bancárias"
      data-shell-breadcrumb="LDFP / Tesouraria / Bancos e Contas"
      data-shell-active="tesouraria_bancos.html"
      data-shell-chip="Tesouraria">

<main class="main-content enterprise-main">
    <div class="tx-page">
        <div class="tx-titlebar">
            <h2>Contas Bancárias</h2>
            <nav class="tx-crumbs" aria-label="Caminho">
                <a href="tesouraria_dizimos.html">Tesouraria</a><span class="sep">›</span>
                <span class="atual">Contas Bancárias</span>
            </nav>
        </div>

        <section class="tx-card" aria-label="Resumo das contas">
            <div class="tx-card-head">
                <h3><span class="ico"><i class="fa-solid fa-building-columns"></i></span> Bancos e Contas</h3>
                <a class="tx-btn tx-btn-primary" href="banco_conta.html"><i class="fa-solid fa-plus"></i> Nova conta</a>
            </div>
            <div class="tx-stats">
                <div><span>Contas correntes</span><strong id="sCorrente">R$ 0,00</strong></div>
                <div><span>Aplicações</span><strong id="sAplicacao">R$ 0,00</strong></div>
                <div><span>Faturas de cartão</span><strong class="neg" id="sCartao">R$ 0,00</strong></div>
                <div><span>Disponível</span><strong class="destaque" id="sTotal">R$ 0,00</strong></div>
            </div>
        </section>

        <div class="tx-toolbar" style="margin:16px 0 12px;padding:0;">
            <div class="tx-search">
                <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                <input id="busca" class="tx-input" type="search" placeholder="Buscar conta, banco ou agência..." autocomplete="off" aria-label="Buscar conta">
            </div>
            <label class="tx-check" style="align-items:center;white-space:nowrap;">
                <input type="checkbox" id="mostrarInativas"> <span>Mostrar desativadas</span>
            </label>
        </div>

        <div id="lista" class="tx-contas" aria-live="polite">
            <div class="tx-conta"><div class="tx-skel" style="height:90px;"></div></div>
            <div class="tx-conta"><div class="tx-skel" style="height:90px;"></div></div>
        </div>
    </div>
</main>

<script src="session.js"></script>
<script src="enterprise-shell.js"></script>
<script src="tesouraria-ui.js"></script>
<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const TIPO = {
        corrente: { rotulo: 'Conta corrente', ico: 'fa-building-columns' },
        aplicacao: { rotulo: 'Aplicação', ico: 'fa-piggy-bank' },
        cartao: { rotulo: 'Cartão de crédito', ico: 'fa-credit-card' }
    };
    const LEGADO = { poupanca: 'aplicacao', investimento: 'aplicacao' };
    let contas = [];

    const tipoDe = (c) => (TIPO[c.tipo] ? c.tipo : LEGADO[c.tipo] || 'corrente');
    function detalhe(c) {
        if (tipoDe(c) === 'cartao') return `${c.banco || 'Cartão'} · final ${c.final_cartao || '----'}`;
        const ag = c.agencia ? `Ag. ${c.agencia}` : '';
        const cc = c.conta ? `C/C ${c.conta}${c.digito ? '-' + c.digito : ''}` : '';
        return [c.banco, ag, cc].filter(Boolean).join(' · ') || 'Sem dados bancários';
    }

    function render() {
        const q = $('busca').value.trim().toLowerCase();
        const inativas = $('mostrarInativas').checked;
        const itens = contas.filter((c) => (inativas || Number(c.ativo) !== 0)
            && (!q || [c.nome, c.banco, c.agencia, c.conta, c.conta_contabil].some((v) => String(v || '').toLowerCase().includes(q))));

        if (!contas.length) {
            $('lista').innerHTML = `<section class="tx-card" style="grid-column:1/-1;"><div class="tx-empty">
                <div class="ico"><i class="fa-solid fa-building-columns"></i></div>
                <strong>Nenhuma conta cadastrada</strong>
                <span>Cadastre a conta corrente da igreja, aplicações e cartões para controlar os saldos.</span>
                <a class="tx-btn tx-btn-primary" href="banco_conta.html" style="margin-top:12px;"><i class="fa-solid fa-plus"></i> Nova conta</a>
            </div></section>`;
            return;
        }
        if (!itens.length) {
            $('lista').innerHTML = '<section class="tx-card" style="grid-column:1/-1;"><div class="tx-empty"><strong>Nenhuma conta encontrada</strong><span>Tente buscar com outros termos.</span></div></section>';
            return;
        }
        $('lista').innerHTML = itens.map((c) => {
            const t = TIPO[tipoDe(c)];
            const saldo = Number(c.saldo_atual || 0);
            const cartao = tipoDe(c) === 'cartao';
            const rotSaldo = cartao ? 'Fatura em aberto' : 'Saldo atual';
            const valor = cartao ? Math.max(0, -saldo) : saldo;
            const classe = cartao ? (valor > 0 ? 'tx-valor-neg' : '') : saldo < 0 ? 'tx-valor-neg' : 'tx-valor-pos';
            return `<article class="tx-conta ${Number(c.ativo) === 0 ? 'inativa' : ''}">
                <div class="tx-conta-topo">
                    <span class="ico"><i class="fa-solid ${t.ico}"></i></span>
                    <div>
                        <strong>${TX.esc(c.nome)}${Number(c.ativo) === 0 ? '<span class="tx-tag">Desativada</span>' : ''}${Number(c.compartilhado) === 1 ? '<span class="tx-tag" title="Compartilhada com congregações">Congregações</span>' : ''}</strong>
                        <small>${TX.esc(t.rotulo)} · ${TX.esc(detalhe(c))}</small>
                    </div>
                </div>
                <div class="tx-conta-saldo"><span>${rotSaldo}</span><b class="${classe}">${TX.money(valor)}</b></div>
                <div class="tx-conta-rodape">
                    <span title="Conta contábil">${c.conta_contabil ? TX.esc(c.conta_contabil) : 'Sem conta contábil'}</span>
                    <div class="tx-conta-acoes">
                        <a class="tx-btn-icon" href="bancos_lancamentos.html?conta=${encodeURIComponent(c.id)}" title="Lançamentos" aria-label="Lançamentos de ${TX.esc(c.nome)}"><i class="fa-solid fa-list"></i></a>
                        <a class="tx-btn-icon" href="banco_conta.html?id=${encodeURIComponent(c.id)}" title="Editar" aria-label="Editar ${TX.esc(c.nome)}"><i class="fa-solid fa-pen"></i></a>
                        <button class="tx-btn-icon danger" type="button" data-excluir="${TX.esc(c.id)}" data-nome="${TX.esc(c.nome)}" title="Excluir" aria-label="Excluir ${TX.esc(c.nome)}"><i class="fa-solid fa-trash"></i></button>
                    </div>
                </div>
            </article>`;
        }).join('');
    }

    function totais() {
        const soma = { corrente: 0, aplicacao: 0, cartao: 0 };
        contas.filter((c) => Number(c.ativo) !== 0).forEach((c) => { soma[tipoDe(c)] += Number(c.saldo_atual || 0); });
        $('sCorrente').textContent = TX.money(soma.corrente);
        $('sAplicacao').textContent = TX.money(soma.aplicacao);
        $('sCartao').textContent = TX.money(Math.max(0, -soma.cartao));
        $('sTotal').textContent = TX.money(soma.corrente + soma.aplicacao);
    }

    async function carregar() {
        try {
            contas = await TX.api('/banco/contas?saldo=1');
        } catch (e) {
            $('lista').innerHTML = `<section class="tx-card" style="grid-column:1/-1;"><div class="tx-empty"><div class="ico"><i class="fa-solid fa-triangle-exclamation"></i></div><strong>Não foi possível carregar</strong><span>${TX.esc(e.message)}</span></div></section>`;
            return;
        }
        totais();
        render();
    }

    $('busca').addEventListener('input', render);
    $('mostrarInativas').addEventListener('change', render);
    $('lista').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-excluir]');
        if (!b) return;
        const ok = await TX.confirmar({ titulo: 'Excluir conta', texto: `Excluir a conta "${b.dataset.nome}"? Só é possível excluir contas sem lançamentos.` });
        if (!ok) return;
        try {
            await TX.api(`/banco/contas/${encodeURIComponent(b.dataset.excluir)}`, { method: 'DELETE' });
            TX.toast('Conta excluída.');
            carregar();
        } catch (err) {
            TX.toast(err.message, 'erro');
        }
    });

    TX.toastPendente();
    carregar();
})();
</script>
</body>
</html>
