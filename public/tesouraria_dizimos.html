<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LDFP - Lançamentos de Dízimos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="tesouraria-ui.css">
</head>
<body class="theme-petroleo enterprise-shell-page tes-dark"
      data-shell-title="Lançamentos de Dízimos"
      data-shell-breadcrumb="LDFP / Tesouraria / Dízimos"
      data-shell-active="tesouraria_dizimos.html"
      data-shell-chip="Tesouraria">

<main class="main-content enterprise-main">
    <div class="tx-page">
        <div class="tx-titlebar">
            <h2>Lançamentos de Dízimos</h2>
            <nav class="tx-crumbs" aria-label="Caminho">
                <a href="tesouraria_dizimos.html">Tesouraria</a><span class="sep">›</span>
                <a href="tesouraria_dizimos.html">Dízimos</a><span class="sep">›</span>
                <span class="atual">Lançamentos</span>
            </nav>
        </div>

        <section class="tx-kpis" aria-label="Totais">
            <div class="tx-kpi k1">
                <strong id="kTotalMes">R$ 0,00</strong>
                <span id="kTotalMesRot">Total do mês</span>
                <i class="fa-solid fa-hand-holding-dollar" aria-hidden="true"></i>
            </div>
            <div class="tx-kpi k2">
                <strong id="kQtd">0</strong>
                <span id="kQtdRot">Lançamentos no mês</span>
                <i class="fa-solid fa-file-invoice" aria-hidden="true"></i>
            </div>
            <div class="tx-kpi k3">
                <strong id="kAno">R$ 0,00</strong>
                <span id="kAnoRot">Total do ano</span>
                <i class="fa-solid fa-calendar-check" aria-hidden="true"></i>
            </div>
        </section>

        <section class="tx-card">
            <div class="tx-toolbar">
                <div class="tx-search">
                    <i class="fa-solid fa-magnifying-glass" aria-hidden="true"></i>
                    <input id="busca" class="tx-input" type="search" placeholder="Buscar por nome do membro..." autocomplete="off" aria-label="Buscar">
                </div>
                <div class="tx-pop-wrap">
                    <button id="btnFiltro" class="tx-btn tx-btn-ghost" type="button" aria-haspopup="true" aria-expanded="false" title="Filtros">
                        <i class="fa-solid fa-filter"></i> <span class="tx-count" id="filtroCount">1</span>
                    </button>
                    <div id="popFiltro" class="tx-pop" role="dialog" aria-label="Filtros">
                        <div class="tx-field">
                            <label for="fMes">Mês/Ano (competência)</label>
                            <input id="fMes" class="tx-input" type="month">
                        </div>
                        <div class="tx-field">
                            <label for="fTipo">Tipo</label>
                            <select id="fTipo">
                                <option value="">Todos</option>
                                <option value="dizimo">Dízimo</option>
                                <option value="oferta">Oferta</option>
                                <option value="missoes">Missões</option>
                                <option value="outros">Outros</option>
                            </select>
                        </div>
                        <div class="tx-actions">
                            <button id="btnLimparFiltro" class="tx-btn tx-btn-ghost tx-btn-sm" type="button">Limpar</button>
                            <button id="btnAplicarFiltro" class="tx-btn tx-btn-primary tx-btn-sm" type="button">Aplicar</button>
                        </div>
                    </div>
                </div>
                <a class="tx-btn tx-btn-primary" href="dizimo_lancamento.html"><i class="fa-solid fa-plus"></i> Novo</a>
            </div>
            <div class="tx-chips" id="chips"></div>

            <div class="tx-table-wrap">
                <table class="tx-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-ord="data">Data <i class="fa-solid fa-sort-down"></i></th>
                            <th>Membro</th>
                            <th>Tipo</th>
                            <th class="sortable" data-ord="comp">Mês/Ano <i class="fa-solid fa-sort"></i></th>
                            <th class="sortable num" data-ord="valor">Valor <i class="fa-solid fa-sort"></i></th>
                            <th class="acoes">Ações</th>
                        </tr>
                    </thead>
                    <tbody id="linhas"></tbody>
                </table>
            </div>
            <div class="tx-foot">
                <span id="contagem">0 registro(s)</span>
                <div class="tx-pages" id="paginas"></div>
            </div>
        </section>
    </div>
</main>

<script src="session.js"></script>
<script src="enterprise-shell.js"></script>
<script src="tesouraria-ui.js"></script>
<script>
(function () {
    'use strict';
    const $ = (id) => document.getElementById(id);
    const POR_PAGINA = 20;

    const estado = {
        competencia: TX.competenciaAtual(),   // filtro da lista ('' = todas)
        tipo: '',
        busca: '',
        pagina: 1,
        itens: [],
        ordem: { campo: 'data', desc: true }
    };

    // ── Cartões do topo ──────────────────────────────────────────────────
    async function carregarResumo() {
        const comp = estado.competencia || TX.competenciaAtual();
        try {
            const r = await TX.api(`/dizimos/resumo?competencia=${encodeURIComponent(comp)}`);
            $('kTotalMes').textContent = TX.money(r.totalMes);
            $('kTotalMesRot').textContent = `Total do mês (${r.competencia})`;
            $('kQtd').textContent = r.lancamentosMes;
            $('kQtdRot').textContent = `Lançamentos em ${r.competencia}`;
            $('kAno').textContent = TX.money(r.totalAno);
            $('kAnoRot').textContent = `Total do ano de ${r.ano}`;
        } catch (e) {
            if (e.status !== 403 && e.status !== 402) TX.toast(e.message, 'erro');
        }
    }

    // ── Lista ────────────────────────────────────────────────────────────
    function linhaCarregando() {
        $('linhas').innerHTML = Array.from({ length: 4 }, () =>
            `<tr>${'<td><div class="tx-skel"></div></td>'.repeat(6)}</tr>`).join('');
    }

    async function carregarLista() {
        linhaCarregando();
        const p = new URLSearchParams({ page: estado.pagina, limit: POR_PAGINA });
        if (estado.competencia) p.set('competencia', estado.competencia);
        if (estado.tipo) p.set('tipo', estado.tipo);
        if (estado.busca) p.set('membroNome', estado.busca);
        try {
            const r = await TX.api(`/dizimos?${p}`);
            estado.itens = r.items || [];
            renderLista();
            renderPaginas(r.meta || { page: 1, totalPages: 1, total: estado.itens.length });
        } catch (e) {
            estado.itens = [];
            $('linhas').innerHTML = `<tr><td colspan="6"><div class="tx-empty"><div class="ico"><i class="fa-solid fa-triangle-exclamation"></i></div><strong>Não foi possível carregar</strong><span>${TX.esc(e.message)}</span></div></td></tr>`;
            $('paginas').innerHTML = '';
            $('contagem').textContent = '';
        }
    }

    function chaveOrdem(item) {
        if (estado.ordem.campo === 'valor') return Number(item.valor);
        if (estado.ordem.campo === 'comp') {
            const [m, a] = String(item.competencia).split('/');
            return Number(a) * 100 + Number(m);
        }
        return String(item.data_lancamento || item.created_at || '');
    }

    function renderLista() {
        const itens = [...estado.itens].sort((a, b) => {
            const x = chaveOrdem(a), y = chaveOrdem(b);
            const c = x < y ? -1 : x > y ? 1 : 0;
            return estado.ordem.desc ? -c : c;
        });
        if (!itens.length) {
            $('linhas').innerHTML = `<tr><td colspan="6"><div class="tx-empty">
                <div class="ico"><i class="fa-solid fa-magnifying-glass"></i></div>
                <strong>Nenhum lançamento de dízimo encontrado</strong>
                <span>${estado.busca || estado.tipo ? 'Tente buscar com outros termos.' : 'Clique em <b>Novo</b> para registrar o primeiro lançamento.'}</span>
            </div></td></tr>`;
            return;
        }
        $('linhas').innerHTML = itens.map((d) => {
            const tipo = d.tipo || 'dizimo';
            const ficha = d.membro_id ? `<span class="sub">Ficha #${String(d.membro_id).padStart(6, '0')}</span>` : '<span class="sub">Não cadastrado</span>';
            return `<tr>
                <td>${TX.dataBR(d.data_lancamento || d.created_at)}</td>
                <td>${TX.esc(d.membro_nome)}${ficha}</td>
                <td><span class="tx-badge ${TX.esc(tipo)}">${TX.esc(TX.TIPOS[tipo] || tipo)}</span></td>
                <td>${TX.esc(d.competencia)}</td>
                <td class="num">${TX.money(d.valor)}</td>
                <td class="acoes">
                    <a class="tx-btn-icon" href="dizimo_lancamento.html?id=${encodeURIComponent(d.id)}" title="Editar" aria-label="Editar lançamento de ${TX.esc(d.membro_nome)}"><i class="fa-solid fa-pen"></i></a>
                    <button class="tx-btn-icon danger" type="button" data-excluir="${TX.esc(d.id)}" data-nome="${TX.esc(d.membro_nome)}" title="Excluir" aria-label="Excluir lançamento de ${TX.esc(d.membro_nome)}"><i class="fa-solid fa-trash"></i></button>
                </td>
            </tr>`;
        }).join('');
    }

    function renderPaginas(meta) {
        const total = Number(meta.total || 0);
        $('contagem').textContent = `${total} registro(s)`;
        const tp = Number(meta.totalPages || 1);
        if (tp <= 1) { $('paginas').innerHTML = ''; return; }
        const atual = Number(meta.page || 1);
        const ini = Math.max(1, atual - 2), fim = Math.min(tp, ini + 4);
        let html = `<button type="button" data-pag="${atual - 1}" ${atual === 1 ? 'disabled' : ''} aria-label="Anterior">‹</button>`;
        for (let i = ini; i <= fim; i++) html += `<button type="button" data-pag="${i}" class="${i === atual ? 'atual' : ''}">${i}</button>`;
        html += `<button type="button" data-pag="${atual + 1}" ${atual === tp ? 'disabled' : ''} aria-label="Próxima">›</button>`;
        $('paginas').innerHTML = html;
    }

    // ── Filtros ──────────────────────────────────────────────────────────
    function renderChips() {
        const chips = [];
        if (estado.competencia) chips.push(['competencia', `Competência: ${estado.competencia}`]);
        if (estado.tipo) chips.push(['tipo', `Tipo: ${TX.TIPOS[estado.tipo]}`]);
        $('chips').innerHTML = chips.map(([k, t]) =>
            `<span class="tx-chip">${TX.esc(t)}<button type="button" data-chip="${k}" aria-label="Remover filtro">×</button></span>`).join('');
        $('filtroCount').textContent = chips.length;
        $('filtroCount').style.display = chips.length ? '' : 'none';
    }

    function abrirFiltro(abrir) {
        $('popFiltro').classList.toggle('aberto', abrir);
        $('btnFiltro').setAttribute('aria-expanded', String(abrir));
        if (abrir) {
            $('fMes').value = TX.competenciaParaMes(estado.competencia);
            $('fTipo').value = estado.tipo;
        }
    }

    function recarregar() {
        estado.pagina = 1;
        renderChips();
        carregarResumo();
        carregarLista();
    }

    $('btnFiltro').addEventListener('click', (e) => {
        e.stopPropagation();
        abrirFiltro(!$('popFiltro').classList.contains('aberto'));
    });
    $('popFiltro').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('click', () => abrirFiltro(false));
    $('btnAplicarFiltro').addEventListener('click', () => {
        estado.competencia = TX.mesParaCompetencia($('fMes').value);
        estado.tipo = $('fTipo').value;
        abrirFiltro(false);
        recarregar();
    });
    $('btnLimparFiltro').addEventListener('click', () => {
        estado.competencia = '';
        estado.tipo = '';
        abrirFiltro(false);
        recarregar();
    });
    $('chips').addEventListener('click', (e) => {
        const b = e.target.closest('[data-chip]');
        if (!b) return;
        estado[b.dataset.chip] = '';
        recarregar();
    });
    $('busca').addEventListener('input', TX.debounce(() => {
        estado.busca = $('busca').value.trim();
        estado.pagina = 1;
        carregarLista();
    }, 300));

    document.querySelectorAll('th.sortable').forEach((th) => th.addEventListener('click', () => {
        const campo = th.dataset.ord;
        estado.ordem = { campo, desc: estado.ordem.campo === campo ? !estado.ordem.desc : true };
        document.querySelectorAll('th.sortable i').forEach((i) => { i.className = 'fa-solid fa-sort'; });
        th.querySelector('i').className = `fa-solid ${estado.ordem.desc ? 'fa-sort-down' : 'fa-sort-up'}`;
        renderLista();
    }));

    $('paginas').addEventListener('click', (e) => {
        const b = e.target.closest('[data-pag]');
        if (!b || b.disabled) return;
        estado.pagina = Number(b.dataset.pag);
        carregarLista();
    });

    $('linhas').addEventListener('click', async (e) => {
        const b = e.target.closest('[data-excluir]');
        if (!b) return;
        const ok = await TX.confirmar({
            titulo: 'Excluir lançamento',
            texto: `Excluir o lançamento de ${b.dataset.nome}? Esta ação não pode ser desfeita.`
        });
        if (!ok) return;
        try {
            await TX.api(`/dizimos/${encodeURIComponent(b.dataset.excluir)}`, { method: 'DELETE' });
            TX.toast('Lançamento excluído.');
            carregarResumo();
            carregarLista();
        } catch (err) {
            TX.toast(err.message, 'erro');
        }
    });

    TX.toastPendente();
    renderChips();
    carregarResumo();
    carregarLista();
})();
</script>
</body>
</html>
