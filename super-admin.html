<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LDFP Master — Painel</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/ldfp-design-system.css">
  <style>
    body { display: flex; height: 100vh; overflow: hidden; }
    .main-wrap { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .page-body { flex: 1; overflow-y: auto; padding: 28px; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside class="ldfp-sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-logo">L</div>
      <div>
        <div class="sidebar-brand-name">LDFP Gestão</div>
        <div class="sidebar-brand-sub">Painel Master</div>
      </div>
    </div>

    <nav class="sidebar-nav">
      <div class="sidebar-section">Negócio</div>
      <a class="sidebar-item active" data-view="dashboard">
        <i class="fa-solid fa-chart-line"></i> Dashboard
      </a>
      <a class="sidebar-item" data-view="metricas">
        <i class="fa-solid fa-chart-pie"></i> Métricas SaaS
      </a>
      <a class="sidebar-item" data-view="igrejas">
        <i class="fa-solid fa-church"></i> Igrejas
      </a>
      <a class="sidebar-item" data-view="assinaturas">
        <i class="fa-solid fa-file-invoice-dollar"></i> Assinaturas
      </a>

      <div class="sidebar-section">Plataforma</div>
      <a class="sidebar-item" data-view="planos">
        <i class="fa-solid fa-tags"></i> Planos & Preços
        <span class="sidebar-badge">CRUD</span>
      </a>
      <a class="sidebar-item" data-view="modulos">
        <i class="fa-solid fa-puzzle-piece"></i> Módulos
      </a>
      <a class="sidebar-item" data-view="novidades">
        <i class="fa-solid fa-bell"></i> Novidades
      </a>
      <a class="sidebar-item" href="admin-inovacoes.html">
        <i class="fa-solid fa-lightbulb"></i> Fábrica de Inovações
      </a>

      <div class="sidebar-section">Sistema</div>
      <a class="sidebar-item" data-view="usuarios">
        <i class="fa-solid fa-users"></i> Usuários
      </a>
      <a class="sidebar-item" data-view="logs">
        <i class="fa-solid fa-server"></i> Logs
      </a>
    </nav>

    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-avatar" id="sidebarAvatar">—</div>
        <div>
          <div class="sidebar-user-name" id="sidebarName">—</div>
          <div class="sidebar-user-role">super-admin</div>
        </div>
      </div>
      <button class="btn btn-ghost btn-sm btn-full" id="btnLogout"
        style="margin-top:12px;color:rgba(255,255,255,.5);border-color:rgba(255,255,255,.1)">
        <i class="fa-solid fa-right-from-bracket"></i> Sair
      </button>
    </div>
  </aside>

  <!-- MAIN -->
  <div class="main-wrap">
    <header class="ldfp-topbar">
      <div>
        <div class="topbar-title" id="topbarTitle">Dashboard</div>
        <div class="topbar-sub"  id="topbarSub">Visão geral da rede LDFP</div>
      </div>
      <div id="topbarActions"></div>
    </header>

    <div class="page-body" id="pageBody">
      <div class="text-muted text-sm">Carregando...</div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="ldfp-overlay" id="overlay">
    <div class="ldfp-modal">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle">—</div>
          <div class="modal-sub"   id="modalSub"></div>
        </div>
        <button class="modal-close" id="modalClose">×</button>
      </div>
      <div class="modal-body"   id="modalBody"></div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <!-- TOAST -->
  <div class="ldfp-toast" id="toast">
    <div class="toast-dot"></div>
    <span id="toastMsg"></span>
  </div>

  <script src="js/auth.js"></script>
  <script src="js/ldfp-master.js"></script>
</body>
</html>
